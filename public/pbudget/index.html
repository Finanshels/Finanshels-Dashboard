/* ==========================================================================
   PHASE 2 — period maths shared by Efficiency and Compare
   ========================================================================== */

/* The latest month with real activity, capped at today. Anchoring a "last 3
   months" preset on the last month the dashboard KNOWS about would resolve to
   Oct-Dec, because the budget runs to December (marketing budget, doc 44). */
function lastActualMonth(){
  var best = null;
  M.months.forEach(function(ym){
    var y = +ym.slice(0,4), m = +ym.slice(5) - 1;
    var hasRev = rev(ym, 'all');
    var hasCost = !!M.cost[ym];
    if (!hasRev && !hasCost) return;
    if (!best || y > best.y || (y === best.y && m > best.m)) best = { y:y, m:m };
  });
  var now = new Date();
  if (!best) return { y: now.getFullYear(), m: now.getMonth() };
  if (best.y > now.getFullYear() || (best.y === now.getFullYear() && best.m > now.getMonth()))
    return { y: now.getFullYear(), m: now.getMonth() };
  return best;
}

/* Sum the engine across a set of months. Every figure still comes from pnl(),
   so a period total can never disagree with the month it contains. */
function agg(months, ch){
  var LINES = [LINE.REV, LINE.ARR, LINE.REV1, LINE.REVR, 'ARR1', 'ARRR', 'REVB', 'REVB1', 'REVBR', 'REVO', 'COGS', LINE.PAY, LINE.WAGE, LINE.TRAV,
               LINE.MEAL, LINE.OTH, LINE.SELL, LINE.COMM, 'Admin'];
  var o = { L:{}, acq:{act:0,bud:null}, cm1:{act:0,bud:null}, cm2:{act:0,bud:null},
            net:{act:0,bud:null}, totalCost:{act:0,bud:null}, months:months, open:false, plan:true };
  LINES.forEach(function(l){ o.L[l] = { act:0, bud:null, posted:0, flexed:null }; });
  months.forEach(function(mm){
    var P = pnl(mm.y, mm.m, ch);
    if (P.open) o.open = true;
    if (asOfDay(mm.y, mm.m) > 0) o.plan = false;         /* at least one month has real data */
    LINES.forEach(function(l){
      var s = P.L[l]; if (!s) return;
      o.L[l].act += nz(s.act);
      if (s.bud != null) o.L[l].bud = nz(o.L[l].bud) + s.bud;
      if (s.posted != null) o.L[l].posted += nz(s.posted);
      if (s.flexed != null) o.L[l].flexed = nz(o.L[l].flexed) + s.flexed;
    });
    ['acq','cm1','cm2','net','totalCost'].forEach(function(k){
      o[k].act += nz(P[k].act);
      if (P[k].bud != null) o[k].bud = nz(o[k].bud) + P[k].bud;
    });
  });
  return o;
}
function monthsBack(anchor, n){
  var out = [];
  for (var i = n-1; i >= 0; i--) {
    var d = new Date(anchor.y, anchor.m - i, 1);
    out.push({ y:d.getFullYear(), m:d.getMonth() });
  }
  return out;
}
function ytdMonths(y, upto){ var a = []; for (var i=0;i<=upto;i++) a.push({y:y,m:i}); return a; }
function labelOf(months){
  if (months.length === 1) return MONTHS[months[0].m] + ' ' + months[0].y;
  var a = months[0], b = months[months.length-1];
  return MONTHS[a.m] + ' ' + a.y + ' → ' + MONTHS[b.m] + ' ' + b.y;
}

/* ---------- page 5: efficiency ---------- */

/* The ledger carries partnership cost from January; FinCore revenue only starts
   in August. A ratio that divides eleven months of payout by four months of
   revenue is not a rate — so every efficiency period starts at the first month
   of the year that HAS partnership revenue, and the page says which. */
function firstRevMonth(y){
  for (var i=0; i<12; i++) if (rev(ymKey(y,i), 'all')) return i;
  return 0;
}

function pageEff(){
  var y = S.year, m = S.month, anchor = lastActualMonth(), fr = firstRevMonth(y);
  var h = '';
  function usable(x){ return asOfDay(x.y,x.m) > 0 && !(x.y === y && x.m < fr) && x.y >= y; }
  var t3 = monthsBack({ y:y, m:m }, 3).filter(usable);
  var ytd = ytdMonths(y, m).filter(usable);

  h += '<div class="sec">Efficiency — ' + MONTHS[m] + ' ' + y + ' · ' + chName(S.ch) +
       '<span class="note">what a dirham of partnership cost brings back · periods start at ' + MONTHS[fr] +
       ', the first month with partnership revenue</span></div>';
  if (fr > 0)
    h += '<div class="alert">Ledger cost exists from January but FinCore revenue begins <b>' + MONTHS[fr] + ' ' + y +
         '</b>. Trailing and year-to-date rates below cover ' + MONTHS[fr] + ' onward only — dividing a full year of payout by four months of revenue would not be a rate.</div>';

  function eff(months, ch){
    var A = agg(months, ch);
    var cash = A.L[LINE.REV].act, arr = A.L[LINE.ARR].act;
    var pay = A.L[LINE.PAY].act, acq = A.acq.act, sell = A.L[LINE.SELL].act;
    return {
      A:A, cash:cash, arr:arr, pay:pay, acq:acq, one:A.L[LINE.REV1].act, rec:A.L[LINE.REVR].act,
      rateCash: cash ? pay / cash : null,
      rateArr:  arr  ? pay / arr  : null,
      arrToAcq:  acq ? arr  / acq : null,
      cashToAcq: acq ? cash / acq : null,
      recShare:  cash ? A.L[LINE.REVR].act / cash : null
    };
  }
  var now = eff([{y:y,m:m}], S.ch), tr = eff(t3, S.ch), yd = eff(ytd, S.ch);

  function card(title, v, fmt, note){
    return '<div class="card"><h3>' + title + '</h3><div class="big">' + (v == null ? '—' : fmt(v)) + '</div>' +
           '<div class="sub">' + note + '</div></div>';
  }
  var x = function(v){ return v.toFixed(2) + '×'; };
  h += '<div class="grid k4">';
  h += card('Effective payout rate', now.rateCash, function(v){ return pct(v); },
            'payout ÷ cash · trailing 3 months ' + (tr.rateCash == null ? '—' : pct(tr.rateCash)));
  h += card('Payout ÷ ARR booked', now.rateArr, function(v){ return pct(v); },
            'trailing 3 months ' + (tr.rateArr == null ? '—' : pct(tr.rateArr)));
  h += card('Recurring share of cash', now.recShare, function(v){ return pct(v); },
            'one-time ' + money(now.one) + ' · recurring ' + money(now.rec));
  h += card('ARR to acquisition cost', now.arrToAcq, x, 'annual contract value won per dirham spent');
  h += card('Cash to acquisition cost', now.cashToAcq, x, 'the same month on a cash basis');

  h += card('Payout rate, ' + MONTHS[fr] + ' to date', yd.rateCash, function(v){ return pct(v); },
            ytd.length + ' month' + (ytd.length === 1 ? '' : 's') + ' with revenue · ' + money(yd.pay) + ' paid on ' + money(yd.cash) + ' collected');
  h += '</div>';

  /* channel comparison */
  h += '<div class="sec">Month, trailing and year to date<span class="note">Channel &amp; Referral Partners</span></div>';
  h += '<div class="card"><table><tr><th>Measure</th><th>' + MONTHS[m] + ' ' + y + '</th><th>Trailing 3 months</th><th>' + MONTHS[fr] + ' to date</th></tr>';
  var cols = [now, tr, yd];
  function erow(label, f, fmt){
    return '<tr><td>' + esc(label) + '</td>' + cols.map(function(e){
      var v = f(e); return '<td>' + (v == null || (typeof v === 'number' && !isFinite(v)) ? '—' : fmt(v)) + '</td>';
    }).join('') + '</tr>';
  }

  h += erow('Cash revenue',         function(e){ return e.cash; },  function(v){ return money(v); });
  h += erow('· One-time',           function(e){ return e.one; },   function(v){ return money(v); });
  h += erow('· Recurring',          function(e){ return e.rec; },   function(v){ return money(v); });
  h += erow('ARR booked',           function(e){ return e.arr; },   function(v){ return money(v); });
  h += erow('Partner payout',       function(e){ return e.pay; },   function(v){ return money(v); });
  h += erow('Effective payout rate, on cash', function(e){ return e.rateCash; }, function(v){ return pct(v); });
  h += erow('Effective payout rate, on ARR',  function(e){ return e.rateArr; },  function(v){ return pct(v); });
  h += erow('Total acquisition cost', function(e){ return e.acq; }, function(v){ return money(v); });

  h += erow('ARR to acquisition cost', function(e){ return e.arrToAcq; }, x);

  h += '</table></div>';

  /* flexed payout across the year */
  h += '<div class="sec">Flexed payout — is the plan missing because of volume, or because of rate?' +
       '<span class="note">flexed = ' + cfgNum('Payout rate one-time %',15) + '% of actual one-time + ' + cfgNum('Payout rate recurring %',30) + '% of actual recurring, on the selected basis</span></div>';
  h += '<div class="card"><table><tr><th>Month</th><th>Budget payout</th><th>Flexed</th><th>Actual</th>' +
       '<th>Volume var</th><th>Rate var</th><th>Total var</th><th>Effective rate</th></tr>';
  var anyFlex = false;
  for (var mm=0; mm<12; mm++){
    if (asOfDay(y,mm) === 0) continue;
    var P = pnl(y, mm, S.ch), pay = P.L[LINE.PAY];
    if (pay.bud == null && !pay.act) continue;
    anyFlex = true;
    var vol = (pay.flexed == null || pay.bud == null) ? null : pay.flexed - pay.bud;
    var rt  = (pay.flexed == null) ? null : pay.act - pay.flexed;
    var tot = pay.bud == null ? null : pay.act - pay.bud;
    var er  = P.L['REVB'].act ? pay.act / P.L['REVB'].act : null;
    h += '<tr><td>' + MONTHS[mm] + (P.open ? ' <span class="tag">in progress</span>' : '') + '</td>' +
         '<td>' + (pay.bud == null ? '<span class="nb">—</span>' : money(pay.bud)) + '</td>' +
         '<td>' + (pay.flexed == null ? '<span class="nb">—</span>' : money(pay.flexed)) + '</td>' +
         '<td>' + money(pay.act) + '</td>' +
         '<td>' + (vol == null ? '<span class="nb">—</span>' : '<span class="' + (vol<=0?'f':'a') + '">' + money(vol) + '</span>') + '</td>' +
         '<td>' + (rt  == null ? '<span class="nb">—</span>' : '<span class="' + (rt <=0?'f':'a') + '">' + money(rt)  + '</span>') + '</td>' +
         '<td>' + (tot == null ? '<span class="nb">—</span>' : '<span class="' + (tot<=0?'f':'a') + '">' + money(tot) + '</span>') + '</td>' +
         '<td>' + (er == null ? '—' : pct(er)) + '</td></tr>';
  }
  h += '</table>' + (anyFlex ? '' : '<div class="alert">No month yet has both a payout plan and activity.</div>') + '</div>';

  /* partner league table */
  h += partnerTable(y, m);
  h += foot();
  return h;
}

/* ---------- partners: revenue and cost on one row (phase 4) ---------- */

function partnerBook(y){
  var ch = S.ch, P = {};
  function row(p){ return P[p] = P[p] || { p:p, n:0, cash:0, arr:0, pay:0, vendors:{} }; }

  /* revenue side — FinCore Partner Name */
  M.deals.forEach(function(d){
    if (ch !== 'all' && d.ch !== ch) return;
    if (+d.ym.slice(0,4) !== y) return;
    var r = row(d.partner);
    r.n++; r.cash += d.paid; r.arr += d.arr;
  });

  /* cost side — payout vendors joined through Partner Map */
  var unattributed = 0, unattributedVendors = {};
  Object.keys(M.payVendor).forEach(function(ym){
    if (+ym.slice(0,4) !== y) return;
    Object.keys(M.payVendor[ym]).forEach(function(k){
      if (ch !== 'all' && k !== ch) return;
      var byV = M.payVendor[ym][k];
      Object.keys(byV).forEach(function(vendor){
        var amt = byV[vendor];
        var partner = M.partnerMap[key(vendor) + '||' + k];
        if (partner) { var r = row(partner); r.pay += amt; r.vendors[vendor] = true; }
        else { unattributed += amt; unattributedVendors[vendor] = (unattributedVendors[vendor] || 0) + amt; }
      });
    });
  });

  var rows = Object.keys(P).map(function(p){ return P[p]; }).sort(function(a,b){ return b.arr - a.arr; });
  return { rows: rows, unattributed: unattributed, unattributedVendors: unattributedVendors };
}

function partnerTable(y, m){
  var B = partnerBook(y);
  var rows = B.rows;
  if (!rows.length) return '';

  var totArr = 0, totCash = 0, totN = 0, totPay = 0, namedArr = 0, blankArr = 0;
  rows.forEach(function(r){
    totArr += r.arr; totCash += r.cash; totN += r.n; totPay += r.pay;
    if (r.p === '(not named)') blankArr += r.arr; else namedArr += r.arr;
  });
  var paidTotal = totPay + B.unattributed;
  var revCov = totArr ? namedArr / totArr : 0;
  var payCov = paidTotal ? totPay / paidTotal : 0;

  var h = '<div class="sec">Partners — revenue and payout on one row' +
          '<span class="note">revenue from FinCore <b>Partner Name</b>; payout joined through the <b>Partner Map</b> tab</span></div>';

  h += '<div class="grid k4">';
  h += '<div class="card"><h3>Revenue attributed</h3><div class="big">' + pct(revCov,0) + '</div>' +
       '<div class="sub">' + money(namedArr) + ' of ' + money(totArr) + ' ARR carries a partner name</div></div>';
  h += '<div class="card"><h3>Payout attributed</h3><div class="big">' + pct(payCov,0) + '</div>' +
       '<div class="sub">' + money(totPay) + ' of ' + money(paidTotal) + ' paid is matched to a named partner</div></div>';
  h += '<div class="card"><h3>Named partners</h3><div class="big">' +
       rows.filter(function(r){ return r.p !== '(not named)'; }).length + '</div>' +
       '<div class="sub">against ' + M.mapRows.length + ' vendors in the map</div></div>';
  h += '<div class="card"><h3>Blended payout rate</h3><div class="big">' + (totArr ? pct(paidTotal/totArr) : '—') + '</div>' +
       '<div class="sub">all payout ÷ all partner ARR, ' + y + '</div></div>';
  h += '</div>';

  if (payCov < 0.8)
    h += '<div class="alert"><b>Per-partner ROI is only as good as the map.</b> ' + pct(1-payCov,0) +
         ' of payout is not yet matched to a named partner, and ' + pct(1-revCov,0) +
         ' of partner ARR carries no partner name on the deal. Fill the <b>Partner</b> column of the <b>Partner Map</b> tab, ' +
         'and ask the team to set Partner Name on every partnership deal in FinCore — the two together are what make the ROI column mean something.</div>';

  h += '<div class="card"><table><tr><th>Partner</th><th>' + y + ' deals</th><th>Cash</th><th>ARR</th>' +
       '<th>Payout</th><th>Payout ÷ ARR</th><th>ARR per AED paid</th><th>Share of ARR</th></tr>';
  rows.forEach(function(r){
    var blank = r.p === '(not named)';
    var rate = r.arr && r.pay ? r.pay / r.arr : null;
    var roi = r.pay ? r.arr / r.pay : null;
    h += '<tr><td>' + (blank ? '<span class="nb">' + esc(r.p) + '</span>' : esc(r.p)) + '</td>' +
         '<td>' + (r.n || '<span class="nb">—</span>') + '</td>' +
         '<td>' + (r.cash ? money(r.cash) : '<span class="nb">—</span>') + '</td>' +
         '<td>' + (r.arr ? money(r.arr) : '<span class="nb">—</span>') + '</td>' +
         '<td>' + (r.pay ? money(r.pay) : '<span class="nb">not matched</span>') + '</td>' +
         '<td>' + (rate == null ? '<span class="nb">—</span>' : pct(rate)) + '</td>' +
         '<td>' + (roi == null ? '<span class="nb">—</span>' : roi.toFixed(1) + '×') + '</td>' +
         '<td>' + (totArr ? pct(r.arr/totArr, 0) : '—') + '</td></tr>';
  });
  if (B.unattributed) {
    var vs = Object.keys(B.unattributedVendors).sort(function(a,b){ return B.unattributedVendors[b] - B.unattributedVendors[a]; });
    h += '<tr class="mid"><td><span class="nb">(payout not attributed)</span></td><td></td><td></td><td></td>' +
         '<td>' + money(B.unattributed) + '</td><td colspan="3" class="sub">' +
         vs.length + ' vendor' + (vs.length === 1 ? '' : 's') + ', largest: ' +
         vs.slice(0,3).map(function(v){ return esc(v) + ' ' + money(B.unattributedVendors[v]); }).join(' · ') + '</td></tr>';
  }
  h += '<tr class="tot"><td>Total</td><td>' + totN + '</td><td>' + money(totCash) + '</td><td>' + money(totArr) + '</td>' +
       '<td>' + money(paidTotal) + '</td><td>' + (totArr ? pct(paidTotal/totArr) : '—') + '</td>' +
       '<td>' + (paidTotal ? (totArr/paidTotal).toFixed(1) + '×' : '—') + '</td><td>100%</td></tr>';
  h += '</table>';

  /* the map itself, so the join is visible rather than implied */
  var suggested = M.mapRows.filter(function(r){ return r.partner && r.conf && r.conf !== 'exact'; });
  h += '<div class="sub" style="margin-top:10px">The join runs on the vendor name inside each payout line’s ' +
       '<code>transaction_details</code>. ' + M.mapRows.length + ' vendors are listed; ' +
       M.mapRows.filter(function(r){ return r.partner; }).length + ' carry a partner' +
       (suggested.length ? ', of which <b>' + suggested.length + ' are suggestions this dashboard made, not confirmations</b> (' +
        suggested.map(function(r){ return esc(r.vendor) + ' → ' + esc(r.partner) + ' <span class="tag">' + esc(r.conf) + '</span>'; }).join(', ') + ')' : '') +
       '. Edit the Partner column in the sheet; nothing here writes back.</div></div>';
  return h;
}

/* ---------- page 6: reconciliation & data quality ---------- */

function pageRecon(){
  var y = S.year, m = S.month, ym = ymKey(y,m);
  var h = '<div class="sec">Reconciliation &amp; data quality<span class="note">' + MONTHS[m] + ' ' + y +
          ' · nothing here is hidden when it does not tie</span></div>';

  /* freshness */
  h += '<div class="grid k4">';
  h += '<div class="card"><h3>As of</h3><div class="big">' + (M.asOf ? M.asOf.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—') +
       '</div><div class="sub">the earliest last-data-date across the feeds, never today</div></div>';
  h += '<div class="card"><h3>FinCore</h3><div class="big">' + (M.lastFin ? M.lastFin.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—') +
       '</div><div class="sub">' + M.rowsFin + ' rows read · ' + M.deals.length + ' partnership deals · ' + (M.failed||0) + ' onboarding_failed excluded</div></div>';
  h += '<div class="card"><h3>Ledger</h3><div class="big">' + (M.lastLed ? M.lastLed.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—') +
       '</div><div class="sub">' + M.rowsLed + ' partnership-relevant rows read from Transactions</div></div>';
  h += '<div class="card"><h3>Revenue phasing</h3><div class="big">' + M.revShapeMonths + '</div>' +
       '<div class="sub">complete month' + (M.revShapeMonths === 1 ? '' : 's') + ' behind the collection curve</div></div>';
  h += '</div>';

  /* 1. revenue definition — what is in, and what is deliberately out */
  h += '<div class="sec">1 · What counts as partnership revenue<span class="note">edit the counted list in the <b>Partnership Account Map</b> tab, rows where Source = Revenue channel</span></div>';
  h += '<div class="card"><table><tr><th>FinCore deal source group</th><th>Counted here</th><th>' + y + ' cash</th><th>' + y + ' ARR</th><th>Deals</th><th>Deal sources inside it</th></tr>';
  var gk = Object.keys(M.groups).sort(function(a,b){ return M.groups[b].cash - M.groups[a].cash; });
  gk.forEach(function(g){
    var G = M.groups[g], inC = chOf(g);
    h += '<tr><td>' + esc(g) + '</td><td>' + (inC ? '<span class="f">yes — ' + esc(inC === 'p' ? CH[0].name : CH[1].name) + '</span>' : '<span class="nb">no</span>') + '</td>' +
         '<td>' + money(G.cash) + '</td><td>' + money(G.arr) + '</td><td>' + G.n + '</td>' +
         '<td class="sub">' + Object.keys(G.srcs).map(esc).join(', ') + '</td></tr>';
  });
  h += '</table></div>';

  /* 2. ledger -> page */
  h += '<div class="sec">2 · Ledger to page, ' + MONTHS[m] + '<span class="note">every account this dashboard reads, what it became, and whether the two sides agree</span></div>';
  var led = M.ledger[ym] || {};
  var pageByLine = {};
  CH.forEach(function(c){
    var src = (M.cost[ym] || {})[c.k] || {};
    Object.keys(src).forEach(function(line){ pageByLine[line] = (pageByLine[line] || 0) + src[line]; });
  });
  h += '<div class="card"><table><tr><th>Ledger account</th><th>Ledger amount</th><th>Budget line it feeds</th><th>Note</th></tr>';
  var mappedTotal = 0;
  Object.keys(led).sort().forEach(function(acct){
    var rule = null;
    for (var i=0;i<M.map.length;i++){ var r = M.map[i]; if (r.source !== 'Revenue channel' && r.inc && r.k === key(acct)) { rule = r; break; } }
    if (rule) mappedTotal += led[acct];
    h += '<tr><td>' + esc(acct) + '</td><td>' + money(led[acct]) + '</td>' +
         '<td>' + (rule ? esc(rule.line) + (rule.match ? ' <span class="tag">only rows matching ' + esc(rule.match) + '</span>' : '') : '<span class="nb">not read</span>') + '</td>' +
         '<td class="sub">' + (rule ? esc(rule.ch === 'Both' ? 'pool — split across both channels' : rule.ch) : 'in the query window but claimed by no map row') + '</td></tr>';
  });
  h += '</table>';
  var pageTotal = 0; Object.keys(pageByLine).forEach(function(l){ pageTotal += pageByLine[l]; });
  var matchPartial = 0;
  Object.keys(led).forEach(function(a){
    var r = null; for (var i=0;i<M.map.length;i++){ var q = M.map[i]; if (q.source !== 'Revenue channel' && q.inc && q.k === key(a) && q.match) { r = q; break; } }
    if (r) matchPartial += led[a];
  });
  h += '<div class="sub" style="margin-top:8px">Page total for ' + MONTHS[m] + ': <b>' + money(pageTotal) + '</b>.' +
       (matchPartial ? ' It is smaller than the sum of the accounts above because a <i>Match</i> is set — only the matching rows of a shared account (' + money(matchPartial) + ') come across.' : '') +
       '</div></div>';

  /* 3. pools */
  h += '<div class="sec">3 · Pool split<span class="note">basis: <b>' + esc(cfg('Pool basis','cash')) + '</b> — a change of basis moves both channels without anything real happening</span></div>';
  h += '<div class="card"><table><tr><th>Pooled line</th><th>Ledger total</th>' + (CH_ALL || CH).map(function(c){ return '<th>' + esc(c.name) + (c.k === 'c' ? ' <span class="nb">(not on this page)</span>' : '') + '</th>'; }).join('') + '<th>Ties</th></tr>';
  [LINE.WAGE, LINE.TRAV, LINE.MEAL, LINE.SELL, LINE.COMM].forEach(function(line){
    var parts = (CH_ALL || CH).map(function(c){ return ((M.cost[ym]||{})[c.k]||{})[line] || 0; });
    var sum = parts.reduce(function(a,b){ return a+b; }, 0);
    var ledTot = line === LINE.SELL ? (RAW.sell[ym] || 0) : line === LINE.COMM ? (RAW.comm[ym] || 0) : ((RAW.pool[ym]||{})[line] || 0);
    var ok = (line === LINE.SELL || line === LINE.COMM) ? true : Math.abs(sum - ledTot) < 1;
    if (!sum && !ledTot) return;
    h += '<tr><td>' + esc(line) + '</td><td>' + money(ledTot) + '</td>' +
         parts.map(function(p){ return '<td>' + money(p) + '</td>'; }).join('') +
         '<td>' + ((line === LINE.SELL || line === LINE.COMM)
            ? '<span class="nb">partnership takes ' + pct((M.allRev[ym] ? rev(ym,'all')/M.allRev[ym] : 0),1) + ' of the company pool</span>'
            : (ok ? '<span class="f">' + money(sum) + ' ✓</span>' : '<span class="a">' + money(sum) + ' vs ' + money(ledTot) + '</span>')) + '</td></tr>';
  });
  h += '</table></div>';

  /* 4. payout accrued vs posted */
  h += '<div class="sec">4 · Payout — accrued against posted<span class="note">an open month accrues at the plan rate; the invoice replaces it and the gap is the true-up</span></div>';
  h += '<div class="card"><table><tr><th>Month</th><th>Posted</th><th>Accrued at plan rate</th><th>On the page</th><th>True-up when it posts</th><th>State</th></tr>';
  for (var mm=0; mm<12; mm++){
    if (asOfDay(y,mm) === 0) continue;
    var P = pnl(y, mm, S.ch), pay = P.L[LINE.PAY];
    if (!pay.act && !pay.posted) continue;
    var accrued = pay.accrued || 0;
    h += '<tr><td>' + MONTHS[mm] + '</td><td>' + money(pay.posted) + '</td><td>' + money(accrued) + '</td><td>' + money(pay.act) + '</td>' +
         '<td>' + (P.open ? money(pay.act - pay.posted) : '<span class="nb">—</span>') + '</td>' +
         '<td>' + (P.open ? '<span class="tag acc">accruing</span>' : 'closed on the ledger') + '</td></tr>';
  }
  h += '</table></div>';

  /* 5 · bridge to the Channel-wise P&L (v4) */
  h += '<div class="sec">5 · Against the Channel-wise P&amp;L, ' + MONTHS[m] +
       '<span class="note">the two pages no longer tie by design — here is why</span></div>';
  var PB = pnl(y, m, 'p');
  h += '<div class="card"><table><tr><th>Difference</th><th>AED</th><th>Why</th></tr>';
  h += '<tr><td>Net on this page</td><td>' + money(PB.net.act) + '</td><td class="sub">' + MONTHS[m] + ' ' + y + ', Channel &amp; Referral Partners, ' + (isArr() ? 'ARR' : 'cash') + ' basis</td></tr>';
  h += '<tr><td>Employee commission</td><td>' + money(nz(PB.L[LINE.COMM].act)) + '</td><td class="sub">carried here (Employee Commission (Sales) × partnership cash share); the Channel P&amp;L does not carry it</td></tr>';
  h += '<tr><td>Client Referral</td><td>—</td><td class="sub">removed from this page in v4; the Channel P&amp;L Partnership Led column still includes it</td></tr>';
  h += '</table><div class="sub" style="margin-top:8px">Revenue, COGS, partner payout, the Partners share of the team pool and selling wages are read from the same fields and rules as the Channel P&amp;L.</div></div>';

  /* 6 · exceptions */
  h += '<div class="sec">6 · Exceptions</div><div class="card">';
  var ex = [];
  if (M.unmapped.length) ex.push({ bad:1, t:'<b>Partnership-looking accounts nothing claims:</b> ' + M.unmapped.map(function(u){ return esc(u.acct) + ' ' + money(u.amt); }).join(' · ') });
  var noBud = [], noAct = [];
  for (var mm2=0; mm2<12; mm2++){
    var P2 = pnl(y, mm2, 'all');
    if (asOfDay(y,mm2) > 0 && P2.L[LINE.REV].act && P2.L[LINE.REV].bud == null) noBud.push(MONTHS[mm2]);
    if (asOfDay(y,mm2) > 0 && !P2.open && P2.L[LINE.REV].bud != null && !P2.L[LINE.REV].act) noAct.push(MONTHS[mm2]);
  }
  if (noBud.length) ex.push({ bad:1, t:'<b>Months with revenue but no budget:</b> ' + noBud.join(', ') + ' — those variances read as <i>no budget</i>, never as a miss.' });
  if (noAct.length) ex.push({ bad:1, t:'<b>Closed months with a budget and no revenue:</b> ' + noAct.join(', ') });
  if (String(cfg('VAT basis','')).toUpperCase().indexOf('CONFIRM') >= 0)
    ex.push({ bad:0, t:'<b>VAT basis is TO CONFIRM.</b> If partner invoices carry VAT and the plan is net, every payout line is out by about 5%.' });
  if (!cfg('Approved by',''))
    ex.push({ bad:0, t:'<b>The budget is unapproved</b> — version <i>' + esc(cfg('Budget version','—')) + '</i>, Approved by blank.' });
  var orph = Object.keys(M.orphan);
  if (orph.length) ex.push({ bad:1, t:'<b>Account map points at a line this page does not carry:</b> ' + orph.map(function(l){ return esc(l) + ' (' + money(M.orphan[l]) + ')'; }).join(', ') + ' — the cost is held out of every total. Re-point the map row to a live line, e.g. <i>Other partnership cost</i>.' });

  if (M.revShapeMonths < 2)
    ex.push({ bad:0, t:'<b>Revenue phasing rests on ' + M.revShapeMonths + ' complete month.</b> Budget-to-date on the revenue lines firms up with every month that closes.' });
  h += ex.map(function(e){ return '<div class="alert' + (e.bad ? ' bad' : '') + '">' + e.t + '</div>'; }).join('');
  if (!ex.length) h += '<div class="alert ok">No exceptions.</div>';
  h += '</div>';

  h += foot();
  return h;
}

/* ---------- page 7: compare ---------- */

function pageCompare(){
  var anchor = lastActualMonth();
  var h = '';
  var presets = {
    m3:  { n:'Last 3 months',  cols: monthsBack(anchor,3).map(function(x){ return [x]; }) },
    m6:  { n:'Last 6 months',  cols: monthsBack(anchor,6).map(function(x){ return [x]; }) },
    q:   { n:'This quarter vs last', cols: [ monthsBack({y:anchor.y,m:anchor.m-3},3), monthsBack(anchor,3) ] },
    ytd: { n:'Year to date, as one column', cols: [ ytdMonths(anchor.y, anchor.m) ] },
    h2:  { n:'Aug–Dec, month by month', cols: [7,8,9,10,11].map(function(mm){ return [{y:anchor.y,m:mm}]; }) }
  };
  S.cmp = S.cmp || 'm3';
  h += '<div class="sec">Compare<span class="note">the year and month filters do not apply here — a column is a label plus the months behind it</span></div>';
  h += '<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">' +
       Object.keys(presets).map(function(k){
         return '<button class="btn' + (S.cmp === k ? '' : ' ghost') + '" style="' + (S.cmp === k ? '' : 'border-color:var(--line);color:var(--ink2)') +
                '" data-cmp="' + k + '">' + esc(presets[k].n) + '</button>';
       }).join('') + '</div>';

  var cols = presets[S.cmp].cols.map(function(ms){
    var real = ms.filter(function(x){ return asOfDay(x.y,x.m) > 0; });
    return { ms: ms, label: labelOf(ms), A: agg(ms, S.ch),
             open: ms.some(function(x){ return isOpen(x.y,x.m); }),
             future: real.length === 0 };
  });

  var guards = [];
  cols.forEach(function(c){
    if (c.open)   guards.push('<b>' + esc(c.label) + '</b> contains the month in progress — its actual is not a full month.');
    if (c.future) guards.push('<b>' + esc(c.label) + '</b> has no actual at all; only the plan is real, so a variance there would mislead.');
    if (!c.future && !c.A.L['REVB'].act && c.A.acq.act)
      guards.push('<b>' + esc(c.label) + '</b> carries partnership cost but no partnership revenue — FinCore revenue starts Aug 2026, the ledger runs from January. Any ratio across it is meaningless.');
    if (c.A.L['REVB'].bud == null) guards.push('<b>' + esc(c.label) + '</b> carries no revenue budget.');
  });
  h += guards.length ? guards.map(function(g){ return '<div class="alert">' + g + '</div>'; }).join('') : '';

  h += '<table><tr><th>Line</th>' + cols.map(function(c){
    return '<th colspan="3">' + esc(c.label) + '</th>';
  }).join('') + '</tr><tr><th></th>' + cols.map(function(){ return '<th>Actual</th><th>Budget</th><th>Var</th>'; }).join('') + '</tr>';

  function crow(label, pick, isRev, cls){
    var r = '<tr class="' + (cls||'') + '"><td>' + esc(label) + '</td>';
    cols.forEach(function(c){
      var o = pick(c.A);
      var v = vari(nz(o.act), o.bud, isRev);
      r += '<td>' + money(o.act) + '</td><td>' + (o.bud == null ? '<span class="nb">—</span>' : money(o.bud)) + '</td>' +
           (v.noBudget ? '<td class="nb">—</td>' : '<td class="' + (v.fav?'f':'a') + '">' + money(v.d) + '</td>');
    });
    return r + '</tr>';
  }
  h += crow(bLab(),             function(A){ return A.L['REVB']; },   true, 'mid');
  h += crow('· One-time',       function(A){ return A.L['REVB1']; },  true);
  h += crow('· Recurring',      function(A){ return A.L['REVBR']; },  true);
  h += crow(oLab() + ' (memo)', function(A){ return A.L['REVO']; },   true, 'memo');
  h += crow('COGS',             function(A){ return A.L['COGS']; },     false);
  h += crow('CM1',              function(A){ return A.cm1; },           true, 'sub-t');
  h += crow('Partner payout',   function(A){ return A.L[LINE.PAY]; },   false, 'mid');
  h += crow('Partnership wages',function(A){ return A.L[LINE.WAGE]; },  false);
  h += crow('Partnership travel',function(A){ return A.L[LINE.TRAV]; }, false);
  h += crow('Meals & entertainment',  function(A){ return A.L[LINE.MEAL]; }, false);
  h += crow('Other partnership cost', function(A){ return A.L[LINE.OTH]; },  false);
  h += crow('Total acquisition cost', function(A){ return A.acq; },     false, 'sub-t');
  h += crow('Selling wages (allocated)', function(A){ return A.L[LINE.SELL]; }, false);
  h += crow('Employee commission (allocated)', function(A){ return A.L[LINE.COMM]; }, false);
  h += crow('CM2',              function(A){ return A.cm2; },           true, 'sub-t');
  h += crow('Admin',            function(A){ return A.L['Admin']; },    false);
  h += crow('Net',              function(A){ return A.net; },           true, 'tot');

  /* ratios per column, computed from each column's own figures — never averaged */
  function rrow(label, f){
    var r = '<tr class="marg"><td>' + esc(label) + '</td>';
    cols.forEach(function(c){ r += '<td colspan="3">' + f(c.A) + '</td>'; });
    return r + '</tr>';
  }
  h += rrow('· Effective payout rate', function(A){ return A.L[LINE.REV].act ? pct(A.L[LINE.PAY].act / A.L[LINE.REV].act) : '—'; });

  h += rrow('· ARR to acquisition cost', function(A){ return A.acq.act ? (A.L[LINE.ARR].act / A.acq.act).toFixed(2) + '×' : '—'; });
  h += rrow('· Net margin',           function(A){ return A.L['REVB'].act ? pct(A.net.act / A.L['REVB'].act) : '—'; });
  h += '</table></div>';
  h += foot();
  return h;
}

function wireCompare(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmp]'), function(b){
    b.onclick = function(){ S.cmp = b.getAttribute('data-cmp'); render(); };
  });
}

function foot(){
  return '<div class="foot">' +
    'FH-PBUD v4.0 · Channel &amp; Referral Partners only · cash or ARR basis · seven pages, in the hub at <b>#pbudget</b>. Per-partner revenue and payout join through the <b>Partner Map</b> tab.<br>' +
    'Revenue: FinCore Sales, Paid ex-VAT, month of Date Closed, deal source group <b>Partnerships</b>, onboarding_failed excluded; split one-time / recurring by FinCore <b>Billing</b>.<br>' +
    'Cost: Zoho Books + Xero ledger, Transactions tab. Partnership wages, travel and meals are a pool split between Partners and Client Referral by cash share, and this page carries the Partners share; selling wages and employee commission are the company pools × Partners&rsquo; cash-revenue share.<br>' +
    'COGS ' + cfgNum('Plan COGS %',35) + '% and Admin ' + cfgNum('Plan Admin %',17) + '% are plan rates on both sides and therefore carry no variance by construction. Actual 2026 YTD rates are 38.3% and 20.4%, so Net here is flattered by about six points.<br>' +
    'Budget, account map, config, overrides, commentary and log live in the <b>Partnership&nbsp;*</b> tabs of the ' +
    '<a href="' + sheetUrl() + '" target="_blank" rel="noopener" style="color:var(--orange);font-weight:650;text-decoration:none;border-bottom:1px solid rgba(245,130,32,.45)">consolidated ads-spend sheet</a>' +
    '. Read live on every load — nothing cached, nothing scheduled.' +
    '</div>';
}

/* ==========================================================================
   BOOT
   ========================================================================== */

function boot(){
  renderTabs();
  loadAll().then(function(){
    var years = Object.keys(M.budget).map(Number);
    M.months.forEach(function(ym){ var y = +ym.slice(0,4); if (years.indexOf(y) < 0) years.push(y); });
    years.sort();
    if (!years.length) years = [2026];
    S.year = years[years.length-1];
    var last = M.months.length ? M.months[M.months.length-1] : null;
    S.month = last ? (+last.slice(5) - 1) : new Date().getMonth();

    var sy = document.getElementById('selYear');
    sy.innerHTML = years.map(function(y){ return '<option' + (y === S.year ? ' selected' : '') + '>' + y + '</option>'; }).join('');
    sy.onchange = function(){ S.year = +sy.value; render(); };
    var sm = document.getElementById('selMonth');
    sm.innerHTML = MONTHS.map(function(n,i){ return '<option value="' + i + '"' + (i === S.month ? ' selected' : '') + '>' + n + '</option>'; }).join('');
    sm.onchange = function(){ S.month = +sm.value; render(); };
    var sb = document.getElementById('selBasis');
    sb.value = S.basis;
    sb.onchange = function(e){ S.basis = e.target.value === 'arr' ? 'arr' : 'cash'; try { localStorage.setItem('fh_pbud_basis_v1', S.basis); } catch(err){} render(); };

    var chip = document.getElementById('statusChip');
    chip.className = 'chip live';
    chip.textContent = '● Live · FinCore + ledger + budget · read ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) +
                       ' · ' + M.deals.length + ' partner deals';
    render();
  }).catch(function(e){
    document.getElementById('app').innerHTML = '<div class="err"><b>Could not load.</b> ' + esc(e.message) +
      '<br><br>Most often this means the browser is not signed in to a Google account with access to the sheets, or a basic filter was left on a source tab. ' +
      'Nothing is cached — reloading once signed in is enough.</div>';
    var chip = document.getElementById('statusChip'); chip.className = 'chip warnc'; chip.textContent = '● Load failed';
  });
}
boot();
</script>
