/* ===================== 12. DATA VALIDATION ===================== */
function pgValidation(){
  const V=S.V, M=S.M, L=M.L, N=M.N, tol=S.cfg.par.valTol;
  const pass=V.checks.filter(c=>c.status==='pass').length, failC=V.checks.filter(c=>c.status==='fail'), warnC=V.checks.filter(c=>c.status==='warn');
  const pill=s=>s==='pass'?'<span class="pill s0">Pass</span>':s==='warn'?'<span class="pill s2">Review</span>':'<span class="pill s3">Fail</span>';
  const grid=c=>{ const lab=c.withOpen?['Opening',...L.slice(0,N)]:L.slice(0,N); return `<div class="vgrid">${c.diffs.map((d,i)=>`<i class="${d==null?'na':c.bad[i]?(c.status==='warn'?'wn':'bad'):'ok'}" title="${esc(lab[i])}: difference ${esc(fmt(d,{scale:'A'}))}">${c.bad[i]?'!':'✓'}</i>`).join('')}</div>`; };
  let h=head('validation');
  h+=`<div class="${V.fails?'banner bad':V.warns?'banner':'banner'}" style="${!V.fails&&!V.warns?'background:#eaf6ef;border-color:#bfe2cc;color:#14663d':''}">${V.fails?`${V.fails} check${V.fails>1?'s':''} failed. Correct the source data before relying on the dashboard.`:V.warns?`All reconciliations pass. ${V.warns} item${V.warns>1?'s':''} to review.`:'All reconciliation and data-quality checks pass.'} Tolerance: ${fmt(tol,{scale:'A'})}.</div>`;
  const tbl=list=>`<div class="tw"><table class="t"><thead><tr><th class="l">Check</th><th class="l">Rule</th><th class="l">Result</th><th>Largest difference</th><th class="l">By month</th></tr></thead><tbody>${list.map(c=>`<tr><td class="l"><b>${esc(c.name)}</b></td><td class="l small muted" style="min-width:260px">${esc(c.desc)}</td><td class="l">${pill(c.status)}</td><td>${fmt(c.max,{scale:'A'})}</td><td class="l">${grid(c)}</td></tr>`).join('')}</tbody></table></div>`;
  if(failC.length||warnC.length) h+=sec('Reconciliation exceptions','Checks that did not pass, listed separately so they are not missed.',tbl(failC.concat(warnC)));
  h+=sec('Reconciliation checks',`${pass} of ${V.checks.length} checks pass.`,tbl(V.checks));
  h+=sec('Data quality',null,`<div class="panel"><ul class="ins">${V.dq.map(d=>`<li><i class="mk ${d.status==='pass'?'pos':d.status==='warn'?'wat':'neg'}"></i><span><b>${esc(d.name)}</b>. ${esc(d.txt)}</span>${pill(d.status)}</li>`).join('')}</ul></div>
<p class="note">Measures that cannot be derived from three financial statements are deliberately not shown: customer or vendor concentration, receivables ageing, product, customer or department profitability, employee productivity, budget variance and forecast accuracy.</p>`);
  return {html:h};
}

/* ===================== LIVE LEDGER =====================
   The Xero era (Nov 2022 – Apr 2026) is a closed system: nothing will ever
   change there, so it stays frozen in the embedded baseline. The Zoho Books
   era (1 May 2026 onward) is live, so every load re-reads it from the ledger
   sheet and rebuilds those months. Falls back to the embedded copy silently
   if the sheet cannot be reached.
   ------------------------------------------------------------------------ */
const LV = {state:'idle', at:null, latest:null, months:0, msg:'', recon:[], partial:null};

const lvURL = (tab, tq) =>
  'https://docs.google.com/spreadsheets/d/' + MAPS.sheetId + '/gviz/tq?tqx=out:csv&sheet=' +
  encodeURIComponent(tab) + '&tq=' + encodeURIComponent(tq);

async function lvQuery(tq){
  const r = await fetch(lvURL(MAPS.zohoTab, tq), {credentials:'omit'});
  if(!r.ok) throw new Error('ledger returned ' + r.status);
  return parseCSV(await r.text());
}
const lvNum = v => { const n = num(v); return (n == null || Number.isNaN(n)) ? 0 : n; };

/* ---------- classification, identical to the baseline build ---------- */
const lvNorm = s => String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
function lvRevLine(acct){ return MAPS.revMap[String(acct).trim()] || MAPS.revOther; }
function lvExpense(acct){
  const n = String(acct).trim();
  if(MAPS.dep.indexOf(n) >= 0) return ['DEP',''];
  if(MAPS.fin.indexOf(n) >= 0) return ['FIN',''];
  if(MAPS.cogs.indexOf(n) >= 0) return ['COGS',''];
  if(MAPS.opexMap[n]) return ['OPEX', MAPS.opexMap[n]];
  const low = n.toLowerCase();
  for(const [pat, cat] of MAPS.opexFallback) if(new RegExp(pat).test(low)) return ['OPEX', cat];
  return ['OPEX', MAPS.opexOther];
}
function lvBS(acct, ztype){
  const n = String(acct).trim();
  if(MAPS.bsMap[n]) return MAPS.bsMap[n];
  const t = MAPS.ztype[ztype];
  if(!t) return null;
  if(t === 'FA' && /depreciation/i.test(n)) return 'ACCDEP';
  return t;
}

/* ---------- fetch one year of the live era ---------- */
async function lvYear(y){
  const from = (y === MAPS.liveFrom.year) ? MAPS.liveFrom.month : 1;
  const where = `C=${y} and B>=${from}`;
  const [inc, exp, bs, types, ctrl] = await Promise.all([
    lvQuery(`select D,sum(J) where ${where} and L='income' group by D pivot B`),
    lvQuery(`select D,sum(J) where ${where} and L='expense' group by D pivot B`),
    lvQuery(`select D,sum(J) where ${where} and L!='income' and L!='expense' group by D pivot B`),
    lvQuery(`select D,M where ${where} and L!='income' and L!='expense' group by D,M`),
    lvQuery(`select L,sum(J) where ${where} group by L pivot B`)
  ]);
  const typeOf = {};
  types.slice(1).forEach(r => { if(r[0]) typeOf[String(r[0]).trim()] = String(r[1] || '').trim(); });
  const pivot = rows => {
    const hdr = rows[0].slice(1).map(x => parseInt(x, 10));
    return {months: hdr, rows: rows.slice(1).filter(r => r[0] !== '')};
  };
  return {year:y, inc:pivot(inc), exp:pivot(exp), bs:pivot(bs), typeOf, ctrl:pivot(ctrl)};
}

/* ---------- rebuild the datasets from a fetched year ---------- */
function lvApply(Y){
  const y = Y.year, key = String(y);
  const months = Y.inc.months.concat(Y.exp.months, Y.bs.months)
                   .filter((v,i,a) => a.indexOf(v) === i).sort((a,b) => a-b);
  if(!months.length) return 0;
  const lastM = months[months.length - 1];              // 1-based calendar month
  const firstM = (y === MAPS.liveFrom.year) ? MAPS.liveFrom.month : 1;

  let ds = DATASETS[key];
  if(!ds){
    ds = DATASETS[key] = {company:'Finanshels', industry:DATASETS['2026'].industry, fy:y,
                          currency:'AED', startMonth:0, label:String(y), source:'Zoho Books general ledger',
                          accounts: []};
  }
  ds.source = (y === MAPS.liveFrom.year)
    ? 'Xero general ledger to Apr 2026, Zoho Books live from May 2026'
    : 'Zoho Books general ledger, live';

  /* index existing rows */
  const idxPL = {}, idxBS = {};
  ds.accounts.forEach(a => {
    if(a.st === 'PL') idxPL[a.cls + '|' + lvNorm(a.acct)] = a;
    else if(a.st === 'BS') idxBS[a.cls + '|' + lvNorm(a.acct)] = a;
  });
  const blank = () => Array(12).fill(null);
  const getPL = (cls, cat, name) => {
    const k = cls + '|' + lvNorm(name);
    if(!idxPL[k]){ const row = {st:'PL', acct:name, cls, cat:cat||'', open:null, v:blank()};
      /* an account that only exists in the Zoho era earned nothing in the Xero
         months - zero, not blank, or the data-quality check reads it as missing */
      for(let m = 0; m < firstM - 1; m++) row.v[m] = 0;
      ds.accounts.push(row); idxPL[k] = row; }
    idxPL[k].cat = cat || idxPL[k].cat || '';
    return idxPL[k];
  };

  /* balance carried into the live window: the month before it starts, or the
     baseline's Apr-2026 class closing for a row that has no history here */
  const carry = {};
  ds.accounts.filter(a => a.st === 'BS').forEach(a => {
    const i = firstM - 2;                                   // 0-based index of the prior month
    carry[a.cls + '|' + lvNorm(a.acct)] = i >= 0 ? (a.v[i] != null ? +a.v[i] : +a.open || 0) : (+a.open || 0);
  });

  /* wipe the live window on every existing row */
  ds.accounts.forEach(a => { for(let m = firstM - 1; m <= lastM - 1; m++) a.v[m] = a.st === 'BS' ? null : 0; });

  /* revenue, rolled to service lines */
  const revLine = {};
  Y.inc.rows.forEach(r => {
    const line = lvRevLine(r[0]);
    Y.inc.months.forEach((mm, i) => {
      const v = lvNum(r[i+1]);                              // net = credit - debit, income positive
      (revLine[line] = revLine[line] || {})[mm] = (revLine[line][mm] || 0) + v;
    });
  });
  MAPS.lines.forEach(line => {
    const d = revLine[line]; if(!d) return;
    const row = getPL('REV', '', line);
    Object.keys(d).forEach(mm => { row.v[+mm - 1] = +d[mm].toFixed(2); });
  });

  /* expenses, account level */
  Y.exp.rows.forEach(r => {
    const name = String(r[0]).trim(), [cls, cat] = lvExpense(name);
    const row = getPL(cls, cat, name);
    Y.exp.months.forEach((mm, i) => { row.v[mm-1] = +(-lvNum(r[i+1])).toFixed(2); }); // expense debit-positive
  });

  /* balance sheet: movements cumulated onto the carried-in balance */
  const run = Object.assign({}, carry);
  const mv = {};
  Y.bs.rows.forEach(r => {
    const name = String(r[0]).trim(), cls = lvBS(name, Y.typeOf[name]);
    if(!cls) return;
    const k = cls + '|' + lvNorm(name);
    if(!idxBS[k]){
      const row = {st:'BS', acct:name, cls, cat:'', open:0, v:blank()};
      for(let m = 0; m < firstM - 1; m++) row.v[m] = 0;
      ds.accounts.push(row); idxBS[k] = row; run[k] = run[k] || 0;
    }
    const isAsset = ['CASH','AR','OCA','FA','ACCDEP','ONCA'].indexOf(cls) >= 0;
    Y.bs.months.forEach((mm, i) => {
      const v = lvNum(r[i+1]) * (isAsset ? -1 : 1);          // natural sign
      (mv[k] = mv[k] || {})[mm] = (mv[k][mm] || 0) + v;
    });
  });
  Object.keys(idxBS).forEach(k => {
    const row = idxBS[k];
    let bal = run[k] || 0;
    for(let m = firstM; m <= lastM; m++){
      bal += (mv[k] && mv[k][m]) ? mv[k][m] : 0;
      row.v[m-1] = +bal.toFixed(2);
    }
  });

  /* current-year earnings and brought-forward equity follow the P&L */
  const cye = idxBS['CYE|currentyearearnings'], reBf = idxBS['RE|accumulatedearningsbroughtforward'];
  if(cye){
    let cum = 0;
    for(let m = 1; m <= lastM; m++){
      const i = m - 1;
      let np = 0;
      ds.accounts.forEach(a => {
        if(a.st !== 'PL' || a.v[i] == null) return;
        np += (a.cls === 'REV' ? 1 : -1) * (+a.v[i]);
      });
      cum += np;
      if(m >= firstM) cye.v[i] = +cum.toFixed(2);
    }
  }
  if(reBf) for(let m = firstM; m <= lastM; m++) reBf.v[m-1] = reBf.v[firstM-2] != null ? reBf.v[firstM-2] : reBf.open;

  /* drop rows that are entirely empty after the rebuild */
  ds.accounts = ds.accounts.filter(a => a.v.some(v => v != null && +v !== 0) || (a.st === 'BS' && +a.open !== 0));

  /* reconcile the rebuilt months against an independent group query */
  const sign = {asset:-1, liability:1, equity:1, income:1, expense:-1};
  Y.ctrl.rows.forEach(r => {
    const grp = String(r[0]).trim().toLowerCase();
    Y.ctrl.months.forEach((mm, i) => {
      const ctrl = lvNum(r[i+1]) * (sign[grp] == null ? 1 : sign[grp]);
      let got = 0;
      if(grp === 'income') ds.accounts.forEach(a => { if(a.st==='PL' && a.cls==='REV' && a.v[mm-1]!=null) got += +a.v[mm-1]; });
      else if(grp === 'expense') ds.accounts.forEach(a => { if(a.st==='PL' && a.cls!=='REV' && a.v[mm-1]!=null) got += +a.v[mm-1]; });
      else return;                                           // balance groups are checked by A = L + E
      if(Math.abs(ctrl - got) > 1) LV.recon.push(`${y}-${String(mm).padStart(2,'0')} ${grp}: ledger ${Math.round(ctrl).toLocaleString()} vs rebuilt ${Math.round(got).toLocaleString()}`);
    });
  });

  DATASETS[key].label = (lastM < 12) ? `${y} (Jan–${MN[lastM-1]})` : String(y);
  return lastM;
}

/* ---------- refresh the forecast's FY2026 actuals from the rebuilt data ---------- */
function lvReseedForecast(){
  const ds = DATASETS['2026']; if(!ds) return;
  const now = new Date(), openMonth = (now.getFullYear() === 2026) ? now.getMonth() + 1 : 13;
  let n = 0;
  ds.accounts.forEach(a => { if(a.st === 'PL') a.v.forEach((v,i) => { if(v != null) n = Math.max(n, i+1); }); });
  const complete = Math.min(n, openMonth - 1);              // the open month never feeds the run-rate
  const sumTo = (pred, upto) => { let s = 0;
    ds.accounts.forEach(a => { if(!pred(a)) return; for(let i = 0; i < upto; i++) s += (+a.v[i] || 0); }); return s; };

  const A = FC_DATA.actuals[2026];
  A.months = n;
  MAPS.lines.forEach(l => { A.rev[l] = +sumTo(a => a.st==='PL' && a.cls==='REV' && a.acct===l, n).toFixed(2); });
  A.cogs = +sumTo(a => a.st==='PL' && a.cls==='COGS', n).toFixed(2);
  FC_DATA.cats.forEach(c => { A.opex[c] = +sumTo(a => a.st==='PL' && a.cls==='OPEX' && a.cat===c, n).toFixed(2); });
  A.dep = +sumTo(a => a.st==='PL' && a.cls==='DEP', n).toFixed(2);
  A.fin = +sumTo(a => a.st==='PL' && a.cls==='FIN', n).toFixed(2);
  const cls = {}; ds.accounts.forEach(a => { if(a.st==='BS' && a.v[n-1] != null) cls[a.cls] = (cls[a.cls]||0) + +a.v[n-1]; });
  Object.keys(A.bs).forEach(k => { if(cls[k] != null) A.bs[k] = +cls[k].toFixed(2); });

  /* run-rate seed: the last three COMPLETE months, per service line */
  const q = Math.max(1, complete), lo = Math.max(0, q - 3);
  MAPS.lines.forEach(l => {
    let s = 0;
    ds.accounts.forEach(a => { if(a.st==='PL' && a.cls==='REV' && a.acct===l) for(let i=lo;i<q;i++) s += (+a.v[i] || 0); });
    FC_DATA.seed.runrate[l] = +(s / Math.max(1, q - lo)).toFixed(2);
  });
  const rev = MAPS.lines.reduce((s,l) => s + A.rev[l], 0);
  if(rev > 0){
    const gm = +((rev - A.cogs) / rev).toFixed(4);
    FC_DATA.seed.gm = FC_DATA.seed.gm.map(() => gm);
    FC_DATA.cats.forEach(c => { FC_DATA.seed.opexPct[c] = FC_DATA.seed.opexPct[c].map(() => +(A.opex[c]/rev).toFixed(5)); });
  }
  LV.partial = (n >= openMonth) ? MN[n-1] + ' ' + 2026 : null;
  LV.completeThrough = complete;
}

/* ---------- orchestration ---------- */
async function lvRefresh(silent){
  LV.state = 'loading'; LV.recon = []; if(!silent) render(true);
  try{
    const thisYear = new Date().getFullYear();
    const years = []; for(let y = MAPS.liveFrom.year; y <= Math.max(thisYear, MAPS.liveFrom.year); y++) years.push(y);
    const fetched = await Promise.all(years.map(lvYear));
    let latest = null;
    fetched.forEach(Y => { const m = lvApply(Y); if(m) latest = {y:Y.year, m}; });
    lvReseedForecast();
    MODEL_CACHE = {};
    LV.state = LV.recon.length ? 'warn' : 'live';
    LV.at = new Date(); LV.latest = latest;
    LV.msg = latest ? `${MN[latest.m-1]} ${latest.y}` : '';
    const cur = String(S.cfg.fy);
    initState(DATASETS[cur] || SAMPLE_DATA, true);
    S.ui.exInit = false; recompute(false);
    const pi = lvPartIdx();
    if(pi > 0 && pi === S.M.N - 1){ S.f.month = pi - 1; render(true); }
  }catch(e){
    LV.state = 'offline'; LV.msg = e.message || String(e);
    console.warn('[finanshels] live ledger unavailable:', LV.msg);
    render(true);
  }
}
function lvPartIdx(){
  const now = new Date();
  if(!LV.latest || S.cfg.fy !== now.getFullYear() || LV.latest.y !== now.getFullYear()) return -1;
  if(LV.latest.m !== now.getMonth() + 1) return -1;     // latest data month is the open month
  return now.getMonth();                                // 0-based index of that month
}
function lvChip(){
  const t = LV.at ? LV.at.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
  if(LV.state === 'loading') return `<span class="lvchip load">◌ Reading ledger…</span>`;
  if(LV.state === 'live')    return `<span class="lvchip ok">● Live · Zoho Books · ${esc(LV.msg)} · read ${t}</span>`;
  if(LV.state === 'warn')    return `<span class="lvchip warn" title="${esc(LV.recon.slice(0,4).join(' | '))}">▲ Live, ${LV.recon.length} reconciliation difference${LV.recon.length>1?'s':''} · read ${t}</span>`;
  if(LV.state === 'offline') return `<span class="lvchip off" title="${esc(LV.msg)}">○ Ledger unreachable — showing the last published figures</span>`;
  return `<span class="lvchip off">○ Not yet read</span>`;
}

/* ===================== FORECAST MODULE =====================
   Annual driver-based model: FY2026E .. FY2031E, rolled forward from the
   31 Dec 2025 actual balance sheet. FC_DATA is injected at build time and
   holds the annual actuals plus the seeded assumption defaults.
   ----------------------------------------------------------------------- */
const FC_HIST  = [2023, 2024, 2025];
const FC_YEARS = [2026, 2027, 2028, 2029, 2030, 2031];
const FC_LINES = FC_DATA.lines, FC_CATS = FC_DATA.cats, FC_A = FC_DATA.actuals;
const FC_KEY = 'finanshels-forecast-assumptions-v1';
const FC_DRIVERS = [['pct','% of revenue'], ['growth','Growth on prior year'], ['fixed','Fixed amount']];

function fcDefaults(){ return clone(FC_DATA.seed); }
function fcLoad(){
  const d = fcDefaults();
  try{ const raw = localStorage.getItem(FC_KEY); if(raw) return Object.assign(d, JSON.parse(raw)); }catch(e){}
  return d;
}
function fcSave(){ try{ localStorage.setItem(FC_KEY, JSON.stringify(S.fc)); }catch(e){} }
function fcGet(path){ const p = path.split('|'); let o = S.fc; for(let i=0;i<p.length-1;i++) o = o[p[i]]; return o[p[p.length-1]]; }
function fcPut(path, v){ const p = path.split('|'); let o = S.fc; for(let i=0;i<p.length-1;i++) o = o[p[i]]; o[p[p.length-1]] = v; }

/* ---------- the engine ---------- */
function buildFcst(a){
  const out = [];
  const b0 = FC_A[2025].bs;
  let prev = {
    cash: b0.CASH, ar: b0.AR, oca: b0.OCA, nbv: b0.FA + b0.ACCDEP + b0.ONCA,
    ap: b0.AP, ocl: b0.OCL, debt: b0.STD + b0.LTD, oncl: b0.ONCL,
    sc: b0.SC, re: b0.RE + b0.CYE
  };
  const opening = Object.assign({}, prev);
  let lossPool = Math.max(0, +a.taxLossBf || 0);

  for(let t = 0; t < FC_YEARS.length; t++){
    const first = t === 0;

    /* revenue: FY2026E = 8 months actual + a 4-month stub at the Jun-Aug
       run-rate; later years grow the prior year line by line */
    const revL = {}; let rev = 0;
    FC_LINES.forEach(s => {
      const v = first ? FC_A[2026].rev[s] + (+a.runrate[s] || 0) * 4 * (1 + (+a.stubUplift || 0))
                      : out[t-1].revL[s] * (1 + (+a.growth[s][t-1] || 0));
      revL[s] = v; rev += v;
    });

    const cogs = rev * (1 - (+a.gm[t] || 0));
    const gp = rev - cogs;

    const opex = {}; let opexTot = 0;
    FC_CATS.forEach(c => {
      const d = a.opexDriver[c]; let v;
      if(d === 'growth') v = (first ? FC_A[2025].opex[c] : out[t-1].opex[c]) * (1 + (+a.opexGrowth[c][t] || 0));
      else if(d === 'fixed') v = +a.opexFixed[c][t] || 0;
      else v = rev * (+a.opexPct[c][t] || 0);
      opex[c] = v; opexTot += v;
    });

    const ebitda = gp - opexTot;
    const dep = prev.nbv * (+a.depRate || 0);
    const ebit = ebitda - dep;
    const draw = +a.debtDraw[t] || 0, repay = +a.debtRepay[t] || 0, inj = +a.equityInj[t] || 0;
    const debt = Math.max(0, prev.debt + draw - repay);
    const fin = (prev.debt + debt) / 2 * (+a.interestRate || 0);
    const pbt = ebit - fin;

    let taxable = pbt;
    if(a.ctLossCF){
      if(taxable > 0 && lossPool > 0){ const used = Math.min(lossPool, taxable); taxable -= used; lossPool -= used; }
      else if(pbt < 0) lossPool += -pbt;
    }
    const tax = Math.max(0, taxable - (+a.ctThreshold || 0)) * (+a.ctRate || 0);
    const np = pbt - tax;

    const ar  = rev / 365 * (+a.dso[t] || 0);
    const ap  = (cogs + opexTot) / 365 * (+a.dpo[t] || 0);
    const ocl = rev / 365 * (+a.oclDays[t] || 0);
    const oca = rev / 365 * (+a.ocaDays[t] || 0);
    const capex = rev * (+a.capexPct[t] || 0);
    const nbv = prev.nbv + capex - dep;

    const cfo = np + dep - (ar - prev.ar) - (oca - prev.oca) + (ap - prev.ap) + (ocl - prev.ocl);
    const cfi = -capex;
    const cff = draw - repay + inj;
    const cash = prev.cash + cfo + cfi + cff;
    const sc = prev.sc + inj, re = prev.re + np, oncl = prev.oncl;

    const bs = {cash, ar, oca, nbv, ap, ocl, debt, oncl, sc, re};
    bs.ta = cash + ar + oca + nbv;
    bs.tl = ap + ocl + debt + oncl;
    bs.te = sc + re;
    bs.check = bs.ta - (bs.tl + bs.te);
    bs.nwc = (cash + ar + oca) - (ap + ocl + debt);
    bs.netDebt = debt - cash;

    out.push({year: FC_YEARS[t], revL, rev, cogs, gp, opex, opexTot, ebitda, dep, ebit, fin, pbt,
              tax, np, capex, cfo, cfi, cff, dCash: cfo + cfi + cff, bs, open: prev,
              gm: dv(gp, rev), ebitdam: dv(ebitda, rev), npm: dv(np, rev),
              fcf: cfo + cfi, lossPool});
    prev = bs;
  }
  return {P: out, opening};
}

/* historical annual columns, shaped like a forecast period so one table can show both */
function fcHist(y){
  const A = FC_A[y], rev = FC_LINES.reduce((s,l)=>s+A.rev[l], 0);
  const opexTot = FC_CATS.reduce((s,c)=>s+A.opex[c], 0);
  const gp = rev - A.cogs, ebitda = gp - opexTot, ebit = ebitda - A.dep, pbt = ebit - A.fin;
  const b = A.bs, bs = {cash:b.CASH, ar:b.AR, oca:b.OCA, nbv:b.FA+b.ACCDEP+b.ONCA,
                        ap:b.AP, ocl:b.OCL, debt:b.STD+b.LTD, oncl:b.ONCL, sc:b.SC, re:b.RE+b.CYE};
  bs.ta = bs.cash+bs.ar+bs.oca+bs.nbv; bs.tl = bs.ap+bs.ocl+bs.debt+bs.oncl; bs.te = bs.sc+bs.re;
  bs.check = bs.ta-(bs.tl+bs.te); bs.netDebt = bs.debt-bs.cash;
  return {year:y, hist:true, months:A.months, revL:A.rev, rev, cogs:A.cogs, gp, opex:A.opex, opexTot,
          ebitda, dep:A.dep, ebit, fin:A.fin, pbt, tax:A.tax, np:pbt-A.tax, bs,
          gm:dv(gp,rev), ebitdam:dv(ebitda,rev), npm:dv(pbt-A.tax,rev)};
}

/* ---------- shared bits ---------- */
function fcCols(){ return FC_HIST.map(fcHist).concat(S.FC.P); }
function fcHead(){
  return FC_HIST.map(y=>`<th class="fch">${y}A</th>`).join('') +
         FC_YEARS.map((y,i)=>`<th class="${i===0?'sep':''}">${y}E</th>`).join('');
}
const fcN = (v, o) => v == null || !isFinite(v) ? '—' : fmt(v, Object.assign({table:true}, o||{}));
const fcAbs = v => (v == null || !isFinite(v)) ? '—'
  : (v < 0 ? '\u2212' : '') + Math.round(Math.abs(v)).toLocaleString('en-US');
const fcP = (v, d) => v == null || !isFinite(v) ? '—' : pct(v, d == null ? 1 : d);

function fcRow(label, get, o){
  o = o || {};
  const cells = fcCols().map((c,i)=>{
    const v = get(c);
    const txt = o.pct ? fcP(v, o.dp) : fcN(v);
    return `<td class="${i===FC_HIST.length?'sep':''} ${o.cls||''} ${o.sign&&v<0?'neg':''}">${txt}</td>`;
  }).join('');
  return `<tr class="${o.rowCls||''}"><td class="l sticky ${o.indent?'ind1':''}">${esc(label)}</td>${cells}</tr>`;
}

function fcLiveHTML(){
  const P = S.FC.P, last = P[P.length-1], neg = P.filter(p=>p.bs.cash < 0);
  return `<b>FY2031E</b> &nbsp; revenue ${fcN(last.rev)} &nbsp;·&nbsp; EBITDA ${fcN(last.ebitda)} (${fcP(last.ebitdam)})`
    + ` &nbsp;·&nbsp; closing cash ${fcN(last.bs.cash)} &nbsp;·&nbsp; `
    + (neg.length ? `<span class="neg">cash turns negative in FY${neg[0].year}E</span>`
                  : `<span class="pos">cash stays positive throughout</span>`)
    + ` <span class="faint">— amounts in ${scaleWord()}</span>`;
}
function fcLiveUpdate(){ const el = document.getElementById('fcLive'); if(el) el.innerHTML = fcLiveHTML(); }

    'FY2026E adds a four-month stub at the monthly run-rate below. Later years grow each line on the prior year.',
    `<div class="panel"><div class="tw"><table class="t"><thead><tr><th class="l sticky">Service line</th><th>Jan–Aug 2026 actual</th><th>Sep–Dec monthly run-rate</th>${yrs.slice(1).map(y=>`<th class="${y===2027?'sep':''}">${y} growth</th>`).join('')}</tr></thead><tbody>
    ${FC_LINES.map(s=>`<tr><td class="l">${esc(s)}</td><td class="faint">${fcAbs(FC_A[2026].rev[s])}</td><td>${inum('runrate|'+s,1000)}</td>${yrs.slice(1).map((y,i)=>`<td class="${i===0?'sep':''}">${ip('growth|'+s+'|'+i,1)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="note">Growth defaults are mechanical, not a plan: trailing Jan–Aug YoY capped at 60%, scaled to 75%, then decayed 35% of the way to a 12% long-run rate each year. Replace them with your own numbers.</p></div>`);

  /* 3 — gross margin */
  h += sec('3 · Gross margin',
    'Direct delivery cost is modelled as the residual, so this single line sets COGS.',
    `<div class="panel"><div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>
    <tr><td class="l">Gross margin %</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${ip('gm|'+i,0.5)}</td>`).join('')}</tr>
    </tbody></table></div><p class="note">Seeded at the FY2026 year-to-date gross margin of ${fcP((FC_LINES.reduce((s,l)=>s+FC_A[2026].rev[l],0)-FC_A[2026].cogs)/FC_LINES.reduce((s,l)=>s+FC_A[2026].rev[l],0))}. FY2025 ran at ${fcP(fcHist(2025).gm)}.</p></div>`);

  /* 4 — opex */
  h += sec('4 · Operating expenses',
    'Each category gets its own driver. "% of revenue" scales with the top line, "Growth on prior year" is a step-cost build, "Fixed amount" holds it.',
    `<div class="panel"><div class="tw"><table class="t"><thead><tr><th class="l sticky">Category</th><th class="l">Driver</th>${yrs.map((y,i)=>`<th class="${i===0?'sep':''}">${y}E</th>`).join('')}</tr></thead><tbody>
    ${FC_CATS.map(c=>{
      const d = a.opexDriver[c];
      const cell = (i)=> d==='pct' ? ip('opexPct|'+c+'|'+i,0.25) : d==='growth' ? ip('opexGrowth|'+c+'|'+i,1) : inum('opexFixed|'+c+'|'+i);
      return `<tr><td class="l">${esc(c)}</td><td class="l"><select class="fcs" data-fc="opexDriver|${esc(c)}" data-fck="sel">${FC_DRIVERS.map(([v,l])=>`<option value="${v}" ${d===v?'selected':''}>${l}</option>`).join('')}</select></td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${cell(i)}</td>`).join('')}</tr>`;
    }).join('')}
    </tbody></table></div><p class="note">All eleven categories default to "% of revenue" at their FY2026 year-to-date share. Payroll lines are step costs in reality — switch those to a growth driver once you have a hiring plan.</p></div>`);

  /* 5 — capex and depreciation */
  h += sec('5 · Capital expenditure and depreciation',
    'Capex covers tangible assets and capitalised development together, the way your ledger records them.',
    `<div class="panel"><div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>
    <tr><td class="l">Capex, % of revenue</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${ip('capexPct|'+i,0.5)}</td>`).join('')}</tr>
    <tr><td class="l">Depreciation and amortisation, % of opening book value</td><td colspan="${yrs.length}" class="l">${ip('depRate',0.5)} <span class="faint">applied to the opening net book value of fixed and intangible assets in every year</span></td></tr>
    </tbody></table></div><p class="note">FY2026 year-to-date capex including capitalised development was ${fcAbs(FC_A[2026].capexFA+FC_A[2026].capexONCA)}, or ${fcP((FC_A[2026].capexFA+FC_A[2026].capexONCA)/FC_LINES.reduce((s,l)=>s+FC_A[2026].rev[l],0))} of revenue. The implied depreciation rate on opening book value is only ${fcP(FC_DATA.seed.depRate)} — capitalised development does not appear to be amortised in the ledger, so this rate is worth a deliberate decision.</p></div>`);

  /* 6 — working capital */
  h += sec('6 · Working capital',
    'Days drive the balance sheet, and the balance sheet drives cash.',
    `<div class="panel"><div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>
    <tr><td class="l">Receivable days (DSO), on revenue</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${iday('dso|'+i)}</td>`).join('')}</tr>
    <tr><td class="l">Payable days (DPO), on total cost</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${iday('dpo|'+i)}</td>`).join('')}</tr>
    <tr><td class="l">Other current liabilities, days of revenue</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${iday('oclDays|'+i)}</td>`).join('')}</tr>
    <tr><td class="l">Other current assets, days of revenue</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${iday('ocaDays|'+i)}</td>`).join('')}</tr>
    </tbody></table></div><p class="note">Seeded from the August 2026 balance sheet: DSO ${FC_DATA.seed.dso[0]} days, DPO ${FC_DATA.seed.dpo[0]} days, other current liabilities ${FC_DATA.seed.oclDays[0]} days (deferred revenue and VAT), other current assets ${FC_DATA.seed.ocaDays[0]} days. Your payable days are the single biggest source of cash in the model — worth a hard look before you rely on them continuing.</p></div>`);

  /* 7 — financing */
  h += sec('7 · Financing',
    'Movements on debt and share capital. Positive numbers only; the direction is set by the row.',
    `<div class="panel"><div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>
    <tr><td class="l">Interest rate on average debt</td><td colspan="${yrs.length}" class="l">${ip('interestRate',0.25)} <span class="faint">an input, not derived — the ledger carries loan fees rather than an interest charge</span></td></tr>
    <tr><td class="l">New debt drawn</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${inum('debtDraw|'+i)}</td>`).join('')}</tr>
    <tr><td class="l">Debt repaid</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${inum('debtRepay|'+i)}</td>`).join('')}</tr>
    <tr><td class="l">Equity injected</td>${yrs.map((y,i)=>`<td class="${i===0?'sep':''}">${inum('equityInj|'+i)}</td>`).join('')}</tr>
    </tbody></table></div><p class="note">Opening debt at 31 December 2025 is ${fcAbs(FC_A[2025].bs.STD+FC_A[2025].bs.LTD)}. SAFE notes of ${fcAbs(FC_A[2025].bs.ONCL)} are held flat in other non-current liabilities and are not treated as debt.</p></div>`);

  /* 8 — tax */
  h += sec('8 · UAE corporate tax',
    'Applied to profit before tax, after the small-profit threshold and any losses brought forward.',
    `<div class="panel"><div class="tw"><table class="t"><tbody>
    <tr><td class="l">Corporate tax rate</td><td>${ip('ctRate',0.5)}</td><td class="l faint">Standard UAE rate is 9%</td></tr>
    <tr><td class="l">Taxable profit threshold</td><td>${inum('ctThreshold')}</td><td class="l faint">AED 375,000 of taxable profit is taxed at nil</td></tr>
    <tr><td class="l">Carry losses forward</td><td><input type="checkbox" data-fc="ctLossCF" data-fck="bool" ${a.ctLossCF?'checked':''}></td><td class="l faint">Offsets brought-forward and in-model losses against later taxable profit</td></tr>
    </tbody></table></div><p class="note">Neither ledger carries a corporate tax expense for the historical periods, so tax appears in the model from FY2026E onward only. This is a simplified computation on accounting profit — the real return will differ.</p></div>`);

  return {html: h};
}

/* ===================== PAGE: FORECAST ===================== */
function pgFcst(){
  const F = S.FC, P = F.P, last = P[P.length-1], first = P[0];
  const cagr = (first.rev > 0 && P.length > 1) ? Math.pow(last.rev / first.rev, 1/(P.length-1)) - 1 : null;
  const cumFcf = P.reduce((s,p)=>s+p.fcf, 0);
  const minCash = Math.min.apply(null, P.map(p=>p.bs.cash));
  const minYear = FC_YEARS[P.map(p=>p.bs.cash).indexOf(minCash)];
  const maxCheck = Math.max.apply(null, P.map(p=>Math.abs(p.bs.check)));

  let h = head('forecast');
  if(maxCheck > 1) h += `<div class="banner bad">The forecast balance sheet is out by ${fcN(maxCheck)} in at least one year. This is a model error, not an assumption problem.</div>`;

  const tiles = [
    ['Revenue, FY2031E', fcN(last.rev), cagr==null?'—':`${pct(cagr,1,true)} a year from FY2026E`],
    ['EBITDA, FY2031E', fcN(last.ebitda), `Margin ${fcP(last.ebitdam)}`],
    ['EBITDA margin, FY2026E', fcP(first.ebitdam), `FY2031E ${fcP(last.ebitdam)}`],
    ['Cumulative free cash flow', fcN(cumFcf), 'Operating cash less capex, six years'],
    ['Closing cash, FY2031E', fcN(last.bs.cash), `Lowest ${fcN(minCash)} in FY${minYear}E`],
    ['Net debt, FY2031E', fcN(last.bs.netDebt), last.bs.netDebt < 0 ? 'Net cash position' : 'Debt exceeds cash'],
    (()=>{ const neg = P.filter(p=>p.bs.cash < 0);
      return neg.length
        ? ['Cash goes negative', 'FY' + neg[0].year + 'E', 'Deepest ' + fcN(minCash) + ' in FY' + minYear + 'E']
        : ['Cash stays positive', 'All six years', 'Lowest ' + fcN(minCash) + ' in FY' + minYear + 'E']; })()
  ];
  h += sec('Where the plan lands', 'Driven entirely by the Assumptions page. Change anything there and every figure here moves.',
    `<div class="kstrip k7">${tiles.map(([l,v,s])=>`<div class="k"><div class="kt">${esc(l)}</div><div class="kv">${v}</div><div class="ks">${esc(s)}</div></div>`).join('')}</div>`);

  h += sec('Revenue and margin', 'Actual years shaded; forecast years from FY2026E.',
    `<div class="panel">${chartBox('c-fc-rev', 300)}</div>`);

  /* P&L */
  let pl = `<div class="tw"><table class="t"><thead><tr><th class="l sticky">AED</th>${fcHead()}</tr></thead><tbody>`;
  pl += fcRow('Revenue', c=>c.rev, {rowCls:'tot'});
  FC_LINES.forEach(s => { pl += fcRow(s, c=>c.revL[s], {indent:true, cls:'faint'}); });
  pl += fcRow('Direct cost', c=>-c.cogs, {sign:true});
  pl += fcRow('Gross profit', c=>c.gp, {rowCls:'sub'});
  pl += fcRow('Gross margin', c=>c.gm, {pct:true, cls:'faint'});
  pl += fcRow('Operating expenses', c=>-c.opexTot, {sign:true, rowCls:'sub'});
  FC_CATS.forEach(c0 => { pl += fcRow(c0, c=>-(c.opex[c0]||0), {indent:true, cls:'faint', sign:true}); });
  pl += fcRow('EBITDA', c=>c.ebitda, {rowCls:'sub', sign:true});
  pl += fcRow('EBITDA margin', c=>c.ebitdam, {pct:true, cls:'faint'});
  pl += fcRow('Depreciation and amortisation', c=>-c.dep, {sign:true});
  pl += fcRow('Operating profit (EBIT)', c=>c.ebit, {rowCls:'sub', sign:true});
  pl += fcRow('Finance costs', c=>-c.fin, {sign:true});
  pl += fcRow('Profit before tax', c=>c.pbt, {rowCls:'sub', sign:true});
  pl += fcRow('Corporate tax', c=>-(c.tax||0), {sign:true});
  pl += fcRow('Net profit', c=>c.np, {rowCls:'tot', sign:true});
  pl += fcRow('Net margin', c=>c.npm, {pct:true, cls:'faint'});
  pl += `</tbody></table></div><p class="note">Amounts in ${scaleWord()}. FY2026E is eight months of actuals plus a four-month stub. Historical years carry no corporate tax because none is posted in the ledger.</p>`;
  h += sec('Profit and loss', 'Three actual years and six forecast years on one basis.', `<div class="panel">${pl}</div>`);

  /* balance sheet */
  let bs = `<div class="tw"><table class="t"><thead><tr><th class="l sticky">AED</th>${fcHead()}</tr></thead><tbody>`;
  bs += fcRow('Cash and equivalents', c=>c.bs.cash, {sign:true});
  bs += fcRow('Receivables', c=>c.bs.ar);
  bs += fcRow('Other current assets', c=>c.bs.oca);
  bs += fcRow('Fixed and intangible assets, net', c=>c.bs.nbv);
  bs += fcRow('Total assets', c=>c.bs.ta, {rowCls:'sub'});
  bs += fcRow('Payables', c=>c.bs.ap);
  bs += fcRow('Other current liabilities', c=>c.bs.ocl);
  bs += fcRow('Debt', c=>c.bs.debt);
  bs += fcRow('Other non-current liabilities', c=>c.bs.oncl);
  bs += fcRow('Total liabilities', c=>c.bs.tl, {rowCls:'sub'});
  bs += fcRow('Share capital', c=>c.bs.sc);
  bs += fcRow('Accumulated earnings', c=>c.bs.re, {sign:true});
  bs += fcRow('Total equity', c=>c.bs.te, {rowCls:'sub', sign:true});
  bs += fcRow('Balance check', c=>c.bs.check, {rowCls:'tot', sign:true});
  bs += fcRow('Net debt', c=>c.bs.netDebt, {cls:'faint', sign:true});
  bs += `</tbody></table></div><p class="note">Receivables, payables and other working capital are driven by the day-count assumptions. The balance check is zero in every column when the model is sound.</p>`;
  h += sec('Balance sheet', 'Rolled forward from the 31 December 2025 actual closing position.', `<div class="panel">${bs}</div>`);

  /* cash flow — forecast years only */
  const fcell = (get, o) => {
    o = o || {};
    return `<tr class="${o.rowCls||''}"><td class="l sticky ${o.indent?'ind1':''}">${esc(o.label)}</td>` +
      P.map((p,i)=>{ const v = get(p); return `<td class="${i===0?'sep':''} ${o.cls||''} ${v<0?'neg':''}">${fcN(v)}</td>`; }).join('') + `</tr>`;
  };
  let cf = `<div class="tw"><table class="t"><thead><tr><th class="l sticky">AED</th>${FC_YEARS.map((y,i)=>`<th class="${i===0?'sep':''}">${y}E</th>`).join('')}</tr></thead><tbody>`;
  cf += fcell(p=>p.np, {label:'Net profit'});
  cf += fcell(p=>p.dep, {label:'Depreciation and amortisation', indent:true, cls:'faint'});
  cf += fcell(p=>-(p.bs.ar-p.open.ar)-(p.bs.oca-p.open.oca)+(p.bs.ap-p.open.ap)+(p.bs.ocl-p.open.ocl), {label:'Working capital movement', indent:true, cls:'faint'});
  cf += fcell(p=>p.cfo, {label:'Operating cash flow', rowCls:'sub'});
  cf += fcell(p=>p.cfi, {label:'Capital expenditure'});
  cf += fcell(p=>p.fcf, {label:'Free cash flow', rowCls:'sub'});
  cf += fcell(p=>p.cff, {label:'Financing'});
  cf += fcell(p=>p.dCash, {label:'Movement in cash', rowCls:'sub'});
  cf += fcell(p=>p.open.cash, {label:'Opening cash', cls:'faint'});
  cf += fcell(p=>p.bs.cash, {label:'Closing cash', rowCls:'tot'});
  cf += `</tbody></table></div><p class="note">Free cash flow here is operating cash flow after capex. The unlevered figure used for a valuation is built separately.</p>`;
  h += sec('Cash flow', 'Forecast years only — the historical statements are on the Cash flow page.', `<div class="panel">${cf}</div>`);

  return {html: h, after: () => {
    const cols = fcCols(), labels = cols.map(c=>c.hist ? c.year+'A' : c.year+'E');
    drawChart('c-fc-rev', {
      labels,
      series: [
        {name:'Revenue', type:'bar', axis:'y', data:cols.map(c=>c.rev),
         colors: cols.map(c=>c.hist ? COL.slateL : COL.accentL)},
        {name:'EBITDA margin', type:'line', axis:'y2', data:cols.map(c=>c.ebitdam), color:COL.accent}
      ],
      y:{fmt:axMoney, zero:true}, y2:{fmt:pctAx}, legend:true,
      aria:'Revenue by year with EBITDA margin'
    });
  }};
}

const PAGE_FN = {exec:pgExec, forecast:pgFcst, assume:pgAssume, revenue:pgRevenue, profit:pgProfit, expense:pgExpense, cash:pgCash, bs:pgBS, wc:pgWC, drivers:pgDrivers, explorer:pgExplorer, library:pgLibrary, config:pgConfig, validation:pgValidation};

function initState(data, keepCfg){
  S.data = clone(data);
  const base = {company:data.company||'Client company', industry:data.industry||'', fy:+data.fy||new Date().getFullYear(), currency:data.currency||'AED', startMonth:+data.startMonth||0};
  if(keepCfg && S.cfg) Object.assign(S.cfg, base);
  else S.cfg = Object.assign(base, {thr:clone(DEFAULT_THRESHOLDS), rules:clone(DEFAULT_RULES), par:clone(DEFAULT_PARAMS), dir:Object.fromEntries(DIR_ITEMS.map(d=>[d[0],d[2]]))});
}
function recompute(keepFilters){
  S.M = buildModel(S.data, S.cfg); S.V = validate(S.M);
  const N = S.M.N;
  if(!keepFilters || S.f.month > N-1) S.f.month = N-1;
  const lq = Math.floor((N-1)/3); if(!keepFilters || S.f.quarter > lq) S.f.quarter = lq;
  render();
}
function render(keepScroll){
  const y = window.scrollY;
  const pg = document.getElementById('pages');
  try{
    if(!S.fc) S.fc = fcLoad();
    S.FC = buildFcst(S.fc);
    S.C = analysisContext(); S.A = analyze(S.C);
    renderNav(); renderBar();
    const out = PAGE_FN[S.tab]();
    pg.innerHTML = `<div class="page">${out.html}</div>`;
    if(out.after) out.after();
  }catch(e){
    console.error(e);
    pg.innerHTML = `<div class="page"><div class="banner bad">This page could not be calculated: ${esc(e.message)}. Check the account mapping and data on the Configuration and Data validation pages.</div></div>`;
  }
  hideTip();
  if(keepScroll) window.scrollTo(0, y);
}
function go(id){ if(!PAGE_FN[id]) return; S.tab = id; render(); window.scrollTo(0,0); const m = document.querySelector('main'); if(m) m.focus({preventScroll:true}); }

function renderNav(){
  const nA = document.getElementById('navA'), nB = document.getElementById('navB'), V = S.V, hiA = S.A.alerts.some(a=>a.pri==='High');
  const item = p => { const i = PAGES.indexOf(p); return `<a class="${S.tab===p.id?'on':''}" data-go="${p.id}" tabindex="0" role="link"${S.tab===p.id?' aria-current="page"':''}><span class="n">${i+1}</span><span>${p.n}${p.id==='validation'&&V.fails?'<i class="flag" title="Checks failed"></i>':''}${p.id==='drivers'&&hiA?'<i class="flag" title="High-priority alerts"></i>':''}</span></a>`; };
  nA.innerHTML = PAGES.filter(p=>p.grp==='A').map(item).join('');
  nB.innerHTML = PAGES.filter(p=>p.grp==='B').map(item).join('');
  document.getElementById('coName').textContent = 'Financial performance report';
  document.getElementById('coMeta').textContent = `FY ${S.cfg.fy}, ${S.cfg.currency}${S.cfg.industry?', '+S.cfg.industry:''}`;
  document.getElementById('navFoot').innerHTML = `<b>${S.M.N}</b> months of data<br>Checks: ${V.fails?`<b style="color:#f0a39b">${V.fails} failed</b>`:'<b>all reconcile</b>'}<br>Source: ${esc(S.data.source||'general ledger')}.<br>Switch year, or compare with last year, in the toolbar above.`;
  document.title = `${S.cfg.company} — Management report FY ${S.cfg.fy}`;
}
function yearOptions(){
  return Object.keys(DATASETS).sort().map(y=>`<option value="${y}" ${+y===S.cfg.fy?'selected':''}>${esc(DATASETS[y].label||y)}</option>`).join('');
}
function loadYear(y){
  const d = DATASETS[String(y)]; if(!d) return;
  initState(d, true); S.ui.exInit = false; S.ui.msg = null; recompute(false);
}
function renderBar(){
  const f = S.f, M = S.M, N = M.N, L = M.L, spec = S.C.spec;
  const seg = (key, opts, title) => `<div class="seg" role="group" aria-label="${title}">${opts.map(([v,l])=>`<button data-f="${key}" data-v="${v}" class="${f[key]===v?'on':''}" aria-pressed="${f[key]===v}">${l}</button>`).join('')}</div>`;
  const mSel = `<select data-f="month" aria-label="Month" ${f.period==='M'||f.period==='YTD'?'':'disabled'}>${R(0,11).map(i=>`<option value="${i}" ${i===Math.min(f.month,N-1)?'selected':''} ${i>=N?'disabled':''}>${L[i]} ${M.yrs[i]}${i===lvPartIdx()?' · part month':''}</option>`).join('')}</select>`;
  const qSel = `<select data-f="quarter" aria-label="Quarter" ${f.period==='Q'?'':'disabled'}>${[0,1,2,3].map(q=>`<option value="${q}" ${q===f.quarter?'selected':''} ${q*3>=N?'disabled':''}>Q${q+1}${q*3<N&&q*3+2>=N?' (partial)':''}</option>`).join('')}</select>`;
  const cmp = [['prev','Previous period'],['yoy','Same period last year'],['ytdavg','YTD average'],['mavg','Monthly average'],['first','First month / quarter'],['q1','First quarter (Q1)'],['h1','First half (H1)']];
  document.getElementById('bar').innerHTML = `<div class="fg"><label>Financial year</label><select id="yearSel" aria-label="Financial year">${yearOptions()}</select></div>
<div class="fg"><label>Period</label>${seg('period',[['M','Monthly'],['Q','Quarterly'],['YTD','YTD'],['FY','Full year']],'Period')}</div>
<div class="fg"><label>Month</label>${mSel}</div><div class="fg"><label>Quarter</label>${qSel}</div>
<div class="fg"><label>Compare with</label><select data-f="cmp" aria-label="Comparison">${cmp.map(([v,l])=>`<option value="${v}" ${f.cmp===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="fg"><label>View</label>${seg('view',[['amt','Amount'],['pct','% of revenue'],['margin','Margin %'],['growth','Growth %']],'View')}</div>
<div class="fg"><label>Scale</label>${seg('scale',[['A','Actual'],['K','Thousands'],['M','Millions']],'Scale')}</div>
<div class="fg"><label>Statement (opens explorer)</label>${seg('stmt',[['PL','P&L'],['BS','Balance sheet'],['CF','Cash flow']],'Statement')}</div>
<div class="ctxline">${lvChip()} <a data-act="lv-refresh" tabindex="0" role="button">Refresh</a><br><b>${esc(pLabel(spec.P,true))}</b>${f.period==='Q'&&spec.P.length<3?' (partial quarter)':''}<br>${spec.B?'compared with '+esc(spec.name):`<span class="warn">${esc(spec.why)}</span>`}</div>`;
}
function kpiTip(id){
  const k = KPI[id]; if(!k) return '';
  return `<div class="th">${esc(k.n)}</div><div>${esc(k.d)}</div><div class="kk"><span>How it is calculated</span><code>${esc(k.f)}</code></div><div class="kk"><span>Why it matters</span>${esc(k.w)}</div><div class="kk"><span>What management should look for</span>${esc(k.l)}</div>${k.thr?`<div class="kk"><span>Thresholds (editable)</span>${esc(thrText(k.thr))}</div>`:''}`;
}

/* ---------- configuration changes ---------- */
function applyCfg(el){
  MODEL_CACHE = {};
  const [kind, a, b] = el.getAttribute('data-cfg').split(':');
  const val = el.type==='checkbox' ? el.checked : el.value;
  const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  if(kind==='co'){ S.cfg[a] = (a==='fy'||a==='startMonth') ? parseInt(val,10) : String(val).trim(); }
  else if(kind==='thr'){ const t = S.cfg.thr.find(x=>x.id===a); if(b==='dir') t.dir = val; else t.t[+b] = n(val); }
  else if(kind==='rule'){ const r = S.cfg.rules.find(x=>x.id===a); if(b==='on') r.on = !!val; else if(b==='thr') r.thr = n(val); else r.pri = val; }
  else if(kind==='par'){ S.cfg.par[a] = n(val); }
  else if(kind==='dir'){ S.cfg.dir[a] = val; }
  else if(kind==='map'){ const acc = S.data.accounts[+a]; if(b==='cls'){ acc.cls = val; if(val==='OPEX' && !acc.cat) acc.cat = 'Other expenses'; } else acc.cat = String(val).trim(); }
  S.M = buildModel(S.data, S.cfg); S.V = validate(S.M);
  const N = S.M.N; if(S.f.month > N-1) S.f.month = N-1; if(S.f.quarter*3 >= N) S.f.quarter = Math.floor((N-1)/3);
  render(true);
}

/* ---------- import / export ---------- */
function toCSV(){
  const L = S.M.L, q = v => { const s = String(v==null?'':v); return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [['Statement','Account','Class','Category','Opening',...L].join(',')];
  S.data.accounts.forEach(a=>lines.push([a.st,a.acct,a.cls,a.cat||'',a.open==null?'':a.open,...R(0,11).map(i=>a.v&&a.v[i]!=null?a.v[i]:'')].map(q).join(',')));
  return lines.join('\r\n');
}
function parseCSV(t){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function importCSV(text){
  const rows = parseCSV(text.replace(/^\uFEFF/,'')); if(rows.length<2) throw new Error('the file has no data rows');
  const h = rows[0].map(x=>x.trim().toLowerCase()), ix = n => h.indexOf(n);
  const iSt=ix('statement'), iAc=ix('account'), iCl=ix('class'), iCat=ix('category'), iOp=ix('opening');
  if(iSt<0||iAc<0||iCl<0) throw new Error('the header must include Statement, Account and Class columns');
  const first = Math.max(iSt,iAc,iCl,iCat,iOp)+1;
  const code = {}; Object.keys(CLASSES).forEach(st=>Object.entries(CLASSES[st]).forEach(([c,l])=>{ code[st+'|'+l.toLowerCase()]=c; code[st+'|'+c.toLowerCase()]=c; }));
  const stMap = {'pl':'PL','p&l':'PL','profit & loss':'PL','profit and loss':'PL','income statement':'PL','bs':'BS','balance sheet':'BS','cf':'CF','cash flow':'CF','cash flow statement':'CF'};
  return rows.slice(1).map(r=>{ const sr=(r[iSt]||'').trim(), st=stMap[sr.toLowerCase()]||sr.toUpperCase(), cr=(r[iCl]||'').trim();
    return {st, acct:(r[iAc]||'').trim(), cls:code[st+'|'+cr.toLowerCase()]||cr.toUpperCase(), cat:iCat>=0?(r[iCat]||'').trim():'', open:iOp>=0&&r[iOp]!==''?r[iOp]:null, v:R(0,11).map(k=>r[first+k]!==undefined&&r[first+k]!==''?r[first+k]:null)}; });
}
function download(name, text, type){
  try{ const blob = new Blob([text],{type}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800); }
  catch(e){ showText(name, text); }
}
function showText(name, text){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:2000;display:grid;place-items:center';
  d.innerHTML = `<div class="panel" style="width:min(900px,92vw)"><h3>${esc(name)}</h3><div class="q">Copy the text below and save it as ${esc(name)}.</div><textarea style="width:100%;height:50vh;font:12px/1.4 monospace">${esc(text)}</textarea><div class="btns" style="margin-top:8px"><button class="btn pri" data-close="1">Close</button></div></div>`;
  d.addEventListener('click', e=>{ if(e.target===d || e.target.getAttribute('data-close')) d.remove(); });
  document.body.appendChild(d);
}
function handleFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const t = String(rd.result);
      if(/\.json$/i.test(file.name) || /^\s*\{/.test(t)){
        const o = JSON.parse(t);
        if(o.cfg){ ['thr','rules','par','dir'].forEach(k=>{ if(o.cfg[k]) S.cfg[k]=o.cfg[k]; }); ['company','industry','fy','currency','startMonth'].forEach(k=>{ if(o.cfg[k]!=null) S.cfg[k]=o.cfg[k]; }); S.ui.msg={t:`Settings loaded from ${file.name}.`}; }
        else if(o.accounts){ initState(o, true); S.ui.msg={t:`Data loaded from ${file.name}: ${o.accounts.length} accounts.`}; }
        else throw new Error('unrecognised JSON file');
      } else {
        const acc = importCSV(t);
        S.data = {company:S.cfg.company, industry:S.cfg.industry, fy:S.cfg.fy, currency:S.cfg.currency, startMonth:S.cfg.startMonth, accounts:acc};
        S.ui.msg = {t:`Data loaded from ${file.name}: ${acc.length} accounts. Check the account mapping and the Data validation page.`};
      }
      S.ui.exInit = false; recompute(false);
    }catch(e){ S.ui.msg = {t:`Could not load ${file.name}: ${e.message}.`, bad:true}; render(true); }
  };
  rd.readAsText(file);
}

/* ---------- events ---------- */
function bindEvents(){
  const tip = el => { const r = el.getBoundingClientRect(); showTip(kpiTip(el.getAttribute('data-kpi')), r.right, r.bottom); };
  document.addEventListener('click', e=>{
    const t = e.target;
    const k = t.closest('[data-kpi]'); if(k){ e.stopPropagation(); tip(k); return; }
    const fb = t.closest('button[data-f]');
    if(fb){ const key = fb.getAttribute('data-f'), v = fb.getAttribute('data-v'); S.f[key] = v; if(key==='stmt' && S.tab!=='explorer'){ go('explorer'); return; } render(true); return; }
    const ub = t.closest('[data-ui]'); if(ub){ S.ui[ub.getAttribute('data-ui')] = ub.getAttribute('data-v'); render(true); return; }
    const tg = t.closest('[data-tg]'); if(tg){ const id = tg.getAttribute('data-tg'); S.ui.exOpen[id] = !S.ui.exOpen[id]; render(true); return; }
    const ea = t.closest('[data-exall]'); if(ea){ const open = ea.getAttribute('data-exall')==='1'; exRows(S.f.stmt,S.M).forEach(r=>{ if(r.tog) S.ui.exOpen[r.id] = open; }); render(true); return; }
    const act = t.closest('[data-act]');
    if(act){ const a = act.getAttribute('data-act'), slug = S.cfg.company.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'client';
      if(a==='csv-out') download(`${slug}-fy${S.cfg.fy}-statements.csv`, toCSV(), 'text/csv');
      else if(a==='json-out') download(`${slug}-dashboard-settings.json`, JSON.stringify({type:'dashboard-settings', cfg:S.cfg}, null, 2), 'application/json');
      else if(a==='load') document.getElementById('fileIn').click();
      else if(a==='lv-refresh'){ lvRefresh(false); }
      else if(a==='fc-reset'){ S.fc = fcDefaults(); fcSave(); S.ui.msg = {t:'Forecast assumptions reset to the seeded defaults.'}; render(true); }
      else if(a==='reset'){ const y=String(S.cfg.fy); initState(DATASETS[y]||SAMPLE_DATA, false); S.ui.exInit=false; S.ui.msg = {t:`Ledger data for ${y} and default settings restored.`}; recompute(false); }
      return; }
    const g = t.closest('[data-go]'); if(g){ e.preventDefault(); go(g.getAttribute('data-go')); return; }
    hideTip();
  });
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const t = e.target; if(t.matches('input,select,textarea,button')) return;
    if(t.hasAttribute('data-go') || t.hasAttribute('data-tg') || t.hasAttribute('data-kpi')){ e.preventDefault(); t.click(); }
  });
  document.addEventListener('change', e=>{
    const t = e.target;
    if(t.matches('[data-fc]')){
      const kind = t.getAttribute('data-fck'), path = t.getAttribute('data-fc');
      let v = kind==='bool' ? t.checked : kind==='sel' ? t.value : (num(t.value) || 0);
      if(kind==='pct') v = v/100;
      fcPut(path, v); fcSave(); S.FC = buildFcst(S.fc);
      // a driver change swaps the input type on that row, so it needs a repaint;
      // a value change must NOT repaint or the field being tabbed out of loses focus
      if(kind==='sel') render(true); else fcLiveUpdate();
      return;
    }
    if(t.matches('select[data-f]')){ S.f[t.getAttribute('data-f')] = t.getAttribute('data-f')==='cmp' ? t.value : +t.value; render(true); }
    else if(t.matches('[data-cfg]')) applyCfg(t);
    else if(t.matches('[data-ui-sel]')){ S.ui[t.getAttribute('data-ui-sel')] = t.value; render(true); }
    else if(t.id==='yearSel'){ loadYear(t.value); }
    else if(t.id==='fileIn' && t.files[0]){ handleFile(t.files[0]); t.value=''; }
  });
  document.addEventListener('input', e=>{ if(e.target.id==='libq'){ S.ui.libQ = e.target.value; filterLib(); } });
  document.addEventListener('mouseover', e=>{ const k = e.target.closest && e.target.closest('[data-kpi]'); if(k) tip(k); });
  document.addEventListener('mouseout', e=>{ const k = e.target.closest && e.target.closest('[data-kpi]'); if(k) hideTip(); });
  document.addEventListener('focusin', e=>{ if(e.target.hasAttribute && e.target.hasAttribute('data-kpi')) tip(e.target); });
  document.addEventListener('focusout', e=>{ if(e.target.hasAttribute && e.target.hasAttribute('data-kpi')) hideTip(); });
  window.addEventListener('scroll', hideTip, {passive:true});
}
document.addEventListener('DOMContentLoaded', ()=>{ initState(SAMPLE_DATA, false); bindEvents(); recompute(false); lvRefresh(true); });

</script>
