<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanshels — financial performance dashboard</title>
<style>
:root{
  --ink:#0c2a3a; --ink-2:#20465a; --paper:#faf8f5; --panel:#ffffff; --rule:#e8e2d9; --rule-2:#f2ede6;
  --muted:#5a6570; --faint:#8b9299; --accent:#f58220; --accent-2:#6f8fa0; --accent-soft:#fdf1e3; --accent-wash:#fef7ef;
  --fav:#1a7f4b; --unfav:#b3261e; --watch:#a15c00; --neutral:#64748b;
  --serif:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13.5px/1.45 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}

/* navigation */
.nav{background:var(--ink);color:#c9d2e3;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 0 18px;display:flex;flex-direction:column}
.brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .firm{font-family:var(--serif);font-size:20px;color:#fff;letter-spacing:.005em}
.brand .co{font-size:12.5px;color:#dbe3f0;margin-top:8px;line-height:1.35}
.brand .meta{font-size:11.5px;color:#8fa0bb;margin-top:3px}
.nav .grp{font-size:11.5px;color:#7f90ab;padding:18px 20px 6px}
.nav a{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:6px 20px 6px 17px;color:#c9d2e3;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
.nav a .n{color:#6f809c;font-size:11.5px;padding-top:1px}
.nav a:hover{background:rgba(255,255,255,.045);color:#fff}
.nav a.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:#f58220}
.nav a.on .n{color:#f58220}
.nav a .flag{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e0685f;margin-left:6px;vertical-align:middle}
.nav .foot{margin-top:auto;padding:16px 20px 0;font-size:11.5px;color:#8fa0bb;line-height:1.5}
.nav .foot b{color:#dbe3f0;font-weight:600}

/* toolbar */
main{min-width:0}
main:focus{outline:none}
.bar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.97);border-bottom:1px solid var(--rule);padding:10px 28px 11px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg>label{font-size:11px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;background:#fff;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button:hover{color:var(--ink);background:#f7f8fa}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{color:#c0c6d0;cursor:not-allowed;background:#fff}
select{font-size:12.5px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;cursor:pointer}
select:disabled{color:#b3bac6;cursor:not-allowed}
.ctxline{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.35;max-width:330px}
.ctxline b{color:var(--ink);font-weight:600}
.ctxline .warn{color:var(--watch)}

/* page scaffolding */
.page{padding:22px 28px 70px;max-width:1500px}
.ph{margin-bottom:16px}
.ph h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15;margin:0;letter-spacing:-.005em}
.ph p{margin:6px 0 0;color:var(--muted);max-width:78ch}
.sec{margin-top:30px}
.sec>h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 3px}
.sec>.q{color:var(--muted);margin:0 0 12px;font-size:12.5px;max-width:90ch}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;min-width:0}
.panel h3{font-size:13.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:6px}
.panel .q{font-size:12px;color:var(--faint);margin:3px 0 10px;line-height:1.4}
.panel .ph3{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel .ph3 .q{margin-bottom:10px}
.t.cmp td.l{min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:8px;max-width:95ch}
.empty{padding:18px;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);background:#fbfcfd;font-size:12.5px}

/* tones and status */
.pos{color:var(--fav)} .neg{color:var(--unfav)} .neu{color:var(--neutral)} .wat{color:var(--watch)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.s0{background:#dff3e7;color:#14663d} .s1{background:#e3eefb;color:#1f4f8a} .s2{background:#fcefd6;color:#8a5200} .s3{background:#fbe2df;color:#9b2119} .sx{background:#eceff3;color:#556072}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.s0{background:#2f9e62} .dot.s1{background:#4a83c9} .dot.s2{background:#d19418} .dot.s3{background:#d0473d}
.i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid #c5ccd8;color:#7d8797;font:italic 600 10.5px/1 var(--serif);cursor:help;flex:none;background:#fff}
.i:hover,.i:focus{border-color:var(--accent);color:var(--accent)}

/* KPI strip: one ledger-like block with internal rules */
.kstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.k{padding:12px 14px 9px;box-shadow:1px 0 0 var(--rule),0 1px 0 var(--rule);min-width:0;position:relative;background:#fff}
.k[data-go]{cursor:pointer}
.k[data-go]:hover{background:#fafcfc}
.k .kt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.k .kt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k .kv{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .kd{font-size:12px;margin-top:2px;line-height:1.35}
.k .kd .vs{color:var(--faint)}
.k .ks{font-size:11.5px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k svg.sp{display:block;width:100%;height:26px;margin-top:6px}
.kstrip.compact .kv{font-size:18px}
@media (min-width:1380px){.kstrip.k7{grid-template-columns:repeat(7,minmax(0,1fr))}}

/* management conclusion — the one expressive element */
.lead{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:20px 26px 18px}
.lead .say{font-family:var(--serif);font-size:18.5px;line-height:1.62;color:#1b2740;max-width:82ch;margin:0}
.lead .say .ev{color:inherit;text-decoration:none;border-bottom:2px solid var(--accent-soft);cursor:pointer;white-space:nowrap}
.lead .say .ev:hover{background:var(--accent-wash);border-bottom-color:var(--accent)}
.lead .by{margin-top:12px;font-size:12px;color:var(--faint)}
.banner{display:flex;gap:10px;align-items:center;background:#fff7e6;border:1px solid #f1d8a6;color:#6b4300;border-radius:8px;padding:9px 14px;margin-bottom:14px;font-size:12.5px}
.banner.bad{background:#fdecea;border-color:#f3c3be;color:#7c1d16}
.banner a{cursor:pointer;font-weight:600;color:inherit}

/* diagnostic path (a real sequence, so it is numbered) */
.path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--rule);border-radius:8px;background:#fff;overflow:hidden}
.path .st{padding:11px 13px 12px;box-shadow:1px 0 0 var(--rule);cursor:pointer;position:relative;min-width:0}
.path .st:hover{background:#fafcfc}
.path .st::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rule)}
.path .st.pos::before{background:#57b283} .path .st.neg::before{background:#d36a60} .path .st.wat::before{background:#e0ad4f}
.path .st .sn{font-size:11px;color:var(--faint)}
.path .st .sp2{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:1px}
.path .st .sf{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}

/* scorecard */
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border:1px solid var(--rule);border-radius:8px;background:#fff;overflow:hidden}
.score .sc{padding:12px 14px;box-shadow:1px 0 0 var(--rule),0 1px 0 var(--rule)}
.score .sc .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.score .sc .nm{font-weight:600;font-size:13px}
.score .sc .mv{font-size:18px;font-weight:600;margin-top:6px}
.score .sc .ex{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:32px}
.fact{padding:8px 0;border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fact .fl{color:var(--muted);font-size:12.5px}
.fact .fv{font-weight:600;text-align:right;font-size:13px}
.fact .fv small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}

/* tables */
.tw{overflow:auto;border:1px solid var(--rule);border-radius:8px;background:#fff}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.t th{font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:11.5px;background:#f8f9fb;position:sticky;top:0;z-index:1}
.t td{padding:6px 10px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap}
.t th.l,.t td.l{text-align:left}
.t td.l{white-space:normal;min-width:180px}
.t tr:last-child td{border-bottom:0}
.t tr.sub td{font-weight:600;background:#fafbfc}
.t tr.tot td{font-weight:700;background:#f4f7f7;border-top:1px solid #cfd8dc}
.t tr.grp td{font-weight:600;color:var(--ink-2);background:#f8f9fb;font-size:12px}
.t tr.sel td{background:#f0f7f6}
.t td.selc,.t th.selc{background:#eef6f5}
.t .ind1{padding-left:24px!important} .t .ind2{padding-left:40px!important;color:var(--muted)}
.t .tg{cursor:pointer;user-select:none}
.t .tg::before{content:"▸";display:inline-block;width:14px;color:var(--faint);transition:transform .12s}
.t .tg.open::before{transform:rotate(90deg)}
.t td.sticky,.t th.sticky{position:sticky;left:0;background:inherit;z-index:2}
.t th.sticky{z-index:3;background:#f8f9fb}
.t tr td.sticky{background:#fff} .t tr.sub td.sticky{background:#fafbfc} .t tr.tot td.sticky{background:#f4f7f7} .t tr.grp td.sticky{background:#f8f9fb}
.t td.sep,.t th.sep{border-left:1px solid var(--rule)}
.heat-up{background:#fbecea} .heat-up2{background:#f6d4d0} .heat-dn{background:#e8f5ee} .heat-dn2{background:#cfeadb}

/* momentum badges */
.mo{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.mo.Accelerating{background:#dff3e7;color:#14663d} .mo.Stable{background:#e8edf4;color:#3c4a60} .mo.Slowing{background:#fcefd6;color:#8a5200} .mo.Declining{background:#fbe2df;color:#9b2119}

/* charts */
.ch{position:relative;width:100%;min-height:60px}
.ch svg{display:block;overflow:visible}
.ch text{font-family:var(--sans);font-size:11px;fill:#6b7585}
.ch .lg{cursor:pointer}
.ch .lg.off text{fill:#b5bcc7;text-decoration:line-through}
.ch .hv{fill:transparent;cursor:crosshair}
.ch .guide{stroke:#98a2b3;stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.chead .vw{font-size:11px;color:var(--faint);white-space:nowrap}

/* tooltip */
.tip{position:fixed;z-index:1000;max-width:360px;background:var(--ink);color:#e6ecf5;border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 8px 24px rgba(20,33,61,.22)}
.tip.on{opacity:1}
.tip .th{font-weight:600;color:#fff;font-size:12.5px;margin-bottom:4px}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.tip .tr b{color:#fff;font-weight:600}
.tip .kk{margin-top:6px} .tip .kk span{display:block;color:#93a4c0;font-size:11px}
.tip code{font-family:inherit;color:#bfe3dd}

/* matrix */
.mx{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr 24px;gap:8px}
.mx .ax{font-size:11.5px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.mx .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.mx .qd{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-height:110px;background:#fff;border-top-width:3px}
.mx .qd .qt{font-weight:600;font-size:12.5px} .mx .qd .qs{font-size:11.5px;color:var(--faint);margin-bottom:8px}
.mx .qd.a{border-top-color:#57b283} .mx .qd.b{border-top-color:#e0ad4f} .mx .qd.c{border-top-color:#8fa7cf} .mx .qd.d{border-top-color:#d36a60}
.chip{display:inline-block;padding:2px 8px;margin:0 4px 4px 0;border-radius:5px;background:#f1f3f6;font-size:12px;border:1px solid #e3e7ed}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}

/* insights / alerts / drivers */
.ins{list-style:none;margin:0;padding:0}
.ins li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-2);align-items:baseline}
.ins li:last-child{border-bottom:0}
.ins .mk{width:8px;height:8px;border-radius:50%;background:var(--neutral);margin-top:5px}
.ins .mk.pos{background:#2f9e62} .ins .mk.neg{background:#d0473d} .ins .mk.wat{background:#d19418}
.ins .go{font-size:12px;cursor:pointer;color:var(--accent);white-space:nowrap}
.ins .th{font-size:11px;color:var(--faint);display:block;margin-top:1px}
.alg{margin-bottom:14px}
.alg h4{margin:0 0 4px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.pri-High{background:#fbe2df;color:#9b2119} .pri-Medium{background:#fcefd6;color:#8a5200} .pri-Monitor{background:#e3eefb;color:#1f4f8a}
.drv{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--rule-2)}
.drv:last-child{border-bottom:0}
.drv .dn{font-weight:600;font-size:13px}
.drv .dx{font-size:12px;color:var(--muted);grid-column:1/2}
.drv .dv{text-align:right;font-weight:600}
.drv .db{grid-column:1/3;height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.drv .db i{display:block;height:100%}

/* configuration */
.cfgt input[type=number],.cfgt input[type=text]{width:84px;padding:4px 6px;border:1px solid var(--rule);border-radius:5px;background:#fff;text-align:right}
.cfgt input.w{width:170px;text-align:left}
.cfgt select{padding:3px 6px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form input,.form select{padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;font-size:13px;color:var(--ink)}
.btn{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:#b9c2cf}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{padding:6px 10px;border:1px solid var(--rule);border-radius:6px;width:280px;background:#fff}
.vgrid{display:grid;grid-template-columns:repeat(13,22px);gap:3px}
.vgrid i{display:block;width:22px;height:18px;border-radius:3px;font-style:normal;font-size:10px;text-align:center;line-height:18px;color:#fff}
.vgrid i.ok{background:#57b283} .vgrid i.bad{background:#d0473d} .vgrid i.wn{background:#e0ad4f} .vgrid i.na{background:#e5e8ed;color:#8a93a3}

@media (max-width:1180px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.path{grid-template-columns:repeat(3,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 10px}
  .nav .brand{width:100%;border:0;padding:0 10px 8px}.nav .grp,.nav .foot{display:none}
  .nav nav{display:contents}.nav a{grid-template-columns:auto;padding:5px 10px;border-left:0;border-radius:5px}.nav a .n{display:none}
  .g2,.g3{grid-template-columns:1fr}.path{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:1fr}.page{padding:18px 14px 50px}.bar{padding:10px 14px;position:static}.ctxline{margin-left:0;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.nav,.bar{display:none}.app{grid-template-columns:1fr}.page{padding:0}}


/* ---- Finanshels design system ---- */
.panel,.lead,.card,.kpi,.tbl,.box{border-radius:14px}
.panel,.lead{box-shadow:0 1px 2px rgba(12,42,58,.04),0 8px 24px rgba(12,42,58,.05)}
.seg{border-radius:8px}
.seg button.on{background:var(--ink);color:#fff}
#yearSel{font-weight:600;color:var(--ink);border-color:#d9cfc2;background:#fff}
.fci{width:92px;text-align:right;padding:4px 6px;border:1px solid #ddd3c6;border-radius:6px;background:#fff;color:#1d4ed8;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.fci:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.fcs{padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:#fff;font-size:12px;max-width:170px}
.t th.fch{background:#f3efe9}
.t td.ind1{color:var(--muted)}
.fclive{padding:11px 16px;margin-bottom:14px;font-size:13px}
.lvchip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:#fff;white-space:nowrap}
.lvchip.ok{color:#14663d;border-color:#bfe0cd;background:#f1f9f4}
.lvchip.warn{color:#8a5200;border-color:#f0d9a8;background:#fdf6e7}
.lvchip.off{color:var(--muted);background:#f4f2ee}
.lvchip.load{color:var(--muted)}
.ctxline a[data-act]{cursor:pointer;font-size:11.5px}
.srcnote{font-size:11px;color:var(--faint);margin-top:2px}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" aria-label="Report pages">
    <div class="brand"><div class="firm">Finanshels</div><div class="co" id="coName"></div><div class="meta" id="coMeta"></div></div>
    <div class="grp">Analysis</div><nav id="navA"></nav>
    <div class="grp">Detail and setup</div><nav id="navB"></nav>
    <div class="foot" id="navFoot"></div>
  </aside>
  <main tabindex="-1"><div class="bar" id="bar"></div><div id="pages"></div></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>

const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const R = (a,b) => { const o=[]; for(let i=a;i<=b;i++) o.push(i); return o; };
const sum = a => a.reduce((s,x)=>s+(x||0),0);
const dv = (a,b) => (a==null||b==null||!isFinite(a)||!isFinite(b)||b===0) ? null : a/b;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(x){
  if(x===null||x===undefined) return null;
  if(typeof x==='number') return isFinite(x)?x:NaN;
  let t=String(x).trim(); if(t==='') return null;
  let neg=false; t=t.replace(/[,\s]/g,'');
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  if(t==='-'||t==='—') return 0;
  const v=Number(t); return isNaN(v)?NaN:(neg?-v:v);
}
function monthLabels(cfg){ return R(0,11).map(i=>MN[(cfg.startMonth+i)%12]); }
function monthYears(cfg){ return R(0,11).map(i=> cfg.fy - (cfg.startMonth>0?1:0) + Math.floor((cfg.startMonth+i)/12)); }
function monthDays(cfg){ const ys=monthYears(cfg); return R(0,11).map(i=>{ const mi=(cfg.startMonth+i)%12; return new Date(ys[i],mi+1,0).getDate(); }); }

function buildModel(D, cfg){
  const q = {dup:[], invalid:[], missing:[], unmapped:[]};
  const L = monthLabels(cfg), days = monthDays(cfg), yrs = monthYears(cfg);
  const seen = {};
  const rows = (D.accounts||[]).map((a,i)=>{
    const vals = R(0,11).map(k=>num(a.v?a.v[k]:null));
    const r = {st:a.st, acct:String(a.acct||'').trim(), cls:a.cls, cat:(a.cat||'').trim(), vals, open:num(a.open), i};
    const key = a.st+'|'+r.acct.toLowerCase();
    if(seen[key]) q.dup.push(r); seen[key]=1;
    if(!CLASSES[a.st] || !CLASSES[a.st][a.cls]) q.unmapped.push(r);
    vals.forEach((v,k)=>{ if(Number.isNaN(v)) q.invalid.push({r,k}); });
    if(Number.isNaN(r.open)) q.invalid.push({r,k:-1});
    return r;
  });
  let N = 0;
  rows.forEach(r=>{ if(r.st==='PL') r.vals.forEach((v,k)=>{ if(v!==null && !Number.isNaN(v) && v!==0) N=Math.max(N,k+1); }); });
  if(!N) N = 12;
  rows.forEach(r=>{ for(let k=0;k<N;k++) if(r.vals[k]===null) q.missing.push({r,k}); });

  const val = (r,k) => { const v=r.vals[k]; return (v===null||Number.isNaN(v))?0:v; };
  const Z = () => Array(12).fill(0), Z13 = () => Array(13).fill(0);
  const pl = {rev:Z(), cogs:Z(), dep:Z(), othinc:Z(), fin:Z(), tax:Z(), cat:{}, cats:[]};
  const bsr = {}; Object.keys(CLASSES.BS).forEach(k=>bsr[k]=Z13());
  const cfr = {}; Object.keys(CLASSES.CF).forEach(k=>cfr[k]=Z());
  const by = {PL:{}, BS:{}, CF:{}};
  let openGiven=false, cfRows=0, cfOpen=false, cfClose=false;
  const plKey = {REV:'rev',COGS:'cogs',DEP:'dep',OTHINC:'othinc',FIN:'fin',TAX:'tax'};
  rows.forEach(r=>{
    if(!CLASSES[r.st] || !CLASSES[r.st][r.cls]) return;
    (by[r.st][r.cls] = by[r.st][r.cls] || []).push(r);
    if(r.st==='PL'){
      let t;
      if(r.cls==='OPEX'){ const c = r.cat || 'Other expenses'; r.cat=c; if(!pl.cat[c]){ pl.cat[c]=Z(); pl.cats.push(c); } t=pl.cat[c]; }
      else t = pl[plKey[r.cls]];
      for(let k=0;k<12;k++) t[k]+=val(r,k);
    } else if(r.st==='BS'){

  let accdepFlipped=false;

/* ===================== PERIOD SNAPSHOT ===================== */
function snap(M, ms){
  if(!ms || !ms.length) return null;
  const f = ms[0], l = ms[ms.length-1], p = M.pl, b = M.b, c = M.c;
  const S_ = a => ms.reduce((s,i)=>s+a[i],0);
  const o = {ms, n:ms.length, days:ms.reduce((s,i)=>s+M.days[i],0)};
  o.__M = M;   // the model this snapshot was taken from, so cross-year bases resolve correctly
  ['rev','cogs','gp','opex','ebitda','dep','ebit','othinc','fin','pbt','tax','np'].forEach(k=>o[k]=S_(p[k]));
  o.cat = {}; p.cats.forEach(k=>o.cat[k]=S_(p.cat[k]));
  CFK.forEach(k=>o['cf_'+k]=S_(c[k]));
  o.cashOpen = c.open[f]; o.cashClose = c.close[l];
  o.bs = {};
  BSK.forEach(k=>{ const a=b[k]; let s=0; for(let i=f;i<=l+1;i++) s+=a[i]; o.bs[k]={o:a[f], c:a[l+1], a:s/(l-f+2)}; });
  const C_ = k => o.bs[k].c, AV = k => o.bs[k].a;
  o.gm=dv(o.gp,o.rev); o.ebitdam=dv(o.ebitda,o.rev); o.opm=dv(o.ebit,o.rev); o.npm=dv(o.np,o.rev); o.opexpct=dv(o.opex,o.rev);
  o.cr = C_('tcl')>0 ? dv(C_('tca'),C_('tcl')) : null;
  o.qr = C_('tcl')>0 ? dv(C_('tca')-C_('inv'),C_('tcl')) : null;
  o.crO = o.bs.tcl.o>0 ? dv(o.bs.tca.o,o.bs.tcl.o) : null;
  o.de = C_('te')>0 ? dv(C_('debt'),C_('te')) : null;
  o.da = dv(C_('debt'),C_('ta'));
  const af = 365/o.days;
  o.dso = o.rev>0 ? AV('ar')/o.rev*o.days : null;
  o.dio = (M.flags.hasInv && o.cogs>0) ? AV('inv')/o.cogs*o.days : null;
  o.dpo = o.cogs>0 ? AV('ap')/o.cogs*o.days : null;
  o.ccc = (o.dso!=null && o.dpo!=null) ? o.dso + (o.dio||0) - o.dpo : (o.dso!=null && !M.flags.hasCogs ? o.dso : null);
  o.at = dv(o.rev*af, AV('ta')); o.roa = dv(o.np*af, AV('ta')); o.roe = AV('te')>0 ? dv(o.np*af, AV('te')) : null;
  o.annualised = o.n < 12;
  o.ccr = o.np>0 ? o.cf_cfo/o.np : null;
  o.wcpct = o.rev>0 ? dv(C_('twc'), o.rev*af) : null;
  o.owcCash = o.cf_ar + o.cf_inv + o.cf_oca + o.cf_ap + o.cf_ocl;
  return o;
}

/* ===================== PERIODS & COMPARISON ===================== */
function selMonths(f, N){
  const m = Math.min(f.month, N-1);
  switch(f.period){
    case 'M': return [m];
    case 'Q': { const a=f.quarter*3; return R(a, Math.min(a+2,N-1)).filter(i=>i<N); }
    case 'YTD': return R(0,m);
    default: return R(0,N-1);
  }
}
function isQuarter(ms){ return ms.length===3 && ms[0]%3===0 && ms[2]===ms[0]+2; }
function pLabel(ms, full){
  const M=S.M, L=M.L; if(!ms||!ms.length) return '—';
  const a=ms[0], z=ms[ms.length-1];
  if(ms.length===1) return L[a]+(full?' '+M.yrs[a]:'');
  if(a===0 && z===11) return 'FY '+S.cfg.fy;
  if(isQuarter(ms)) return 'Q'+(a/3+1);
  if(a===0 && z===5) return 'H1'; if(a===6 && z===11) return 'H2';
  if(a===0) return 'YTD '+L[z];
  return L[a]+'–'+L[z];
}
let MODEL_CACHE = {};
function yearModel(fy){
  const d = DATASETS[String(fy)]; if(!d) return null;
  if(MODEL_CACHE[fy]) return MODEL_CACHE[fy];
  const cfg = Object.assign({}, S.cfg, {fy:+fy, startMonth:+d.startMonth||0, currency:d.currency||S.cfg.currency});
  return (MODEL_CACHE[fy] = buildModel(d, cfg));
}
function rangeLabel(M2, ms, yr){
  const L2 = M2.L, a = ms[0], z = ms[ms.length-1];
  if(ms.length===1) return L2[a]+' '+yr;
  if(a===0 && z===11) return 'FY '+yr;
  if(ms.length===3 && a%3===0 && z===a+2) return 'Q'+(a/3+1)+' '+yr;
  if(a===0 && z===5) return 'H1 '+yr;
  if(a===6 && z===11) return 'H2 '+yr;
  return L2[a]+'–'+L2[z]+' '+yr;
}
function cmpSpec(f, N){
  const L = S.M.L, P = selMonths(f,N), n = P.length, a = P[0], z = P[P.length-1];
  let B=null, BM=null, name='', short='', why='', avg=false;
  const PY = S.cfg.fy - 1, pm = yearModel(PY);
  const same = (x,y) => x && y && x.length===y.length && x.every((v,i)=>v===y[i]);
  switch(f.cmp){
    case 'prev':
      if(f.period==='M'){
        if(a>0){ B=[a-1]; name='previous month ('+L[a-1]+')'; short=L[a-1]; }
        else if(pm && pm.N>=12){ B=[11]; BM=pm; name='previous month (Dec '+PY+')'; short='Dec '+PY; }
        else why='The first month has no previous month, and '+PY+' is not loaded.';
      }
      else if(f.period==='Q'){
        if(a>=3){ B=R(a-3,a-1); name='previous quarter (Q'+(a/3)+')'; short='Q'+(a/3); }
        else if(pm && pm.N>=12){ B=[9,10,11]; BM=pm; name='previous quarter (Q4 '+PY+')'; short='Q4 '+PY; }
        else why='Q1 has no previous quarter, and '+PY+' is not loaded.';
      }
      else if(pm && z<pm.N){ B=P.slice(); BM=pm; name='the same period in '+PY+' ('+rangeLabel(pm,P,PY)+')'; short=rangeLabel(pm,P,PY); }
      else why = pm ? PY+' does not cover '+rangeLabel(S.M,P,S.cfg.fy)+', so there is no like-for-like previous period.'
                    : 'No prior-year data is loaded, so this period has no previous period.';
      break;
    case 'yoy':
      if(!pm) why='No prior-year data is loaded, so there is no same period last year.';
      else if(z>=pm.N) why=PY+' does not cover the same months, so there is no like-for-like comparison.';
      else { B=P.slice(); BM=pm; name=rangeLabel(pm,P,PY); short=rangeLabel(pm,P,PY); }
      break;
    case 'ytdavg': B=R(0,z); avg=true; name='YTD monthly average ('+L[0]+'–'+L[z]+')'; short='YTD avg'; break;
    case 'mavg': B=R(0,N-1); avg=true; name='full-year monthly average'; short='FY avg'; break;
    case 'first':
      if(f.period==='M'){ B=[0]; name='first month ('+L[0]+')'; short=L[0]; }
      else if(f.period==='Q'){ B=[0,1,2]; name='Q1'; short='Q1'; }
      else why='Choose Monthly or Quarterly to compare with the first period.';
      break;
    case 'q1': B=[0,1,2]; name='Q1'; short='Q1'; break;
    case 'h1': B=R(0,5); name='H1'; short='H1'; break;
  }
  if(B && B.some(i=>i>=(BM?BM.N:N))){ B=null; BM=null; why='The comparison period has no data yet.'; }
  if(B && !BM && same(B,P)){ B=null; why='The comparison period is the same as the selected period.'; }
  if(!B && !why) why='Comparison not available.';
  const scaled = !!B && B.length!==n;
  if(scaled && !avg){ name += ' (per-month basis)'; }
  return {P, B, BM, avg: !!B && (avg || scaled), scaled, factor: B ? n/B.length : null, name, short, why};
}

/* ===================== FORMATTING ===================== */
function fmt(v, o){
  o = o||{};
  if(v==null || !isFinite(v)) return '—';
  const sc = o.scale || S.f.scale; let d=v, suf='';
  if(sc==='K'){ d=v/1e3; suf='K'; } else if(sc==='M'){ d=v/1e6; suf='M'; }
  const ad = Math.abs(d);
  const dec = o.dec!=null ? o.dec : o.table ? (sc==='M'?2:0) : (sc==='M' ? (ad<10?2:1) : sc==='K' ? (ad<100?1:0) : 0);
  const s = ad.toLocaleString('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec});
  const sign = (v<0 && s.replace(/[0.,]/g,'')!=='') ? '−' : (o.plus && v>0 && s.replace(/[0.,]/g,'')!=='' ? '+' : '');
  return sign + (o.cur===false ? '' : S.cfg.currency+' ') + s + (o.table ? '' : suf);
}
const fmtN = (v,o) => fmt(v, Object.assign({cur:false, table:true}, o||{}));
function pct(v, dec, plus){ if(v==null||!isFinite(v)) return '—'; const x=v*100; dec = dec==null?1:dec; return (x<0?'−':(plus&&x>0?'+':''))+Math.abs(x).toFixed(dec)+'%'; }
function pp(v, dec){ if(v==null||!isFinite(v)) return '—'; const x=v*100; dec=dec==null?1:dec; return (x<-0.05?'−':(x>0.05?'+':''))+Math.abs(x).toFixed(dec)+' pp'; }
function xx(v){ return (v==null||!isFinite(v)) ? '—' : v.toFixed(2)+'x'; }
function dd(v){ return (v==null||!isFinite(v)) ? '—' : Math.round(v)+' days'; }
function scaleWord(){ return S.cfg.currency + (S.f.scale==='K'?' thousands':S.f.scale==='M'?' millions':''); }
function arrow(d){ return d>0 ? '▲' : d<0 ? '▼' : '■'; }
function joinAnd(a){ a=a.filter(Boolean); if(a.length<2) return a.join(''); return a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }

function niceScale(mn, mx, count){
  count = count || 5;

  if(mn === mx){ if(mn === 0) mx = 1; else { const p = Math.abs(mn)*0.1; mn -= p; mx += p; } }

  return {lo, hi: hi===lo ? lo+step : hi, ticks, step};

    const qs=q=>sum(R(q*3,q*3+2).map(i=>a[i]));
    return {c,a,q1,l3,g,pr1,pr3,dpp:(pr1!=null&&pr3!=null)?pr3-pr1:null,mult,material,faster,
      period:C.sP.cat[c], ytd:C.sYTD.cat[c], fy:C.sFY.cat[c], avg:C.sFY.cat[c]/C.N,
      pctRev:dv(C.sP.cat[c],C.sP.rev), share:dv(C.sP.cat[c],C.sP.opex),
      mom:(A>0&&a[A-1]>0)?a[A]/a[A-1]-1:null, qoq:(lq>=1&&qs(lq-1)>0)?qs(lq)/qs(lq-1)-1:null};
  });
}

function computeDrivers(C){
  const M=C.M, p=M.pl, L=M.L, res={all:[],pos:[],neg:[],ctx:[],recon:null};
  const add=d=>{ if(d.v!=null&&isFinite(d.v)) res.all.push(d); };
  if(C.W&&C.sQ1&&C.sQ1.rev>0){
    const W=C.W, q=C.sQ1, wn=W.length, wname=L[W[0]]+'–'+L[W[wn-1]];
    const T=k=>sum(W.map(m=>p[k][m]));
    const revAvg=q.rev/3, em=q.ebitda/q.rev, gmQ=q.gp/q.rev, rW=T('rev'), basis=`P&L, ${wname} vs Q1 run-rate`;
    add({id:'rev',name:rW>=revAvg*wn?'Revenue growth':'Revenue decline',v:(rW-revAvg*wn)*em,kind:'pl',basis,go:'revenue',
      txt:`Revenue in ${wname} was ${fmt(rW-revAvg*wn,{plus:true})} against the Q1 monthly run-rate, valued at the Q1 EBITDA margin of ${pct(em)}.`});
    const gmW=dv(T('gp'),rW), gmv=T('gp')-gmQ*rW;
    add({id:'gm',name:gmv>=0?'Gross margin improvement':'Gross margin compression',v:gmv,kind:'pl',basis,go:'profit',pp:gmW-gmQ,
      txt:`Gross margin averaged ${pct(gmW)} in ${wname} versus ${pct(gmQ)} in Q1 (${pp(gmW-gmQ)}).`});
    p.cats.forEach(c=>{ const r=q.cat[c]/q.rev, cW=sum(W.map(m=>p.cat[c][m])), v=-(cW-r*rW);
      add({id:'cat',cat:c,name:v<0?`${c} increase`:`${c} efficiency`,v,kind:'pl',basis,go:'expense',
        txt:`${c} was ${pct(dv(cW,rW))} of revenue in ${wname} versus ${pct(r)} in Q1 (${pp(dv(cW,rW)-r)}).`}); });
    const vs=(k,sg)=>sg*(T(k)-q[k]/3*wn);
    const dep=vs('dep',-1), oi=vs('othinc',1), fin=vs('fin',-1), tax=vs('tax',-1);
    add({id:'dep',name:dep<0?'Higher depreciation':'Lower depreciation',v:dep,kind:'pl',basis,go:'profit',txt:`Depreciation averaged ${fmt(T('dep')/wn)} a month versus ${fmt(q.dep/3)} in Q1.`});
    add({id:'oth',name:oi<0?'Lower other income':'Higher other income',v:oi,kind:'pl',basis,go:'profit',txt:`Other income averaged ${fmt(T('othinc')/wn)} a month versus ${fmt(q.othinc/3)} in Q1.`});
    add({id:'fin',name:fin<0?'Higher finance costs':'Lower finance costs',v:fin,kind:'pl',basis,go:'profit',txt:`Finance costs averaged ${fmt(T('fin')/wn)} a month versus ${fmt(q.fin/3)} in Q1.`});
    add({id:'tax',name:tax<0?'Higher tax charge':'Lower tax charge',v:tax,kind:'pl',basis,go:'profit',txt:'Tax moves with profit; included so the P&L drivers reconcile.'});
    res.recon={wname,wn,actual:T('np'),base:q.np/3*wn,diff:T('np')-q.np/3*wn,sum:0};
  }
  const y=C.sYTD, cb=`Cash, ${C.ytdName}`, mv=k=>y.bs[k].c-y.bs[k].o;
  add({id:'ar',name:y.cf_ar<0?'Receivables increase':'Receivables collection',v:y.cf_ar,kind:'cash',basis:cb,go:'wc',txt:`Receivables moved from ${fmt(y.bs.ar.o)} to ${fmt(y.bs.ar.c)} (${fmt(mv('ar'),{plus:true})}).`});
  if(M.flags.hasInv) add({id:'inv',name:y.cf_inv<0?'Inventory increase':'Inventory reduction',v:y.cf_inv,kind:'cash',basis:cb,go:'wc',txt:`Inventory moved from ${fmt(y.bs.inv.o)} to ${fmt(y.bs.inv.c)} (${fmt(mv('inv'),{plus:true})}).`});
  add({id:'ap',name:y.cf_ap>=0?'Payables support':'Payables reduction',v:y.cf_ap,kind:'cash',basis:cb,go:'wc',txt:y.cf_ap>=0?`Supplier balances rose ${fmt(mv('ap'))}, funding part of working capital. Check this reflects agreed terms rather than payment pressure.`:`Supplier balances fell ${fmt(-mv('ap'))}, using cash.`});
  const ow=y.cf_oca+y.cf_ocl+y.cf_othop;
  add({id:'owc',name:ow>=0?'Other working capital release':'Other working capital absorption',v:ow,kind:'cash',basis:cb,go:'cash',txt:`Prepayments, accruals, VAT/tax payables and similar items ${ow>=0?'released':'absorbed'} ${fmt(Math.abs(ow))}.`});
  if(y.np>0){ const ccr=y.cf_cfo/y.np, cl=classify('ccr',ccr);
    if(cl&&cl.i<=1) add({id:'ocf',name:'Strong operating cash flow',v:y.cf_cfo,kind:'cash',basis:cb,go:'cash',txt:`Operating cash flow of ${fmt(y.cf_cfo)} was ${pct(ccr,0)} of net profit.`});
    else if(cl) add({id:'ocf',name:'Weak cash conversion',v:y.cf_cfo-y.np,kind:'cash',basis:cb,go:'cash',overlap:true,txt:`Only ${pct(ccr,0)} of net profit (${fmt(y.np)}) became operating cash (${fmt(y.cf_cfo)}): the net result of the working-capital drivers.`});
  } else if(y.cf_cfo<0) add({id:'ocf',name:'Operating cash outflow',v:y.cf_cfo,kind:'cash',basis:cb,go:'cash',txt:`Loss-making with an operating cash outflow of ${fmt(y.cf_cfo)}.`});
  const dc=mv('cash');
  add({id:'cash',name:dc<0?'Cash decline':'Cash build',v:dc,kind:'cash',basis:cb,go:'cash',overlap:true,txt:`Cash moved from ${fmt(y.bs.cash.o)} to ${fmt(y.bs.cash.c)}.`});
  if(y.crO!=null&&y.cr!=null&&Math.abs(y.cr-y.crO)>=0.05){ const v=(y.cr-y.crO)*y.bs.tcl.c;
    add({id:'liq',name:v<0?'Liquidity deterioration':'Liquidity improvement',v,kind:'cash',basis:cb,go:'bs',est:true,txt:`Current ratio ${xx(y.crO)} → ${xx(y.cr)}; impact estimated as the ratio change × closing current liabilities.`}); }
  const ddt=mv('debt');
  if(ddt>0){ if(y.cf_fcf<0) add({id:'debt',name:'Debt funded a cash shortfall',v:-Math.min(ddt,-y.cf_fcf),kind:'cash',basis:cb,go:'bs',txt:`Total debt rose ${fmt(ddt)} while free cash flow was ${fmt(y.cf_fcf)}.`});
    else res.ctx.push({id:'debt',name:'Debt increase',v:ddt,basis:cb,go:'bs',txt:`Total debt rose ${fmt(ddt)}; free cash flow was positive (${fmt(y.cf_fcf)}), so it did not fund an operating shortfall.`}); }
  else if(ddt<0) add({id:'debt',name:'Debt reduction',v:-ddt,kind:'cash',basis:cb,go:'bs',txt:`Total debt fell ${fmt(-ddt)}.`});
  if(y.cf_capex<0) res.ctx.push({id:'capex',name:'Capital investment',v:y.cf_capex,basis:cb,go:'cash',txt:`Capital expenditure of ${fmt(-y.cf_capex)} in ${C.ytdName}.`});
  if(y.cf_din>0) res.ctx.push({id:'din',name:'New borrowing',v:y.cf_din,basis:cb,go:'cash',txt:`${fmt(y.cf_din)} raised; ${fmt(-y.cf_dout)} repaid.`});
  if(y.cf_div<0) res.ctx.push({id:'div',name:'Owner drawings / dividends',v:y.cf_div,basis:cb,go:'cash',txt:`${fmt(-y.cf_div)} paid to owners${y.np>0?` (${pct(-y.cf_div/y.np,0)} of net profit)`:''}.`});
  if(y.cf_contrib>0) res.ctx.push({id:'contrib',name:'Owner contributions',v:y.cf_contrib,basis:cb,go:'cash',txt:`Owners contributed ${fmt(y.cf_contrib)}.`});
  if(res.recon) res.recon.sum=sum(res.all.filter(d=>d.kind==='pl').map(d=>d.v));
  const floor=Math.abs(C.sYTD.rev)*0.002;
  const rank=res.all.filter(d=>d.id!=='tax');
  res.pos=rank.filter(d=>d.v>floor).sort((a,b)=>b.v-a.v);
  res.neg=rank.filter(d=>d.v<-floor).sort((a,b)=>a.v-b.v);
  res.tax=res.all.find(d=>d.id==='tax')||null;
  return res;
}

function computeInsights(C,X){
  const M=C.M, p=M.pl, A=C.A, L=M.L, out=[], y=C.sYTD, mp=S.cfg.par.marginPP/100;
  const add=(theme,tone,text,go)=>out.push({theme,tone,text,go});
  const up=streak(p.rev,A,1), dn=streak(p.rev,A,-1);
  if(up>=3) add('Growth','pos',`Revenue increased for ${up} consecutive months (${L[A-up+1]}–${L[A]}).`,'revenue');
  if(dn>=2) add('Growth','neg',`Revenue decreased for ${dn} consecutive months (${L[A-dn+1]}–${L[A]}).`,'revenue');
  if(C.gL3!=null) add('Growth',C.gL3>0.02?'pos':C.gL3<-0.02?'neg':'neu',`${C.L3name} revenue was ${pct(Math.abs(C.gL3))} ${C.gL3>=0?'higher':'lower'} than Q1 (${fmt(C.sL3.rev)} vs ${fmt(C.sQ1.rev)}).`,'revenue');
  if(A===11){ const h1=snap(M,R(0,5)), h2=snap(M,R(6,11)), g=h2.rev/h1.rev-1; add('Growth',g>0.02?'pos':g<-0.02?'neg':'neu',`Second-half revenue was ${pct(Math.abs(g))} ${g>=0?'higher':'lower'} than the first half (${fmt(h2.rev)} vs ${fmt(h1.rev)}).`,'revenue'); }
  const hi=argmax(C.YTD,i=>p.rev[i]), lo=argmin(C.YTD,i=>p.rev[i]);
  if(hi!=null&&lo!=null&&hi!==lo){ const avg=y.rev/C.YTD.length; add('Growth','neu',`Revenue peaked in ${L[hi]} (${fmt(p.rev[hi])}) and was lowest in ${L[lo]} (${fmt(p.rev[lo])}); the gap equals ${pct((p.rev[hi]-p.rev[lo])/avg,0)} of an average month.`,'revenue'); }
  if(p.revAcct.length>1&&C.sL3){ let best=null; p.revAcct.forEach(a=>{ const s1=sum([0,1,2].map(i=>a.v[i]))/C.sQ1.rev, s3=sum(C.L3.map(i=>a.v[i]))/C.sL3.rev, d=s3-s1; if(!best||Math.abs(d)>Math.abs(best.d)) best={a,s1,s3,d}; });
    if(best&&Math.abs(best.d)>=0.03) add('Growth','neu',`${best.a.name} ${best.d>0?'rose':'fell'} from ${pct(best.s1,0)} to ${pct(best.s3,0)} of revenue between Q1 and ${C.L3name} (mix shift; margin by stream needs COGS split by stream).`,'revenue'); }
  if(C.sL3&&C.sQ1){
    [['gm','Gross margin'],['ebitdam','EBITDA margin'],['npm','Net margin']].forEach(([k,nm])=>{ const a=C.sQ1[k], b=C.sL3[k]; if(a==null||b==null) return; const d=b-a;
      if(Math.abs(d)<mp){ if(k==='gm') add('Profitability','neu',`${nm} was broadly stable (${pct(a)} in Q1, ${pct(b)} in ${C.L3name}).`,'profit'); return; }
      add('Profitability',d>0?'pos':'neg',`${nm} ${d>0?'improved':'declined'} from ${pct(a)} in Q1 to ${pct(b)} in ${C.L3name} (${pp(d)}).`,'profit'); });
    const dg=C.sL3.gm-C.sQ1.gm; if(C.gL3>0&&dg<=-mp) add('Profitability','neg',`Margin compression: revenue grew ${pct(C.gL3)} between Q1 and ${C.L3name}, but gross margin fell by ${pp(-dg).replace('+','')}.`,'profit');
  }
  const loss=C.YTD.filter(i=>p.np[i]<0);
  if(loss.length) add('Profitability','neg',`Net loss in ${loss.length} month${loss.length>1?'s':''}: ${loss.map(i=>L[i]+' ('+fmt(p.np[i])+')').join(', ')}.`,'profit');
  const ns=npmStreak(C); if(ns>=2) add('Profitability','neg',`Net margin declined for ${ns} consecutive months to ${L[A]}.`,'profit');
  if(C.sL3&&C.sQ1&&C.sQ1.opex>0){
    const og=C.sL3.opex/C.sQ1.opex-1;
    add('Costs',og>C.gL3+0.005?'neg':'pos',`Operating expenses grew ${pct(og)} between Q1 and ${C.L3name}, against revenue growth of ${pct(C.gL3)}.`,'expense');
    const fast=X.exp.filter(e=>e.faster).sort((a,b)=>(b.mult||99)-(a.mult||99));
    fast.slice(0,3).forEach(e=>add('Costs','neg', e.mult!=null ? `${e.c} grew ${e.mult.toFixed(1)}x faster than revenue (${pct(e.g,0,true)} vs ${pct(C.gL3,0,true)}, Q1 to ${C.L3name}).` : `${e.c} increased ${pct(e.g,0)} while revenue ${C.gL3<0?'declined':'was flat'}.`,'expense'));
    if(fast.length>=2) add('Costs','neg',`${WORDS[fast.length]||fast.length} expense categories grew materially faster than revenue: ${joinAnd(fast.map(e=>e.c))}.`,'expense');
    X.exp.filter(e=>e.dpp!=null&&Math.abs(e.dpp)>=0.01).sort((a,b)=>Math.abs(b.dpp)-Math.abs(a.dpp)).slice(0,2)
      .forEach(e=>add('Costs',e.dpp>0?'neg':'pos',`${e.c} represented ${pct(e.pr3)} of revenue in ${C.L3name} compared with ${pct(e.pr1)} in Q1.`,'expense'));
    const eff=X.exp.filter(e=>e.dpp!=null&&e.dpp<=-0.003&&e.material).sort((a,b)=>a.dpp-b.dpp);
    if(eff.length) add('Costs','pos',`Falling as a share of revenue: ${joinAnd(eff.slice(0,3).map(e=>`${e.c} (${pct(e.pr1)} → ${pct(e.pr3)})`))}.`,'expense');
  }
  if(y.np>0){ const ccr=y.cf_cfo/y.np, w=worstWC(y);
    add('Cash',ccr>=0.9?'pos':ccr>=0.6?'wat':'neg',`Net profit of ${fmt(y.np)} converted into ${fmt(y.cf_cfo)} of operating cash flow in ${C.ytdName} (${pct(ccr,0)} cash conversion)${ccr<0.9&&w?`; ${w.name} absorbed ${fmt(-w.v)}`:''}.`,'cash'); }
  const pcm=C.YTD.filter(i=>p.np[i]>0&&M.c.cfo[i]<0);
  if(pcm.length) add('Cash','neg',`Profitable but operating cash flow was negative in ${pcm.length} month${pcm.length>1?'s':''}: ${pcm.map(i=>L[i]).join(', ')}.`,'cash');
  const dc=y.bs.cash.c-y.bs.cash.o;
  if(dc<0&&y.np>0) add('Cash','neg',`Cash decreased by ${fmt(-dc)} (${pct(dc/Math.abs(y.bs.cash.o||1),0)}) despite net profit of ${fmt(y.np)}.`,'cash');
  else if(dc>0) add('Cash','pos',`Cash increased by ${fmt(dc)} to ${fmt(y.bs.cash.c)}.`,'cash');
  if(y.cf_fcf<0) add('Cash','neg',`Free cash flow was ${fmt(y.cf_fcf)}: operating cash flow of ${fmt(y.cf_cfo)} did not cover capital expenditure of ${fmt(-y.cf_capex)}.`,'cash');
  if(y.cf_div<0&&y.np>0) add('Cash',-y.cf_div>y.cf_fcf?'wat':'neu',`Owner drawings/dividends of ${fmt(-y.cf_div)} equalled ${pct(-y.cf_div/y.np,0)} of net profit${y.cf_fcf<-y.cf_div?` and exceeded free cash flow (${fmt(y.cf_fcf)})`:''}.`,'cash');
  const dar=y.bs.ar.c-y.bs.ar.o;
  if(Math.abs(dar)>0.005*Math.abs(y.bs.ta.c)){ let t=`Accounts receivable ${dar>0?'increased':'decreased'} by ${fmt(Math.abs(dar))}${y.bs.ar.o>0?` (${pct(dar/y.bs.ar.o,0,true)})`:''} during ${C.ytdName}`;
    if(C.sQ1&&C.sL3&&C.sQ1.dso!=null&&C.sL3.dso!=null) t+=`; DSO moved from ${Math.round(C.sQ1.dso)} days in Q1 to ${Math.round(C.sL3.dso)} in ${C.L3name}`; add('Balance sheet',dar>0?'neg':'pos',t+'.','wc'); }
  const di=y.bs.inv.c-y.bs.inv.o;
  if(M.flags.hasInv&&Math.abs(di)>0.005*Math.abs(y.bs.ta.c)){ let t=`Inventory ${di>0?'increased':'decreased'} by ${fmt(Math.abs(di))}${y.bs.inv.o>0?` (${pct(di/y.bs.inv.o,0,true)})`:''}`;
    if(C.sQ1&&C.sL3&&C.sQ1.dio!=null&&C.sL3.dio!=null) t+=`; inventory days moved from ${Math.round(C.sQ1.dio)} to ${Math.round(C.sL3.dio)}`; add('Balance sheet',di>0?'neg':'pos',t+'.','wc'); }
  const dap=y.bs.ap.c-y.bs.ap.o;
  if(Math.abs(dap)>0.005*Math.abs(y.bs.ta.c)) add('Balance sheet','neu',`Accounts payable ${dap>0?'rose':'fell'} by ${fmt(Math.abs(dap))}${dap>0?', providing short-term supplier funding':''}.`,'wc');
  if(y.crO!=null&&y.cr!=null&&Math.abs(y.cr-y.crO)>=0.05) add('Balance sheet',y.cr<y.crO?'neg':'pos',`Current ratio ${y.cr<y.crO?'declined':'improved'} from ${xx(y.crO)} to ${xx(y.cr)}.`,'bs');
  const ddt=y.bs.debt.c-y.bs.debt.o;
  if(Math.abs(ddt)>0.005*Math.abs(y.bs.ta.c)) add('Balance sheet',ddt>0&&y.cf_fcf<0?'wat':'neu',`Total debt ${ddt>0?'increased':'decreased'} by ${fmt(Math.abs(ddt))}${y.bs.debt.o>0?` (${pct(ddt/y.bs.debt.o,0,true)})`:''}: ${fmt(y.cf_din)} raised and ${fmt(-y.cf_dout)} repaid.`,'bs');
  return out;
}

function computeAlerts(C,X){
  const M=C.M, s=C.sP, y=C.sYTD, L=M.L, A=C.A, out=[], per=pLabel(C.P);
  const on=id=>{ const r=rule(id); return r&&r.on?r:null; };
  const add=(r,text,value,go)=>out.push({id:r.id,pri:r.pri,name:r.name,text,value,go});
  let r;
  if((r=on('gm_low'))&&s.gm!=null&&s.gm*100<r.thr) add(r,`Gross margin of ${pct(s.gm)} in ${per} is below the ${r.thr}% threshold.`,pct(s.gm),'profit');
  if((r=on('npm_low'))&&s.npm!=null&&s.npm*100<r.thr) add(r,`Net margin of ${pct(s.npm)} in ${per} is below the ${r.thr}% threshold.`,pct(s.npm),'profit');
  if((r=on('exp_vs_rev'))&&C.gL3!=null){ const f=X.exp.filter(e=>e.material&&e.g!=null&&(e.g-C.gL3)*100>=r.thr);
    if(f.length) add(r,`${joinAnd(f.map(e=>`${e.c} (${pct(e.g,0,true)})`))} grew more than ${r.thr} pp faster than revenue (${pct(C.gL3,0,true)}), Q1 to ${C.L3name}.`,f.length+' categor'+(f.length>1?'ies':'y'),'expense'); }
  if((r=on('ocf_neg'))&&s.cf_cfo<0) add(r,`Operating cash flow was ${fmt(s.cf_cfo)} in ${per}.`,fmt(s.cf_cfo),'cash');
  if((r=on('fcf_neg'))&&s.cf_fcf<0) add(r,`Free cash flow was ${fmt(s.cf_fcf)} in ${per}.`,fmt(s.cf_fcf),'cash');
  if((r=on('cash_decl'))){ const k=streak(M.b.cash.slice(0,A+2),A+1,-1); if(k>=r.thr) add(r,`Cash fell for ${k} consecutive months (${L[A-k+1]}–${L[A]}), from ${fmt(M.b.cash[A+1-k])} to ${fmt(M.b.cash[A+1])}.`,k+' months','cash'); }
  if((r=on('ar_vs_rev'))&&C.sL3&&C.sQ1){ const a0=M.b.ar[3], a1=M.b.ar[A+1]; if(a0>0){ const ga=a1/a0-1; if((ga-C.gL3)*100>=r.thr) add(r,`Receivables grew ${pct(ga,0)} from end-${L[2]} to end-${L[A]}, against revenue growth of ${pct(C.gL3,0)} (Q1 to ${C.L3name}).`,pp(ga-C.gL3),'wc'); } }
  if((r=on('cr_low'))&&s.cr!=null&&s.cr<r.thr) add(r,`Current ratio of ${xx(s.cr)} at end-${L[A]} is below ${r.thr}x.`,xx(s.cr),'bs');
  if((r=on('debt_up'))){ const d0=M.b.debt[0], d1=M.b.debt[A+1]; if(d0>0&&(d1/d0-1)*100>r.thr) add(r,`Total debt rose ${pct(d1/d0-1,0)} since the opening balance sheet (${fmt(d0)} → ${fmt(d1)}).`,pct(d1/d0-1,0),'bs'); else if(d0<=0&&d1>0) add(r,`New borrowing of ${fmt(d1)} since the opening balance sheet.`,fmt(d1),'bs'); }
  if((r=on('wc_cash'))&&y.rev>0&&y.owcCash<0&&(-y.owcCash/y.rev)*100>=r.thr) add(r,`Working capital absorbed ${fmt(-y.owcCash)} of cash in ${C.ytdName} (${pct(-y.owcCash/y.rev)} of revenue).`,pct(-y.owcCash/y.rev),'wc');
  if((r=on('profit_cash'))){ const pcm=C.YTD.filter(i=>M.pl.np[i]>0&&M.c.cfo[i]<0);
    if(s.np>0&&s.cf_cfo<0) add(r,`Profitable in ${per} (${fmt(s.np)}) but operating cash flow was ${fmt(s.cf_cfo)}.`,fmt(s.cf_cfo),'cash');
    else if(pcm.length>=2) add(r,`Profitable but cash-negative in ${pcm.length} months: ${pcm.map(i=>L[i]).join(', ')}.`,pcm.length+' months','cash'); }
  if((r=on('npm_streak'))){ const k=npmStreak(C); if(k>=r.thr) add(r,`Net margin declined for ${k} consecutive months to ${L[A]}.`,k+' months','profit'); }
  const ord={High:0,Medium:1,Monitor:2}; out.sort((a,b)=>ord[a.pri]-ord[b.pri]);
  return out;
}

function computeScore(C){
  const s=C.sP, M=C.M, out=[], per=pLabel(C.P), L=M.L;
  const mk=(dim,id,v,disp,basis,note)=>out.push({dim,id,v,disp,basis,note,cls:classify(id,v)});
  if(C.gL3!=null) mk('Growth','growth',C.gL3,pct(C.gL3,1,true),`Revenue, ${C.L3name} vs Q1`); else out.push({dim:'Growth',id:'growth',disp:'—',basis:'Needs at least six months of data',cls:null});
  mk('Profitability','npm',s.npm,pct(s.npm),`Net margin, ${per}`,`Gross margin ${pct(s.gm)}`);
  if(s.np>0) mk('Cash generation','ccr',s.cf_cfo/s.np,pct(s.cf_cfo/s.np,0),`Operating cash flow ÷ net profit, ${per}`,`OCF ${fmt(s.cf_cfo)}`);
  else out.push({dim:'Cash generation',id:'ccr',disp:fmt(s.cf_cfo),basis:'Loss-making period: conversion ratio not meaningful',cls:s.cf_cfo>=0?{i:2,label:'Watch'}:{i:3,label:'Weak'}});
  mk('Liquidity','cr',s.cr,xx(s.cr),`Current ratio at end-${L[C.A]}`,`Quick ratio ${xx(s.qr)}`);
  if(M.flags.hasInv||M.flags.hasCogs) mk('Working capital','ccc',s.ccc,dd(s.ccc),`Cash conversion cycle, ${per}`,`DSO ${dd(s.dso)}`);
  else mk('Working capital','dso',s.dso,dd(s.dso),`DSO, ${per}`);
  if(s.bs.debt.c<=0) out.push({dim:'Leverage',id:'de',disp:'No debt',basis:'Debt-free at period end',cls:{i:0,label:'Strong'}});
  else if(s.bs.te.c<=0) out.push({dim:'Leverage',id:'de',disp:'n/m',basis:'Equity is negative',cls:{i:3,label:'Weak'}});
  else mk('Leverage','de',s.de,xx(s.de),`Debt-to-equity at end-${L[C.A]}`,`Net debt ${fmt(s.bs.netdebt.c)}`);
  if(C.sL3&&C.sQ1&&C.sQ1.opex>0){ const gap=(C.sL3.opex/C.sQ1.opex-1)-C.gL3; mk('Cost efficiency','costgap',gap,pp(gap),`Opex growth minus revenue growth, Q1 → ${C.L3name}`); }
  else out.push({dim:'Cost efficiency',id:'costgap',disp:'—',basis:'Needs at least six months of data',cls:null});
  return out;
}

function conclusion(C,X){
  const M=C.M, L=M.L, A=C.A, y=C.sYTD, out=[];
  const ev=(t,go)=>`<a class="ev" data-go="${go}" tabindex="0">${t}</a>`;
  if(C.sL3&&C.sQ1){ const g=C.gL3, up=streak(M.pl.rev,A,1);
    if(g>0.05) out.push(`Revenue grew during the year: ${C.L3name} revenue was ${ev(pct(g,0)+' higher','revenue')} than Q1${up>=3?`, with ${ev(up+' consecutive months of growth','revenue')} to ${L[A]}`:''}.`);
    else if(g<-0.05) out.push(`Revenue weakened during the year: ${C.L3name} revenue was ${ev(pct(-g,0)+' lower','revenue')} than Q1.`);
    else out.push(`Revenue was broadly flat, with ${C.L3name} within ${ev(pct(Math.abs(g),0),'revenue')} of Q1.`);
  } else out.push(`Revenue for ${pLabel(C.YTD)} was ${ev(fmt(y.rev),'revenue')}. At least six months of data are needed to compare the latest quarter with Q1.`);
  const reason=(list,sg)=>{ const parts=[], cats=[]; list.slice(0,4).forEach(d=>{ if(d.id==='gm') parts.push(`gross margin ${sg<0?'compressed':'improved'} (${pp(d.pp)})`); else if(d.id==='cat') cats.push(d.cat.toLowerCase()); else if(d.id==='fin') parts.push(`finance costs ${sg<0?'rose':'fell'}`); else if(d.id==='dep') parts.push(`depreciation ${sg<0?'rose':'fell'}`); else if(d.id==='rev') parts.push(sg<0?'revenue fell':'revenue grew'); });
    if(cats.length) parts.push(`${joinAnd(cats)} ${sg<0?'grew faster than revenue':'fell as a share of revenue'}`); return parts.slice(0,3); };
  if(C.sL3&&C.sQ1&&C.sQ1.npm!=null&&C.sL3.npm!=null){ const d=C.sL3.npm-C.sQ1.npm;
    if(d<=-0.01){ const r=reason(X.drv.neg.filter(x=>x.kind==='pl'&&x.id!=='tax'),-1); out.push(`However, profitability weakened: net margin fell from ${ev(pct(C.sQ1.npm),'profit')} in Q1 to ${ev(pct(C.sL3.npm),'profit')} in ${C.L3name}${r.length?', mainly because '+joinAnd(r):''}.`); }
    else if(d>=0.01){ const r=reason(X.drv.pos.filter(x=>x.kind==='pl'&&x.id!=='tax'),1); out.push(`Profitability improved: net margin rose from ${ev(pct(C.sQ1.npm),'profit')} in Q1 to ${ev(pct(C.sL3.npm),'profit')} in ${C.L3name}${r.length?', helped because '+joinAnd(r):''}.`); }
    else out.push(`Net margin was broadly stable at ${ev(pct(C.sL3.npm),'profit')} in ${C.L3name} (Q1: ${pct(C.sQ1.npm)}).`);
  }
  if(y.np>0){ const ccr=y.cf_cfo/y.np, w=worstWC(y);
    if(ccr<0.7) out.push(`The business remained profitable, earning ${ev(fmt(y.np),'profit')} in ${C.ytdName}, but converted only ${ev(pct(ccr,0),'cash')} of it into operating cash flow${w?`, primarily because ${w.name} absorbed ${ev(fmt(-w.v),w.id==='owc'?'cash':'wc')}`:''}.`);
    else out.push(`Profit converted well into cash: operating cash flow of ${ev(fmt(y.cf_cfo),'cash')} was ${ev(pct(ccr,0),'cash')} of net profit in ${C.ytdName}.`);
  } else out.push(`The business made a net loss of ${ev(fmt(-y.np),'profit')} in ${C.ytdName}, with operating cash flow of ${ev(fmt(y.cf_cfo),'cash')}.`);
  const dc=y.bs.cash.c-y.bs.cash.o, ddt=y.bs.debt.c-y.bs.debt.o;
  let b=`Cash ${dc<0?'fell':'rose'} by ${ev(fmt(Math.abs(dc)),'cash')} to ${fmt(y.bs.cash.c)}`;
  if(Math.abs(ddt)>0.01*Math.abs(y.bs.ta.c)) b+=` and total debt ${ddt>0?'rose':'fell'} by ${ev(fmt(Math.abs(ddt)),'bs')}`;
  if(y.crO!=null&&y.cr!=null) b+=`; the current ratio moved from ${ev(xx(y.crO),'bs')} to ${ev(xx(y.cr),'bs')}`;
  out.push(b+'.');
  const acts=[], seen=new Set(), addA=(k,t)=>{ if(!seen.has(k)&&acts.length<3){ seen.add(k); acts.push(t); } };
  const w=worstWC(y);
  X.drv.neg.forEach(d=>{
    const dso0=C.sQ1&&C.sQ1.dso!=null?Math.round(C.sQ1.dso):null, dso1=C.sL3&&C.sL3.dso!=null?Math.round(C.sL3.dso):null;
    if(d.id==='ar'||(d.id==='ocf'&&w&&w.id==='ar')) addA('ar',`improving collections${dso0!=null&&dso1!=null&&dso1>dso0?` (DSO lengthened from ${dso0} to ${dso1} days)`:` (receivables up ${fmt(y.bs.ar.c-y.bs.ar.o)})`}`);
    else if(d.id==='inv'||(d.id==='ocf'&&w&&w.id==='inv')) addA('inv',`reducing the inventory build-up (stock up ${fmt(y.bs.inv.c-y.bs.inv.o)})`);
    else if(d.id==='gm') addA('gm','protecting gross margin');
    else if(d.id==='cat') addA('cat',`controlling ${joinAnd(X.drv.neg.filter(x=>x.id==='cat').slice(0,2).map(x=>x.cat.toLowerCase()))} growth`);
    else if(d.id==='liq') addA('liq','strengthening liquidity');
    else if(d.id==='debt') addA('debt','reducing reliance on borrowing');
    else if(d.id==='fin') addA('fin','managing finance costs');
    else if(d.id==='cash') addA('cash','rebuilding cash headroom');
  });
  if(acts.length) out.push(`Management should focus on ${joinAnd(acts)}.`);
  return out.join(' ');
}

function validate(M){
  const tol=S.cfg.par.valTol, N=M.N, b=M.b, c=M.c, p=M.pl, L=M.L, checks=[], dq=[];
  const mk=(id,name,desc,diffs,withOpen,sev)=>{ const bad=diffs.map(d=>d!=null&&Math.abs(d)>tol); const mx=Math.max(0,...diffs.filter(d=>d!=null).map(Math.abs)); checks.push({id,name,desc,diffs,withOpen:!!withOpen,status:bad.some(Boolean)?(sev||'fail'):'pass',max:mx,bad}); };
  const MM=R(0,N-1), d13=(a,k)=>a[k+1]-a[k];
  mk('bs','Balance sheet balances','Total assets − (total liabilities + total equity) = 0 at the opening date and every month-end',R(0,N).map(i=>b.ta[i]-b.tle[i]),true);
  mk('cfroll','Cash flow reconciles','Opening cash + net cash movement − closing cash = 0',MM.map(k=>c.open[k]+c.net[k]-c.close[k]));
  mk('cfbs','Closing cash agrees to balance sheet','Cash-flow closing cash − balance-sheet cash = 0',MM.map(k=>c.close[k]-b.cash[k+1]));
  mk('cfcont','Opening cash continuity','Opening cash − previous closing cash = 0 (first month compared with the opening balance sheet)',MM.map(k=>c.open[k]-(k===0?b.cash[0]:c.close[k-1])));
  if(!M.flags.cfDerived){
    mk('np','Net profit agrees: P&L vs cash flow','Cash-flow net profit − P&L net profit = 0',MM.map(k=>c.np[k]-p.np[k]));
    mk('dep','Depreciation agrees: P&L vs cash flow','Cash-flow depreciation add-back − P&L depreciation = 0',MM.map(k=>c.dep[k]-p.dep[k]));
    mk('ar','Receivables movement agrees','Cash-flow receivables line + increase in balance-sheet receivables = 0',MM.map(k=>c.ar[k]+d13(b.ar,k)));
    mk('inv','Inventory movement agrees','Cash-flow inventory line + increase in balance-sheet inventory = 0',MM.map(k=>c.inv[k]+d13(b.inv,k)));
    mk('ap','Payables movement agrees','Cash-flow payables line − increase in balance-sheet payables = 0',MM.map(k=>c.ap[k]-d13(b.ap,k)));
    mk('owc','Other working capital agrees','Cash-flow other current asset and liability lines − balance-sheet movements = 0',MM.map(k=>(c.oca[k]+c.ocl[k])-(-d13(b.oca,k)+d13(b.ocl,k))),false,'warn');
    mk('debt','Debt movement agrees','Change in total debt − (debt raised + debt repaid) = 0',MM.map(k=>d13(b.debt,k)-(c.din[k]+c.dout[k])));
  }
  mk('eq','Net profit flows into equity','Change in total equity − net profit − contributions − dividends/drawings − other financing = 0',MM.map(k=>d13(b.te,k)-p.np[k]-c.contrib[k]-c.div[k]-c.othfin[k]));
  if(b.cye.some(x=>x!==0)) mk('cye','Current-year earnings track profit','Change in current-year earnings − net profit = 0',MM.map(k=>d13(b.cye,k)-p.np[k]),false,'warn');
  mk('accdep','Accumulated depreciation movement','Increase in accumulated depreciation − P&L depreciation = 0 (differences can be legitimate disposals)',MM.map(k=>-d13(b.accdep,k)-p.dep[k]),false,'warn');
  const eg=(a,f)=>a.slice(0,3).map(f).join('; ');
  dq.push({name:'Months with data',status:N===12?'pass':'warn',txt:N===12?'All 12 months present.':`${N} of 12 months present; analysis uses the available months only.`});
  dq.push({name:'Missing values',status:M.q.missing.length?'fail':'pass',txt:M.q.missing.length?`${M.q.missing.length} blank cell(s), e.g. ${eg(M.q.missing,x=>x.r.acct+' '+L[x.k])}. Treated as zero.`:'No blank cells within the months with data.'});
  dq.push({name:'Invalid numeric values',status:M.q.invalid.length?'fail':'pass',txt:M.q.invalid.length?`${M.q.invalid.length} non-numeric value(s), e.g. ${eg(M.q.invalid,x=>x.r.acct+(x.k<0?' opening':' '+L[x.k]))}. Treated as zero.`:'All values are numeric.'});
  dq.push({name:'Duplicate accounts',status:M.q.dup.length?'fail':'pass',txt:M.q.dup.length?`Duplicated: ${M.q.dup.map(r=>STMT_NAME[r.st]+': '+r.acct).join('; ')}. Duplicates are added together and may double-count.`:'Each account appears once per statement.'});
  dq.push({name:'Duplicate periods',status:'pass',txt:'Periods are fixed columns P1–P12 mapped to financial-year months, so a period cannot appear twice.'});
  dq.push({name:'Unmapped accounts',status:M.q.unmapped.length?'fail':'pass',txt:M.q.unmapped.length?`${M.q.unmapped.length} account(s) with an unrecognised class are excluded: ${eg(M.q.unmapped,r=>r.acct)}.`:'Every account is mapped to a standard class.'});
  dq.push({name:'Opening balance sheet',status:M.flags.openGiven?'pass':'warn',txt:M.flags.openGiven?'Opening balances provided, so full-year balance-sheet movements are available.':'No opening balances: the first month-end is used as the opening position and first-month movements show as nil.'});
  dq.push({name:'Cash flow statement',status:M.flags.cfDerived?'warn':'pass',txt:M.flags.cfDerived?'No cash-flow statement supplied; it has been derived from P&L and balance-sheet movements (indirect method).':'Cash-flow statement supplied and mapped.'});
  if(M.flags.accdepFlipped) dq.push({name:'Accumulated depreciation sign',status:'warn',txt:'Accumulated depreciation was entered as a positive number and has been treated as a deduction from fixed assets.'});
  const fails=checks.filter(x=>x.status==='fail').length+dq.filter(x=>x.status==='fail').length;
  const warns=checks.filter(x=>x.status==='warn').length+dq.filter(x=>x.status==='warn').length;
  return {checks,dq,fails,warns};
}

function analyze(C){
  const X={};
  X.exp=expenseStats(C); X.drv=computeDrivers(C); X.ins=computeInsights(C,X); X.alerts=computeAlerts(C,X); X.score=computeScore(C);
  X.mom=momentum(C.M,C.M.N-1);
  return X;
}

/* KPI tile with comparison, threshold dot and sparkline */
function kpi(d){
  const C=S.C, sP=C.sP, sB=C.sB, spec=C.spec, v=d.get(sP,'c');
  const vf = d.kind==='pct'?pct : d.kind==='x'?xx : d.kind==='days'?dd : (x=>fmt(x));
  let delta='&nbsp;', tone='neu';
  if(d.noCmp){ delta=d.alt||'&nbsp;'; tone=d.altTone||'neu'; }
  else if(sB){
    let base = d.kind==='stock' ? d.get(sB, spec.avg?'a':'c') : d.get(sB,'c');
    if(d.kind==='flow' && base!=null) base*=spec.factor;
    if(v!=null && base!=null && isFinite(v) && isFinite(base)){
      const df=v-base, tiny = d.kind==='pct'?Math.abs(df)<0.0005 : d.kind==='x'?Math.abs(df)<0.005 : d.kind==='days'?Math.abs(df)<0.5 : Math.abs(df)<Math.max(1,Math.abs(base)*0.0005);
      const ar = tiny ? '' : arrow(df)+' ';
      if(d.kind==='flow'||d.kind==='stock'){ const pc = base>0 ? df/base : null; delta=`${ar}${fmt(df,{plus:true,cur:false})}${pc!=null?` (${pct(pc,1,true)})`:''}`; }
      else if(d.kind==='pct') delta=`${ar}${pp(df)}`;
      else if(d.kind==='x') delta=`${ar}${df>=0?'+':'−'}${Math.abs(df).toFixed(2)}x`;
      else delta=`${ar}${df>=0?'+':'−'}${Math.abs(Math.round(df))} days`;
      let extra=null;
      if((S.cfg.dir[d.dir||d.id])==='cost' && base>0 && sB.rev>0) extra={g:v/base-1, rg: sP.rev/(sB.rev*spec.factor)-1};
      tone = tiny ? 'neu' : toneOf(d.dir||d.id, df, extra);
      delta += ` <span class="vs">vs ${esc(spec.short)}</span>`;
    } else delta=`<span class="vs">Not meaningful vs ${esc(spec.short)}</span>`;
  } else delta=`<span class="vs" title="${esc(spec.why)}">No valid comparison</span>`;
  const st = d.thr ? classify(d.thr, v) : null;
  const sp = d.ser ? spark(d.ser,{hl:C.P, zero:d.sparkZero, color:tone==='neg'?'#b3564d':COL.accent}) : '';
  return `<div class="k"${d.go?` data-go="${d.go}" tabindex="0" role="link" title="Open ${esc(pageName(d.go))}"`:''}>
<div class="kt"><span>${st?`<i class="dot s${st.i}" title="${esc(st.label)}"></i>`:''}${esc(d.label)}</span>${info(d.id)}</div>
<div class="kv">${d.valTxt!=null?d.valTxt:vf(v)}</div><div class="kd ${tone}">${delta}</div>${d.sub?`<div class="ks">${d.sub}</div>`:''}${sp}</div>`;
}
function kstrip(defs,cls){ return `<div class="kstrip ${cls||''}">${defs.map(kpi).join('')}</div>`; }
function cmpLine(){ const C=S.C; return `${pLabel(C.P,true)} compared with ${C.spec.B?C.spec.name:'no valid comparison — '+C.spec.why}`; }

/* ===================== 1. EXECUTIVE OVERVIEW ===================== */

  if(LV.recon.length) h+=`<div class="banner bad">The live rebuild does not tie to the ledger in ${LV.recon.length} place${LV.recon.length>1?'s':''}: ${esc(LV.recon.slice(0,3).join(' · '))}. Figures for those months are unreliable.</div>`;
  const T=[

    {id:'gm',label:'Gross margin',kind:'pct',get:x=>x.gm,go:'profit',ser:mRat('gp','rev'),thr:'gm'},

    {id:'ebit',label:'Operating profit (EBIT)',kind:'flow',get:x=>x.ebit,go:'profit',ser:mPL('ebit'),sparkZero:true,sub:`Depreciation ${fmt(s.dep)}`},

    {id:'cfo',label:'Operating cash flow',kind:'flow',get:x=>x.cf_cfo,go:'cash',ser:mCF('cfo'),sparkZero:true,sub:s.np>0?`Cash conversion ${pct(s.cf_cfo/s.np,0)}`:'Cash conversion not meaningful (loss)'},
    {id:'fcf',label:'Free cash flow',kind:'flow',get:x=>x.cf_fcf,go:'cash',ser:mCF('fcf'),sparkZero:true,sub:`After capex of ${fmt(-s.cf_capex)}`},
    {id:'cash',label:'Closing cash',kind:'stock',get:(x,m)=>x.bs.cash[m],go:'cash',ser:mBS('cash'),sub:`Moved ${fmt(s.bs.cash.c-s.bs.cash.o,{plus:true})} in period`},
    {id:'nwc',label:'Working capital',kind:'stock',get:(x,m)=>x.bs.nwc[m],go:'wc',ser:mBS('nwc'),sub:`Trade working capital ${fmt(s.bs.twc.c)}`},
    {id:'cr',label:'Current ratio',kind:'x',get:x=>x.cr,go:'bs',ser:C.ms.map(x=>x.cr),thr:'cr',sub:`Quick ratio ${xx(s.qr)}`},
    {id:'netdebt',label:s.bs.netdebt.c<0?'Net cash':'Net debt',kind:'stock',get:(x,m)=>x.bs.netdebt[m],go:'bs',ser:mBS('netdebt'),valTxt:s.bs.netdebt.c<0?fmt(-s.bs.netdebt.c):null,sub:`Total debt ${fmt(s.bs.debt.c)}`}
  ];
  h+=sec('Key figures',cmpLine()+'. Dots show threshold status; click a figure to open its page.',kstrip(T,'k7'));

  const al=X.alerts.slice(0,6);
  h+=sec('Needs management attention',`${X.alerts.length} alert${X.alerts.length===1?'':'s'} triggered by the warning rules. The full list, with insights and drivers, is on the Performance drivers page.`,
    `<div class="panel">${al.length?`<ul class="ins">${al.map(a=>`<li><i class="mk ${a.pri==='High'?'neg':a.pri==='Medium'?'wat':''}"></i><span><span class="pill pri-${a.pri}">${a.pri}</span> ${esc(a.text)}</span><a class="go" data-go="${a.go}" tabindex="0">Open ${esc(pageName(a.go))}</a></li>`).join('')}</ul>`:'<div class="empty">No warning rules are triggered for this period.</div>'}</div>`);
  return {html:h};
}
function diagPath(C,X){
  const y=C.sYTD, st=[], ok=C.sL3&&C.sQ1;

function bridgePeriods(mode,C){
  const M=C.M, N=M.N, A=C.A, L=M.L;
  let cur, base, cl, bl;
  if(mode==='mom'){ if(A<1) return {ok:false,why:'The first month has no previous month.'}; cur=[A]; base=[A-1]; cl=L[A]; bl=L[A-1]; }
  else if(mode==='qoq'){ const q=lastFullQ(A); if(q<1) return {ok:false,why:'Needs two complete quarters up to the selected month.'}; cur=R(q*3,q*3+2); base=R(q*3-3,q*3-1); cl='Q'+(q+1); bl='Q'+q; }
  else if(mode==='h'){ if(N<12) return {ok:false,why:'Needs a complete second half (12 months of data).'}; cur=R(6,11); base=R(0,5); cl='H2'; bl='H1'; }
  else { const q=Math.floor(N/3)-1; if(q<1) return {ok:false,why:'Needs at least two complete quarters.'}; cur=R(q*3,q*3+2); base=[0,1,2]; cl='Q'+(q+1); bl='Q1'; }
  const a=snap(M,base), b=snap(M,cur), it=[{label:bl+' net profit',v:a.np,total:true}];
  const pushD=(l,v)=>{ if(Math.abs(v)>0.5) it.push({label:l,v}); };
  pushD('Revenue',b.rev-a.rev); pushD('Cost of goods sold',-(b.cogs-a.cogs));
  M.pl.cats.forEach(c=>pushD(c,-(b.cat[c]-a.cat[c])));
  pushD('Depreciation',-(b.dep-a.dep)); pushD('Other income',b.othinc-a.othinc); pushD('Finance costs',-(b.fin-a.fin)); pushD('Tax',-(b.tax-a.tax));
  it.push({label:cl+' net profit',v:b.np,total:true});
  return {ok:true,items:it,a,b,cl,bl};
}
function bridgeText(bp){
  const d=bp.items.filter(x=>!x.total), pos=d.filter(x=>x.v>0).sort((a,b)=>b.v-a.v), neg=d.filter(x=>x.v<0).sort((a,b)=>a.v-b.v), ch=bp.b.np-bp.a.np;
  return `<div class="small" style="line-height:1.6"><p style="margin-top:0">Net profit ${ch>=0?'rose':'fell'} by <b>${fmt(Math.abs(ch))}</b>, from ${fmt(bp.a.np)} (${pct(bp.a.npm)} margin) to ${fmt(bp.b.np)} (${pct(bp.b.npm)} margin).</p>
<p><b class="pos">Helped profit</b><br>${pos.length?pos.slice(0,4).map(x=>`${esc(x.label)} ${fmt(x.v,{plus:true})}`).join('<br>'):'None'}</p>

function marginTable(C){
  const M=C.M, p=M.pl, L=M.L, N=M.N, ms=R(0,N-1), mp=S.cfg.par.marginPP/100;
  const rows=[['gm','Gross margin','gp','gm'],['ebitdam','EBITDA margin','ebitda','ebitdam'],['opm','Operating margin','ebit','opm'],['npm','Net margin','np','npm']];
  const flags=[];
  const body=rows.map(([id,nm,k,t])=>{
    const m=ms.map(i=>dv(p[k][i],p.rev[i])), hi=argmax(ms,i=>m[i]), lo=argmin(ms,i=>m[i]);
    const q1=C.sQ1?C.sQ1[id]:null, l3=C.sL3?C.sL3[id]:null, d=(q1!=null&&l3!=null)?l3-q1:null, cl=classify(t,C.sP[id]);
    let flag='—', fc='neu';
    if(d!=null){ if(d<=-mp){ flag=C.gL3>0?'Compression':'Declining'; fc='neg'; if(C.gL3>0) flags.push(`Revenue increased ${pct(C.gL3)} between Q1 and ${C.L3name}, but ${nm.replace(/^(Gross|Operating|Net)/,m=>m.toLowerCase())} decreased from ${pct(q1)} to ${pct(l3)}.`); } else if(d>=mp){ flag='Expanding'; fc='pos'; } else flag='Stable'; }
    return `<tr><td class="l">${nm} ${info(id)}</td><td class="selc">${pct(C.sP[id])}</td><td>${pct(C.sFY[id])}</td><td>${pct(m[hi])} <span class="faint">${L[hi]}</span></td><td>${pct(m[lo])} <span class="faint">${L[lo]}</span></td><td>${pct(q1)}</td><td>${pct(l3)}</td><td class="${d==null?'':d>=0?'pos':'neg'}">${pp(d)}</td><td class="l">${cl?`<span class="pill s${cl.i}">${cl.label}</span>`:'—'}</td><td class="l ${fc}">${flag}</td></tr>`;
  }).join('');
  return `<div class="tw"><table class="t"><thead><tr><th class="l">Margin</th><th class="selc">${pLabel(C.P)}</th><th>Full year</th><th>Highest month</th><th>Lowest month</th><th>Q1</th><th>${C.L3name||'Latest 3M'}</th><th>Change Q1 → latest</th><th class="l">Threshold status</th><th class="l">Trend ${info('margin_comp')}</th></tr></thead><tbody>${body}</tbody></table></div>
${flags.length?`<div class="panel" style="margin-top:12px;border-left:3px solid var(--unfav)"><h3>Margin compression flags</h3><ul class="ins">${flags.map(f=>`<li><i class="mk neg"></i><span>${f}</span><span></span></li>`).join('')}</ul></div>`:(C.sL3?'<p class="note">No margin compression: no margin fell by more than the material change while revenue grew.</p>':'<p class="note">Q1 vs latest comparison needs at least six months of data.</p>')}`;
}
function commonSizePL(C){
  const M=C.M, N=M.N, L=M.L, mode=S.ui.cs;
  let cols;
  if(mode==='M') cols=R(0,N-1).map(i=>({l:L[i],ms:[i]}));
  else if(mode==='Q') cols=R(0,Math.ceil(N/3)-1).map(q=>({l:'Q'+(q+1)+(q*3+2>N-1?'*':''),ms:R(q*3,Math.min(q*3+2,N-1))}));
  else cols=[];
  cols.push({l:'Full year',ms:R(0,N-1),fy:true});
  const sn=cols.map(c=>snap(M,c.ms)), fy=sn[sn.length-1];
  const lines=[['Revenue',s=>s.rev,'rev'],['Cost of goods sold',s=>s.cogs,'cost'],['Gross profit',s=>s.gp,'profit',1],...M.pl.cats.map(c=>['  '+c,s=>s.cat[c],'cost']),['Total operating expenses',s=>s.opex,'cost',1],['EBITDA',s=>s.ebitda,'profit',1],['Depreciation',s=>s.dep,'cost'],['Operating profit (EBIT)',s=>s.ebit,'profit',1],['Other income',s=>s.othinc,'profit'],['Finance costs',s=>s.fin,'cost'],['Profit before tax',s=>s.pbt,'profit',1],['Tax',s=>s.tax,'cost'],['Net profit',s=>s.np,'profit',2]];
  const heat=(v,f,kind)=>{ if(v==null||f==null||kind==='rev') return ''; let d=(v-f)*(kind==='cost'?1:-1); if(d>0.03) return 'heat-up2'; if(d>0.01) return 'heat-up'; if(d<-0.03) return 'heat-dn2'; if(d<-0.01) return 'heat-dn'; return ''; };
  return `<div class="tw"><table class="t"><thead><tr><th class="l sticky">Line</th>${cols.map(c=>`<th class="${c.fy?'sep':''}">${c.l}</th>`).join('')}</tr></thead><tbody>
${lines.map(([nm,g,kind,tot])=>`<tr class="${tot===2?'tot':tot?'sub':''}"><td class="l sticky ${nm.startsWith('  ')?'ind1':''}">${esc(nm.trim())}</td>${sn.map((s,j)=>{ const v=dv(g(s),s.rev); return `<td class="${cols[j].fy?'sep':heat(v,dv(g(fy),fy.rev),kind)}">${v==null?'—':pct(v)}</td>`; }).join('')}</tr>`).join('')}
</tbody></table></div>${mode==='Q'&&N%3?'<p class="note">* Partial quarter.</p>':''}`;
}

<tr class="tot"><td class="l">Total operating expenses</td><td class="selc">${fmtN(s.opex)}</td><td>${fmtN(C.sYTD.opex)}</td><td>${fmtN(C.sFY.opex)}</td><td>${fmtN(C.sFY.opex/M.N)}</td><td>${pct(s.opexpct)}</td><td colspan="5"></td></tr>
</tbody></table></div>`);
  h+=`<div class="sec grid g2">
${panel('Where the money goes',`Operating expenses by category, ${pLabel(C.P)}. Value and share of total.`,chartBox('c-ex-br'),'exp_share')}
${panel('Expense as % of revenue',`Bars: ${pLabel(C.P)}. Black marker: Q1 level, the internal baseline.`,chartBox('c-ex-pct'),'exp_pct')}

function effTable(C,ex){
  if(C.gL3==null) return '<div class="empty">Needs at least six months of data to compare the latest three months with Q1.</div>';
  const rows=[...ex].sort((a,b)=>(b.g||-9)-(a.g||-9)), st=[];
  rows.forEach(e=>{ if(e.faster&&e.mult!=null) st.push({t:'neg',x:`${e.c} grew ${e.mult.toFixed(1)}x faster than revenue (${pct(e.g,0,true)} vs ${pct(C.gL3,0,true)}).`});
    else if(e.faster) st.push({t:'neg',x:`${e.c} increased ${pct(e.g,0,true)} while revenue ${C.gL3<0?'declined':'was flat'}.`});
    else if(e.dpp!=null&&e.dpp<=-0.003&&e.material) st.push({t:'pos',x:`${e.c} fell from ${pct(e.pr1)} to ${pct(e.pr3)} of revenue.`}); });
  const nf=rows.filter(e=>e.faster).length;
  if(nf>=2) st.unshift({t:'neg',x:`${WORDS[nf]||nf} expense categories grew materially faster than business growth.`});
  return `<div class="grid g21"><div class="tw"><table class="t"><thead><tr><th class="l">Category</th><th>Q1</th><th>${C.L3name}</th><th>Growth</th><th>Revenue growth</th><th>Multiple ${info('exp_mult')}</th><th>% revenue Q1</th><th>% revenue ${C.L3name}</th><th>Change</th></tr></thead><tbody>
${rows.map(e=>`<tr><td class="l">${esc(e.c)}${e.material?'':' <span class="faint small">(below materiality)</span>'}</td><td>${fmtN(e.q1)}</td><td>${fmtN(e.l3)}</td><td class="${e.g==null?'':e.g>C.gL3?'neg':'pos'}">${e.g==null?'—':pct(e.g,0,true)}</td><td>${pct(C.gL3,0,true)}</td><td class="${e.faster?'neg':''}">${e.mult!=null?e.mult.toFixed(1)+'x':'—'}</td><td>${pct(e.pr1)}</td><td>${pct(e.pr3)}</td><td class="${e.dpp==null?'':e.dpp>0.0005?'neg':e.dpp<-0.0005?'pos':''}">${pp(e.dpp)}</td></tr>`).join('')}
</tbody></table><p class="note" style="padding:0 10px 8px">Amounts in ${scaleWord()}.</p></div>
<div class="panel"><h3>Automatic flags</h3><div class="q">Multiple = category growth ÷ revenue growth; flagged at ${S.cfg.par.fasterMult}x or more for categories of at least ${S.cfg.par.materialPct}% of revenue.</div><ul class="ins">${st.length?st.map(x=>`<li><i class="mk ${x.t}"></i><span>${x.x}</span><span></span></li>`).join(''):'<li><i class="mk"></i><span>No category grew materially faster than revenue.</span><span></span></li>'}</ul></div></div>`;
}

function eqCat(np,cfo){
  if(np>0){ const r=cfo/np, c=classify('eq',r); return Object.assign({r},c||{i:null,label:'—'}); }
  return {r:null,i:null,label:cfo>=0?'Not meaningful (loss, cash positive)':'Not meaningful (loss, cash negative)'};
}
function pcCat(np,cfo){ return np>0?(cfo>=0?'a':'b'):(cfo>=0?'c':'d'); }
function pgCash(){
  const C=S.C, M=C.M, L=M.L, s=C.sP, A=C.A, N=M.N, p=M.pl, c=M.c, par=S.cfg.par;
  const T=[
    {id:'cash_open',label:'Opening cash',kind:'stock',get:x=>x.cashOpen},

  return {html:h, after:()=>{
    const Lb=Ls(), P=C.P;
    const wf=wfItems([{label:'Opening cash',v:s.cashOpen,total:true},{label:'Operating',v:s.cf_cfo},{label:'Investing',v:s.cf_cfi},{label:'Financing',v:s.cf_cff},{label:'Closing cash',v:s.cashClose,total:true}]);

function whereCash(s){
  const wc=s.cf_ar+s.cf_inv+s.cf_ap+s.cf_oca+s.cf_ocl+s.cf_othop, nc=s.cf_dep+s.cf_noncash;
  const parts=[['Receivables',s.cf_ar],['Inventory',s.cf_inv],['Payables',s.cf_ap],['Other working capital',s.cf_oca+s.cf_ocl+s.cf_othop]].filter(x=>Math.abs(x[1])>0.5).sort((a,b)=>a[1]-b[1]);
  let t=s.np>0?`<p style="margin-top:0">Of <b>${fmt(s.np)}</b> net profit in ${pLabel(S.C.P)}, <b>${fmt(s.cf_cfo)}</b> became operating cash${s.np>0?` (${pct(s.cf_cfo/s.np,0)})`:''}.</p>`:`<p style="margin-top:0">The period made a net loss of <b>${fmt(-s.np)}</b>; operating cash flow was <b>${fmt(s.cf_cfo)}</b>.</p>`;
  t+=`<p>Non-cash charges (depreciation and provisions) added back <b>${fmt(nc)}</b>. Working capital ${wc<0?'absorbed':'released'} <b>${fmt(Math.abs(wc))}</b>.</p>`;
  t+=`<p>${parts.map(([n,v])=>`${n}: <b class="${v<0?'neg':'pos'}">${fmt(v,{plus:true})}</b> ${v<0?'absorbed':'released'}`).join('<br>')}</p>`;
  const w=parts[0]; if(w&&w[1]<0) t+=`<p class="faint">The largest drain was ${w[0].toLowerCase()}. ${w[0]==='Receivables'?'Collections lagged sales; see Working capital for DSO.':w[0]==='Inventory'?'Stock was built ahead of sales; see Working capital for inventory days.':''}</p>`;
  return `<div class="small" style="line-height:1.6">${t}</div>`;
}

function acctSum(r,ms){ return ms.reduce((s,k)=>{ const v=r.vals[k]; return s+((v==null||Number.isNaN(v))?0:v); },0); }
function acctBal(r,s,c,M){
  const flip=(r.cls==='ACCDEP'&&M.flags.accdepFlipped)?-1:1;
  const v=k=>{ const x=r.vals[k]; return (x==null||Number.isNaN(x))?0:x; };
  const op=f=>f===0?(M.flags.openGiven?((r.open==null||Number.isNaN(r.open))?0:r.open):v(0)):v(f-1);
  const f=s.ms[0], l=s.ms[s.ms.length-1];
  if(c.open) return flip*op(f);
  if(c.avg){ let t=op(f); for(let k=f;k<=l;k++) t+=v(k); return flip*t/(l-f+2); }
  return flip*v(l);
}
function exRows(st,M){
  const rows=[], add=o=>{ rows.push(o); return o; }, by=M.by[st]||{};
  const has=cls=>(by[cls]||[]).length>0;

  const resolve=(r,s)=>{ const SM=s.__M||M; if(SM===M) return r;
    if(!SM.__byName) SM.__byName=Object.fromEntries(SM.rows.map(x=>[x.st+'|'+String(x.acct).toLowerCase(),x]));
    return SM.__byName[r.st+'|'+String(r.acct).toLowerCase()]||null; };
  const flow=r=>s=>{ const rr=resolve(r,s); return rr?acctSum(rr,s.ms):null; };
  if(st==='PL'){
    const L1=(id,label,g,cls,acls)=>{ add({id,label,depth:0,cls,get:g,tog:acls?has(acls):false}); if(acls) accts(id,acls,1,flow); };
    L1('rev','Revenue',s=>s.rev,'','REV'); L1('cogs','Cost of goods sold',s=>s.cogs,'','COGS'); L1('gp','Gross profit',s=>s.gp,'sub');
    add({id:'opex',label:'Operating expenses',depth:0,get:s=>s.opex,tog:true});
    M.pl.cats.forEach((c,j)=>{ const id='cat'+j; add({id,label:c,depth:1,parent:'opex',get:s=>(s.cat&&s.cat[c]!=null?s.cat[c]:null),tog:true}); (by.OPEX||[]).filter(r=>r.cat===c).forEach(r=>add({id:id+'~'+r.i,label:r.acct,depth:2,parent:id,acct:true,get:flow(r)})); });
    L1('ebitda','EBITDA',s=>s.ebitda,'sub'); L1('dep','Depreciation & amortisation',s=>s.dep,'','DEP'); L1('ebit','Operating profit (EBIT)',s=>s.ebit,'sub');
    L1('oth','Other income',s=>s.othinc,'','OTHINC'); L1('fin','Finance costs',s=>s.fin,'','FIN'); L1('pbt','Profit before tax',s=>s.pbt,'sub'); L1('tax','Tax',s=>s.tax,'','TAX'); L1('np','Net profit',s=>s.np,'tot');
  } else if(st==='BS'){
    const bal=k=>(s,c)=>c.open?s.bs[k].o:c.avg?s.bs[k].a:s.bs[k].c;
    const ab=r=>(s,c)=>{ const rr=resolve(r,s); return rr?acctBal(rr,s,c,s.__M||M):null; };
    const grp=(id,label,k,kids)=>{ add({id,label,depth:0,cls:'grp',get:bal(k),tog:true}); kids.forEach(([cid,cl,ck,ccls])=>{ add({id:cid,label:cl,depth:1,parent:id,get:bal(ck),tog:has(ccls)}); accts(cid,ccls,2,ab); }); };
    grp('tca','Current assets','tca',[['bcash','Cash','cash','CASH'],['bar','Accounts receivable','ar','AR'],['binv','Inventory','inv','INV'],['boca','Other current assets','oca','OCA']]);
    grp('tnca','Non-current assets','tnca',[['bfa','Fixed assets (cost)','fa','FA'],['bad','Accumulated depreciation','accdep','ACCDEP'],['bonca','Other non-current assets','onca','ONCA']]);
    add({id:'ta',label:'Total assets',depth:0,cls:'tot',get:bal('ta')});
    grp('tcl','Current liabilities','tcl',[['bap','Accounts payable','ap','AP'],['bocl','Other current liabilities','ocl','OCL'],['bstd','Short-term debt','std','STD']]);
    grp('tncl','Non-current liabilities','tncl',[['bltd','Long-term debt','ltd','LTD'],['boncl','Other non-current liabilities','oncl','ONCL']]);
    add({id:'tl',label:'Total liabilities',depth:0,cls:'sub',get:bal('tl')});
    grp('te','Equity','te',[['bsc','Share capital','sc','SC'],['bre','Retained earnings','re','RE'],['bcye','Current-year earnings','cye','CYE']]);
    add({id:'tle',label:'Total liabilities and equity',depth:0,cls:'tot',get:bal('tle')});
    add({id:'chk',label:'Balance check (should be zero)',depth:0,get:(s,c)=>c.open?s.bs.ta.o-s.bs.tle.o:c.avg?s.bs.ta.a-s.bs.tle.a:s.bs.ta.c-s.bs.tle.c});
  } else {
    const fl=k=>s=>s['cf_'+k];
    const grp=(id,label,k,kids)=>{ add({id,label,depth:0,cls:'grp',get:fl(k),tog:true}); kids.forEach(([cid,cl,ck,ccls])=>{ add({id:cid,label:cl,depth:1,parent:id,get:fl(ck),tog:has(ccls)}); accts(cid,ccls,2,flow); }); };
    grp('cfo','Operating activities','cfo',[['cnp','Net profit','np','CF_NP'],['cdep','Depreciation','dep','CF_DEP'],['cnc','Other non-cash items','noncash','CF_NONCASH'],['car','Change in receivables','ar','CF_AR'],['cinv','Change in inventory','inv','CF_INV'],['coca','Change in other current assets','oca','CF_OCA'],['cap','Change in payables','ap','CF_AP'],['cocl','Change in other current liabilities','ocl','CF_OCL'],['coth','Other operating items','othop','CF_OTHOP']]);
    grp('cfi','Investing activities','cfi',[['ccap','Capital expenditure','capex','CF_CAPEX'],['coi','Other investing','othinv','CF_OTHINV']]);
    grp('cff','Financing activities','cff',[['cdi','Debt raised','din','CF_DEBT_IN'],['cdo','Debt repaid','dout','CF_DEBT_OUT'],['cct','Owner contributions','contrib','CF_CONTRIB'],['cdv','Dividends / drawings','div','CF_DIV'],['cof','Other financing','othfin','CF_OTHFIN']]);
    add({id:'net',label:'Net change in cash',depth:0,cls:'sub',get:fl('net')});
    add({id:'open',label:'Opening cash',depth:0,get:s=>s.cashOpen,stock:true});
    add({id:'close',label:'Closing cash',depth:0,cls:'tot',get:s=>s.cashClose,stock:true});
    add({id:'fcf',label:'Free cash flow (operating cash flow − capex)',depth:0,cls:'sub',get:fl('fcf')});
  }
  return rows;
}
