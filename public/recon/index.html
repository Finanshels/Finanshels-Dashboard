<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;padding:18px 28px 0}

.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--orange);display:grid;place-items:center;font-weight:800;color:#fff}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12.5px;color:#B9C7CF;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:12.5px;color:#E5EDF1}
.dot{width:8px;height:8px;border-radius:50%;background:#5FD39A}
.dot.off{background:#F2B84B}.dot.err{background:#F0766E}
.btn{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.1)}
.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
.tab{background:none;border:0;color:#B9C7CF;padding:11px 16px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
.tab:hover{color:#fff}
.tab[aria-selected=true]{background:var(--bg);color:var(--navy)}
main{padding:22px 28px 60px;max-width:1500px;margin:0 auto}
.banner{border-radius:var(--r);padding:14px 18px;margin-bottom:18px;border:1px solid var(--line);background:var(--cream)}
.banner.err{background:var(--badbg);border-color:#F3C6C2}
.banner b{display:block;margin-bottom:2px}
.banner button{margin-top:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.mbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.mbar label{font-weight:700;font-size:13.5px}
.mbar select{border:1.5px solid var(--navy);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;min-width:170px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-b{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip-b:hover{border-color:var(--orange)}
.chip-b[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.mnote{margin-left:auto;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:16px}
.two{grid-template-columns:repeat(auto-fit,minmax(440px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.kpi .lab{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.kpi .val{font-size:24px;white-space:nowrap;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.kpi .note{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.hl{border-left:4px solid var(--orange)}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10px;cursor:help}
h2{font-size:15px;margin:0 0 2px;font-weight:700}
.cap{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-good{background:var(--goodbg);color:var(--good)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-neu{background:var(--neutralbg);color:var(--ink2)}
/* verdict cell: a short coloured pill with the reason underneath, so the cell reads as one plain sentence */
.vcell{display:block;max-width:330px}
.bar-go{cursor:pointer}.bar-go:hover rect+text,.bar-go:focus rect+text{fill:var(--brand)}
.bar-go:hover path,.bar-go:focus path{fill:var(--accent)}.bar-go:focus{outline:2px solid var(--accent);outline-offset:2px}
.drill{display:flex;align-items:center;gap:10px;background:var(--warnbg);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.vcell .why{display:block;margin-top:3px;font-size:11.5px;line-height:1.35;color:var(--muted);white-space:normal}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px}
.filters input{min-width:240px}
.filters input[type=date]{min-width:0}
.filters .sp{margin-left:auto;color:var(--muted);font-size:12.5px}
.lbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
.lbtn:hover{border-color:var(--orange);color:var(--s2)}
td.rvc{white-space:normal;min-width:190px;max-width:280px}
.rbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.rbtn:hover:not([disabled]){border-color:var(--orange);color:var(--s2)}.rbtn[disabled]{opacity:.5;cursor:not-allowed}
.rvn{color:var(--ink2);font-size:12.5px}.rvm{color:var(--muted);font-size:11.5px;margin-top:2px}
.linkb{border:0;background:none;padding:0;color:var(--s1);cursor:pointer;font-size:11.5px;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(12,42,58,.45);display:grid;place-items:center;z-index:50;padding:16px}.modal.hide{display:none}
.mbox{background:#fff;border-radius:var(--r);max-width:520px;width:100%;padding:20px 22px;box-shadow:0 10px 40px rgba(12,42,58,.25)}
.mbox h2{margin:0 0 8px}.mfacts{font-size:13px;margin-bottom:4px}.mdet{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.mbox label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.mbox .req{color:var(--muted);font-weight:400}
.mbox textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;resize:vertical}
.mbox textarea:focus{outline:2px solid var(--orange);outline-offset:1px}
.mhint{font-size:12px;color:var(--muted);margin-top:6px}.merr{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:6px}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.pbtn{border:0;background:var(--orange);color:#fff;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}.pbtn[disabled]{opacity:.6;cursor:wait}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;z-index:60;box-shadow:0 6px 24px rgba(12,42,58,.3)}
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#F4F0EA;text-align:left;padding:9px 10px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--line)}
td{white-space:nowrap}td.d{white-space:normal;min-width:260px}
td{padding:8px 10px;border-bottom:1px solid #F1ECE4;vertical-align:top}
tr:hover td{background:#FFFBF5}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.d{max-width:460px;color:var(--ink2)}
.empty{padding:26px;text-align:center;color:var(--muted)}
svg text{font-family:inherit}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.4;max-width:300px;z-index:9;opacity:0;transition:opacity .08s;box-shadow:0 4px 14px rgba(12,42,58,.18)}
#tip b{display:block}
.foot{margin-top:22px;color:var(--muted);font-size:12px}
.hide{display:none!important}
@media(max-width:720px){.top,main{padding-left:16px;padding-right:16px}.two{grid-template-columns:1fr}.filters input{min-width:0;flex:1}}
</style>

/* ---------- per-cell explanations on the Proposals table ----------

/* Which exception types sit behind each accuracy bar. Mirrors RC_STAT_FOR in the engine, plus D3 and the Catch Up
   note, which do not move the accuracy figures but do belong to that bar when drilling into it. The G tie-outs are
   matched by pattern, the same way the engine derives them. */
var EXC_TO_STAT={'A1 Invoice missing':'A1 Invoice exists','A2 Amount difference':'A2 Amount agrees','A3 Invoice late':'A3 Invoice on time',
  'C Wrong account':'C Correct account',
  'D Revenue recognised early':'D Deferral','D Over-deferred':'D Deferral','D Unexpectedly deferred':'D Deferral',
  'D Deferral rule not set for service':'D Deferral','D Past months left in Deferred Revenue':'D Deferral','D Past months not in Catch Up':'D Deferral',
  'D2 No deferred revenue release journal':'D2 Deferred revenue released in month','D2 Deferred revenue under-released':'D2 Deferred revenue released in month',
  'D2 Deferred revenue balance is negative':'D2 Deferred revenue released in month',
  'D3 Non-accounting service in Deferred Revenue':'D3 Deferred Revenue holds accounting fees only',
  'E Subscription missing':'E Subscription exists','E Subscription frequency':'E Subscription frequency','E Subscription start month':'E Subscription start month',
  'F Subscription not billed':'F Subscription billed for current term','F Billed amount differs from subscription':'F Billed amount equals subscription',
  'G3 FinCore cash not recorded in books':'G3 FinCore cash is in the books'};
function statForCheck(c){
  c=String(c||''); if(EXC_TO_STAT[c]) return EXC_TO_STAT[c];
  var m=c.match(/^(.*) (not in|differs from) ledger$/); if(m) return m[1]+' = ledger';
  if(/^Ledger posting with no live Zoho invoice$/.test(c)) return 'G1 Invoices = ledger';
  if(/^Ledger posting with no live Zoho credit note$/.test(c)) return 'G2 Credit notes = ledger';
  return '';
}
/* Clicking a bar opens the Exceptions page already filtered to what that bar is made of. */
function drillTo(kind, key){
  S.exc={sev:'',check:'',checkIn:null,status:'Open',q:'',drill:''};
  if(kind==='type'){ S.exc.check=key; S.exc.drill='exception type \u201c'+key+'\u201d'; }
  else {
    var list=(S.data.exc||[]).map(function(r){return r.Check;}).filter(function(c,i,a){return a.indexOf(c)===i;})
      .filter(function(c){ return statForCheck(c)===key; });
    S.exc.checkIn=list; S.exc.drill='the check \u201c'+key+'\u201d';
  }
  S.page='exceptions'; try{history.replaceState(null,'','#exceptions');}catch(x){} render();
  try{ $('pg-exceptions').scrollIntoView({block:'start'}); }catch(x){}
}
function wireBars(id, kind){
  var el=$(id); if(!el) return;
  var fire=function(t){ var g=t.closest?t.closest('[data-go]'):null; if(g) drillTo(kind, g.getAttribute('data-go')); };
  el.onclick=function(e){ fire(e.target); };
  el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(e.target); } };
}

var PROP_TIP_RE={'A1 Invoice':/^A1 /,'A2 Amount':/^A2 /,'C Account':/^C /,'D Deferral':/^D /,
  'E Subscription':/^E Subscription (missing|has no PR)/,'E Frequency':/^E Subscription frequency/,
  'E Start month':/^E Subscription start month/,'Overall':/./};
var PROP_NA={'A1 Invoice':'No FinCore deal value to invoice, or the deal is not a sale.',
  'A2 Amount':'No invoice matched yet, so there is nothing to compare the amount against.',
  'C Account':'No invoice matched yet, so the income account cannot be checked.',
  'D Deferral':'Nothing on this deal is billed for more than one month, so no amount should sit in Deferred Revenue.',
  'E Subscription':'No recurring service on this deal, so no Zoho Billing subscription is expected.',
  'E Frequency':'No subscription to compare the billing frequency against.',
  'E Start month':'No subscription to compare the service start month against.'};
var PROP_PENDING='The deal closed within the last 3 days (the invoice grace period), so a missing invoice is not late yet.';
/* The deferral cell answers one question in plain words, the way the Revenue - Reconciliation "Deferred Revenue Check"
   column does: a short coloured verdict, then the exact problem and the AED behind it underneath. */
function dfrPill(v){
  var t=String(v||''); if(!t) return '<span class="pill p-neu">–</span>';
  if(/^REVIEWED/.test(t)) return '<span class="pill p-neu" title="Closed by a reviewer as not an issue">✓ '+esc(t)+'</span>';
  var i=t.indexOf(' - '), head=i<0?t:t.slice(0,i), why=i<0?'':t.slice(i+3);
  var good=/^Correctly/.test(head), neu=/^n\/a/.test(head),
      warn=/^CANNOT TELL|^OVER-DEFERRED|^UNEXPECTEDLY DEFERRED/.test(head);
  var cls=good?'p-good':neu?'p-neu':warn?'p-warn':'p-bad', ic=good?'✓':neu?'–':warn?'◆':'✕';
  return '<span class="vcell"><span class="pill '+cls+'">'+ic+' '+esc(head)+'</span>'+
    (why?'<span class="why">'+esc(why)+'</span>':'')+'</span>';
}
function dfrClean(t){ return /^n\/a/.test(t)||t==='Correctly deferred'||/^Correctly not deferred/.test(t); }
function propTip(col,label,opt){
  opt=opt||{};
  var pill=opt.pill||okPill, clean=opt.ok||function(t){return /^OK/.test(t);};
  return function(v,r){
    var html=pill(v), txt=String(v||'');
    if(clean(txt)&&!/reviewed/i.test(txt)) return html;
    /* deal-level exceptions carry no service and belong on every row of the deal; service-level ones only on their own row */
    var ix=S.propExc||{}, list=(ix[r.PR+'|']||[]).concat(ix[r.PR+'|'+(r.Service||'')]||[]);
    var mine=list.filter(function(x){ var re=PROP_TIP_RE[col]; return re&&re.test(String(x.Check)); });
    var tip='<b>'+esc(label)+' · '+esc(txt)+'</b>';
    if(mine.length){ tip+=mine.map(function(x){
        return esc(x.Check)+(num(x['AED impact'])?' · '+aed(x['AED impact']):'')+'<br>'+esc(String(x.Detail||'').slice(0,320))
          +(x.Status==='Closed'&&x['Reviewer note']?'<br><i>Closed by '+esc(x['Reviewer by']||x['Reviewed by']||'')+': '+esc(x['Reviewer note'])+'</i>':'');
      }).join('<br><br>'); }
    else if(/PENDING/.test(txt)) tip+=PROP_PENDING;
    else if(txt==='n/a') tip+=PROP_NA[col]||'This check does not apply to this deal.';
    else if(/^REVIEWED/.test(txt)||/reviewed/i.test(txt)) tip+='A reviewer closed this as not a real problem, so it counts as passed.';
    else tip+='The engine flagged this, and the detail is on the Exceptions page.';
    return '<span data-tip="'+esc(tip)+'">'+html+'</span>';
  };
}

/* ---------- deferred revenue tracker (teammate sheet structure, any as-of date) ---------- */
function mIdx(ym){ var p=String(ym).split('-'); return (+p[0])*12+(+p[1]-1); }
function ymLabel(mi){ var m=mi%12+1; return monthLabel(Math.floor(mi/12)+'-'+(m<10?'0':'')+m); }
function trackerRow(r, asOf){
  var parts=String(r['Recognition schedule']||'').split('|').filter(Boolean).map(function(x){ var a=x.split(':'); return {start:mIdx(a[0]), term:Math.round(num(a[1])), mo:num(a[2])}; })
    .filter(function(p){ return p.term > 1; });   /* monthly billing is never deferred: only multi-month terms belong in a deferred revenue tracker */
  if(!parts.length) return null;
  var amount=0, monthly=0, rec=0, cat=0, first=null, terms=[];
  parts.forEach(function(p){
    amount+=p.term*p.mo; monthly+=p.mo; terms.push(p.term);
    if(first===null||p.start<first) first=p.start;
    var done=Math.max(0,Math.min(p.term, asOf-p.start+1));   /* months recognised up to and including the as-of month */
    var past=Math.max(0,Math.min(p.term, asOf-p.start));     /* months already closed before the as-of month */
    rec+=done*p.mo; cat+=past*p.mo;
  });
  var remain=Math.max(0, amount-rec), elapsed=Math.max(0, asOf-first+1);
  var category = rec<=0.5 ? 'NOT STARTED' : (remain<=0.5 ? 'BACKLOG' : (cat>0.5 ? 'CATCH-UP' : 'STANDARD'));
  var uniq=terms.filter(function(v,i,a){return a.indexOf(v)===i;});
  return { Customer:r.Company, 'PR Number':r.PR, 'Invoice':r['Invoice number'], 'Invoice date':r['Invoice date'],
    invMonth:String(r['Invoice date']||'').slice(0,7), Service:r.Service, 'Billing Frequency':r.Billing,
    'Amount (AED)':amount, 'Months in term':uniq.join(' + '), 'Monthly (AED)':monthly,
    'Service period start':ymLabel(first), 'Months elapsed':Math.min(elapsed, Math.max.apply(null,terms)),
    Category:category, 'Recognised to date (AED)':rec, 'Catch-up to recognise (AED)':cat, 'Remaining deferred (AED)':remain,
    Notes:(r['D Deferral']&&!dfrClean(String(r['D Deferral']))?'Deferral check: '+r['D Deferral']:'') };
}
function catPill(v){ var cls=v==='BACKLOG'?'p-bad':v==='CATCH-UP'?'p-warn':v==='STANDARD'?'p-good':'p-neu';
  var ic=v==='BACKLOG'?'▲ ':v==='CATCH-UP'?'◆ ':v==='STANDARD'?'✓ ':'';
  return '<span class="pill '+cls+'">'+ic+esc(v)+'</span>'; }
/* The as-of date follows the reporting month unless the user picks one, so choosing Aug 2026 measures recognition as
   at 31 Aug 2026 — never later than today, because a month that has not happened yet has nothing to recognise. */
function todayISO(){ return new Date(new Date().getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10); }
function monthEndISO(ym){ var p=String(ym).split('-'), d=new Date(Date.UTC(+p[0],+p[1],0)); return d.toISOString().slice(0,10); }
function trackerAsOf(){
  if(S.asOfManual) return S.asOf;
  if(S.month==='ALL') return todayISO();
  var e=monthEndISO(S.month), t=todayISO();
  return e<t?e:t;
}
function trackerRows(){
  var asOf=mIdx(trackerAsOf().slice(0,7));
  return (S.data.prop||[]).map(function(r){ return trackerRow(r, asOf); }).filter(Boolean)
    .sort(function(a,b){ return b['Catch-up to recognise (AED)']-a['Catch-up to recognise (AED)'] || b['Remaining deferred (AED)']-a['Remaining deferred (AED)']; });
}
function trackerCard(){
  var all=trackerRows(), A=function(v){return aed(v);}, n0=function(v){return num(v)?aed(v):'\u2013';};
  var asOf=trackerAsOf(), M=S.month;
  /* Split by the month the INVOICE was raised, not by the service period: an August invoice belongs to August even
     when its service months run into next year. Section 1 is the deferred revenue created in the reporting month;
     section 2 is what earlier months put into Deferred Revenue and still owe the books. */
  var noInv=all.filter(function(r){ return !r.invMonth; });
  var inv=all.filter(function(r){ return r.invMonth; });
  var thisM = M==='ALL' ? inv : inv.filter(function(r){ return r.invMonth===M; });
  var prior = M==='ALL' ? [] : inv.filter(function(r){ return r.invMonth<M && r['Catch-up to recognise (AED)']>0.5; });
  var COLS=[{k:'Customer'},{k:'PR Number'},{k:'Invoice'},{k:'Invoice date',label:'Invoiced'},{k:'Service'},{k:'Billing Frequency',label:'Billing'},
    {k:'Amount (AED)',label:'Amount',n:1,fmt:A},{k:'Months in term',label:'Months',n:1},{k:'Monthly (AED)',label:'Monthly',n:1,fmt:A},
    {k:'Service period start',label:'Period start'},{k:'Months elapsed',label:'Elapsed',n:1},{k:'Category',fmt:catPill},
    {k:'Recognised to date (AED)',label:'Recognised to date',n:1,fmt:A},{k:'Catch-up to recognise (AED)',label:'Catch-up to recognise',n:1,fmt:n0},
    {k:'Remaining deferred (AED)',label:'Remaining deferred',n:1,fmt:n0},{k:'Notes',cls:'d'}];
  var sum=function(rows,k){ return rows.reduce(function(a,r){ return a+r[k]; },0); };
  var cats=function(rows){ var by={}; rows.forEach(function(r){ by[r.Category]=(by[r.Category]||0)+1; }); return by; };

  var by=cats(thisM);
  var lab = M==='ALL' ? 'every month' : monthLabel(M);
  var out='<div class="card" style="margin-top:16px"><h2>Deferred revenue raised in '+esc(lab)+'</h2>'+
    '<div class="cap">Accounting fees only \u2014 the services Finanshels defers. One row per accounting service line on an invoice <b>raised in '+esc(lab)+'</b>, spread evenly over its term from the service-period start and measured as at '+esc(asOf)+'. A VAT filing, AML job or any other service billed quarterly or annually is recognised when invoiced, so it never appears here. <b>Catch-up to recognise</b> is the value of service months already closed but still sitting in Deferred Revenue; <b>Remaining deferred</b> is the value of months still ahead.</div>'+
    '<div class="filters"><label for="asof" style="font-weight:700">Measured as at</label><input id="asof" type="date" value="'+esc(asOf)+'" max="2100-12-31">'+
    '<span class="chips"><button class="chip-b" id="asof-today">Today</button>'+(S.asOfManual?'<button class="chip-b" id="asof-month">Follow reporting month</button>':'')+'</span>'+
    '<span class="sp">'+thisM.length+' line(s) \u00b7 '+(by.STANDARD||0)+' standard \u00b7 '+(by['CATCH-UP']||0)+' catch-up \u00b7 '+(by.BACKLOG||0)+' backlog'+(by['NOT STARTED']?' \u00b7 '+by['NOT STARTED']+' not started':'')+'</span>'+
    '<button class="lbtn" id="x-trk">Export CSV</button></div>'+
    '<div class="grid kpis" style="margin:0 0 12px">'+
    kpi('Deferred this month',aed(sum(thisM,'Remaining deferred (AED)')),thisM.length+' line(s) invoiced in '+esc(lab),'Value of service months still ahead on the accounting invoices raised in this reporting month \u2014 the balance they should be leaving in Deferred Revenue.',true)+
    kpi('Catch-up on these invoices',aed(sum(thisM,'Catch-up to recognise (AED)')),(by['CATCH-UP']||0)+' catch-up \u00b7 '+(by.BACKLOG||0)+' backlog','Service months on this month\u2019s invoices that had already closed when the invoice was raised \u2014 back-dated periods that should go straight to income, not sit in Deferred Revenue.')+
    kpi('Invoiced this month',aed(sum(thisM,'Amount (AED)')),'Recognised so far '+aed(sum(thisM,'Recognised to date (AED)')),'Total accounting-fee value invoiced in this reporting month, and how much of it the service periods say has been earned as at the date above.')+'</div>'+
    (thisM.length?table('trk',COLS,thisM):'<div class="cap">No accounting invoices were raised in '+esc(lab)+'.</div>')+
    (noInv.length?'<div class="cap" style="margin-top:10px">'+noInv.length+' recurring accounting line(s) have no invoice yet, so nothing is deferred for them.</div>':'')+
    '</div>';

  if(M!=='ALL'){
    var pby=cats(prior), pcat=sum(prior,'Catch-up to recognise (AED)');
    out+='<div class="card" style="margin-top:16px"><h2>Still to recognise from earlier months</h2>'+
      '<div class="cap">Accounting invoices raised <b>before '+esc(lab)+'</b> whose service months have since closed but whose revenue is still sitting in Deferred Revenue as at '+esc(asOf)+'. This is the release journal waiting to be posted \u2014 largest first.</div>'+
      '<div class="filters"><span class="sp">'+prior.length+' line(s) \u00b7 '+(pby['CATCH-UP']||0)+' catch-up \u00b7 '+(pby.BACKLOG||0)+' backlog</span>'+
      '<button class="lbtn" id="x-trk-prior">Export CSV</button></div>'+
      '<div class="grid kpis" style="margin:0 0 12px">'+
      kpi('To recognise now',aed(pcat),'From '+prior.length+' earlier invoice line(s)','Value of service months from earlier invoices that have already closed as at the date above and should be released from Deferred Revenue into income.',true)+
      kpi('Still ahead on these',aed(sum(prior,'Remaining deferred (AED)')),'Months not yet earned','The part of these earlier invoices that legitimately stays in Deferred Revenue after the catch-up is released.')+
      kpi('Oldest outstanding',prior.length?esc(prior.slice().sort(function(a,b){return a['Invoice date']<b['Invoice date']?-1:1;})[0]['Invoice date']):'\u2013','Earliest invoice still owing recognition','The earliest invoice date among the lines above \u2014 how far back the unreleased deferred revenue goes.')+'</div>'+
      (prior.length?table('trkp',COLS,prior):'<div class="cap">Nothing from earlier months is waiting to be recognised as at '+esc(asOf)+'.</div>')+'</div>';
  }
  return out;
}

function renderHealth(){
  var seen={}, feeds=[]; S.data.log.forEach(function(r){ if(!seen[r.Feed]){seen[r.Feed]=1;feeds.push(r);} });
  var errs=S.data.log.filter(function(r){return r.Status!=='OK'&&r.Status!=='PARTIAL';}).slice(0,15);
  var st=function(v){var p=v==='PARTIAL';return '<span class="pill '+(v==='OK'?'p-good':p?'p-warn':'p-bad')+'">'+(v==='OK'?'✓':p?'◆':'✕')+' '+esc(p?'CATCHING UP':v)+'</span>';};
  var LOGC=[{k:'Feed'},{k:'Status',fmt:st},{k:'Run finished',label:'Last run'},{k:'Rows in tab',label:'Rows',n:1},{k:'New / changed',n:1},{k:'Zoho API calls',label:'API calls',n:1},{k:'Message',cls:'d'}];
  var unk=S.data.map.filter(function(r){return String(r['Deferral in use'])==='Unknown'||!r['Account in use'];});
  $('pg-health').innerHTML='<div class="grid kpis">'+kpi('Feeds healthy',feeds.filter(function(r){return r.Status==='OK'||r.Status==='PARTIAL';}).length+' of '+feeds.length,'Latest run of each feed','Each data feed (Zoho Books, Zoho Billing, FinCore, ledger) refreshes hourly or daily. A failing feed never stops the others.',true)+
    kpi('Services needing a rule',unk.length,'Deferral or account not yet learnt','The engine learns the expected income account and deferral practice per service from history. Services with too few samples show as Unknown until enough history exists or an override is set in the sheet.')+
    kpi('Months frozen',S.data.close.map(function(r){return String(r.Month);}).filter(function(m,i,a){return a.indexOf(m)===i;}).length,'Recon Month Close snapshots','After month close the results are frozen, so later edits in Zoho Books cannot silently change a reported month.')+'</div>'+
    '<div class="card" style="margin-bottom:16px"><h2>Feed status</h2><div class="cap">Latest run per feed from the Sync Log.</div>'+table('feeds',LOGC,feeds)+'</div>'+
    (errs.length?'<div class="card" style="margin-bottom:16px"><h2>Recent feed errors</h2><div class="cap">Most recent 15 non-OK runs. Failed feeds retry on the next run.</div>'+table('errs',LOGC,errs)+'</div>':'')+
    '<div class="grid two"><div class="card"><h2>Service → account and deferral rules</h2><div class="cap">Learnt automatically from posting history; overrides are optional.</div>'+table('map',[{k:'FinCore service',label:'Service'},{k:'Account in use'},{k:'Samples',n:1},{k:'Share %',n:1},{k:'Deferral in use',label:'Deferral',fmt:function(v){return '<span class="pill '+(v==='Unknown'?'p-warn':'p-neu')+'">'+(v==='Unknown'?'◆ ':'')+esc(v)+'</span>';}}],S.data.map)+'</div>'+
    '<div class="card"><h2>Frozen month-close results</h2><div class="cap">Snapshot taken at month close.</div>'+table('close',[{k:'Month'},{k:'Check'},{k:'Checked',n:1},{k:'Accuracy %',n:1,fmt:pct},{k:'AED impact of flags',label:'Flagged AED',n:1,fmt:function(v){return aed(v);}},{k:'Frozen at'}],S.data.close)+'</div></div>';
}

var RENDER={overview:renderOverview,exceptions:renderExceptions,proposals:renderProposals,cadence:renderCadence,tieouts:renderTieouts,health:renderHealth};
function setMonth(m){ S.month=m; S.monthChosen=true; try{localStorage.setItem('fbr_month',m);}catch(e){} $('month').value=m; render(); }
function render(){
  Array.prototype.forEach.call($('chips').children,function(b){b.setAttribute('aria-pressed',b.getAttribute('data-month')===S.month);});
  $('mnote').textContent=S.data?('Every page below shows '+(S.month==='ALL'?'all months together':monthLabel(S.month)+' only · trend charts keep every month')):'';
  PAGES.forEach(function(p){ $('pg-'+p[0]).classList.toggle('hide',p[0]!==S.page); });
  $('mbar').classList.toggle('hide',S.page==='cadence');   /* the cadence list is an as-of-today view of every client, not a month's numbers */
  Array.prototype.forEach.call($('tabs').children,function(b){b.setAttribute('aria-selected',b.dataset.page===S.page);});
  if(S.data) RENDER[S.page]();
}
function fillMonths(){
  var ms=S.data.sum.map(function(r){return String(r.Month);}).filter(function(m,i,a){return m!=='ALL'&&a.indexOf(m)===i;}).sort().reverse();
  if(!S.monthChosen&&ms.length){ S.month=ms[0]; S.monthChosen=true; try{var sv=localStorage.getItem('fbr_month'); if(sv&&(sv==='ALL'||ms.indexOf(sv)>=0)) S.month=sv;}catch(e){} }
  if(S.month!=='ALL'&&ms.indexOf(S.month)<0) S.month='ALL';
  $('chips').innerHTML=['ALL'].concat(ms.slice().reverse()).map(function(m){return '<button class="chip-b" data-month="'+m+'" aria-pressed="'+(m===S.month)+'">'+(m==='ALL'?'All months':monthLabel(m))+'</button>';}).join('');
  $('month').innerHTML=['ALL'].concat(ms).map(function(m){return '<option value="'+m+'"'+(m===S.month?' selected':'')+'>'+monthLabel(m)+'</option>';}).join('');
}
function setStatus(kind,txt){ $('dot').className='dot'+(kind==='live'?'':kind==='err'?' err':' off'); $('status').textContent=txt; }
function banner(html,err){ var b=$('banner'); b.className='banner'+(err?' err':'')+(html?'':' hide'); b.innerHTML=html||''; }

function refresh(){
  if(S.demo) return; setStatus('load','Reading sheet…');
  loadAll().then(function(d){
    S.data=d; S.readAt=new Date(); fillMonths(); banner('');
    var ref=(d.sum[0]&&d.sum[0].Refreshed)||''; setStatus('live','Live · read '+S.readAt.toTimeString().slice(0,5));
    $('foot').textContent='Source: Google Sheet “Finanshels - Finance Books Reconciliation (Automated)”, refreshed hourly from Zoho Books, Zoho Billing, FinCore and the live ledger. Engine last ran '+ref+' (Dubai). This page re-reads the sheet every '+CFG.AUTO_REFRESH_MIN+' minutes.';
    render();
  }).catch(function(e){
    setStatus('err', S.data?'Refresh failed · showing last read':'Cannot read the sheet');
    if(!S.data){ banner('<b>The dashboard could not read the reconciliation sheet.</b>'+esc(e.message)+' The sheet has to be shared as “Anyone with the link – Viewer” for this page to read it.<br><button id="demo">Show the layout with demo data</button>',true);
      $('demo').onclick=function(){ S.demo=true; S.data=demoData(); fillMonths(); setStatus('off','DEMO DATA – not real figures'); banner('<b>Demo data.</b>Every company and number on this page is invented so the layout can be reviewed. Nothing here comes from Finanshels’ books.'); render(); }; }
  });
}

/* ============================ REVIEWER CLOSE / REOPEN ============================ */
function revCell(v,r){
  var k=encodeURIComponent(r.Key||''), by=r['Reviewed by']?esc(r['Reviewed by'])+(r['Reviewed at']?' · '+esc(r['Reviewed at']):''):'';
  if(r.Status==='Closed') return '<div class="rvn">“'+esc(r['Reviewer note'])+'”</div><div class="rvm">'+by+' · <button class="linkb" data-rv="reopen" data-k="'+k+'">Reopen</button></div>';
  if(r.Status==='Open') return '<button class="rbtn" data-rv="close" data-k="'+k+'"'+(CFG.REVIEW_URL||S.demo?'':' disabled title="The review service is not connected yet"')+'>Close – not an issue</button>'+(r.Review==='Reopened'?'<div class="rvm">Reopened · '+by+'</div>':'');
  return r['Reviewer note']?'<div class="rvn">“'+esc(r['Reviewer note'])+'”</div><div class="rvm">'+by+'</div>':'<span class="rvm">–</span>';
}
function reviewCall(p){
  if(S.demo&&p.action==='cadence') return Promise.resolve({ok:true,decision:p.decision==='Clear'?'':p.decision,note:p.decision==='Clear'?'':p.note,by:'demo',at:new Date().toISOString().slice(0,16).replace('T',' '),status:p.decision==='Churned'?'CHURNED':p.decision==='Paused'?'PAUSED':'STOPPED BILLING'});
  if(S.demo) return Promise.resolve({ok:true,decision:p.action==='close'?'Closed':'Open',note:p.note||'Reopened',by:'demo',at:new Date().toISOString().slice(0,16).replace('T',' ')});
  if(!CFG.REVIEW_URL) return Promise.reject(new Error('The review service is not connected yet.'));
  return new Promise(function(res,rej){
    var cb='__rv'+Date.now()+Math.floor(Math.random()*1e4), s=document.createElement('script'), done=false;
    function fin(){ done=true; clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); }
    var t=setTimeout(function(){ if(done) return; fin(); rej(new Error('No reply from the review service. Check you are signed in to your Finanshels Google account in this browser, then try again.')); },30000);
    window[cb]=function(d){ if(done) return; fin(); if(d&&d.ok) res(d); else rej(new Error((d&&d.error)||'The review could not be saved.')); };
    s.onerror=function(){ if(done) return; fin(); rej(new Error('Could not reach the review service. Make sure you are signed in to your Finanshels Google account in this browser.')); };
    s.src=CFG.REVIEW_URL+'?'+['action','key','note','decision'].map(function(k){return k+'='+encodeURIComponent(p[k]||'');}).join('&')+'&callback='+cb;
    document.head.appendChild(s);
  });
}
function toast(msg){ var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=msg; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(function(){ t.style.display='none'; },5000); }
function closeModal(){ var m=$('rvm'); if(m) m.classList.add('hide'); }
function openReview(mode,key){
  var r=(S.data&&S.data.exc||[]).filter(function(x){return x.Key===key;})[0]; if(!r) return;
  var m=$('rvm'); if(!m){ m=document.createElement('div'); m.id='rvm'; m.className='modal hide'; document.body.appendChild(m); }
  var close=mode==='close';
  m.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="rvt"><h2 id="rvt">'+(close?'Close as not an issue':'Reopen this exception')+'</h2>'+
    '<div class="mfacts"><b>'+esc(r.Check)+'</b>'+(r.Company?' · '+esc(r.Company):'')+(r.PR?' · '+esc(r.PR):'')+(num(r['AED impact'])?' · '+aed(r['AED impact']):'')+'</div>'+
    '<div class="mdet">'+esc(r.Detail||'')+'</div>'+
    '<label for="rvnote">'+(close?'Why is this not a real problem? <span class="req">(required)</span>':'Reason for reopening <span class="req">(optional)</span>')+'</label>'+
    '<textarea id="rvnote" maxlength="500" rows="4" placeholder="'+(close?'e.g. Client paid the balance on a second invoice (INV-001932) – the two invoices agree with the deal in total.':'')+'"></textarea>'+
    '<div class="mhint">'+(close?'The item stays on record with your note and name, and counts as passed in the accuracy figures (updated within about 2 minutes).':'The item goes back to Open and counts against accuracy again.')+'</div>'+
    '<div class="merr" id="rverr" role="alert"></div><div class="mact"><button class="lbtn" id="rvcancel">Cancel</button><button class="pbtn" id="rvgo">'+(close?'Close exception':'Reopen')+'</button></div></div>';
  m.classList.remove('hide'); $('rvnote').focus();
  $('rvcancel').onclick=closeModal; m.onclick=function(e){ if(e.target===m) closeModal(); };
  $('rvgo').onclick=function(){
    var b=this, note=$('rvnote').value.trim();
    if(close&&note.length<3){ $('rverr').textContent='Please write a short note explaining why this is not an issue.'; return; }
    b.disabled=true; b.textContent='Saving…'; $('rverr').textContent='';
    reviewCall({action:mode,key:key,note:note}).then(function(d){
      r.Status=d.decision==='Closed'?'Closed':(r.Status==='Resolved'?'Resolved':'Open');
      r.Review=d.decision==='Closed'?'Closed - not an issue':'Reopened'; r['Reviewer note']=d.note; r['Reviewed by']=d.by; r['Reviewed at']=d.at;
      closeModal(); render(); toast(close?'Closed. The accuracy figures update in about 2 minutes.':'Reopened.');
    }).catch(function(e){ $('rverr').textContent=e.message; b.disabled=false; b.textContent=close?'Close exception':'Reopen'; });
  };
}
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-rv]'); if(!b||b.disabled) return; e.preventDefault(); e.stopPropagation(); openReview(b.getAttribute('data-rv'),decodeURIComponent(b.getAttribute('data-k'))); },true);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

/* ============================ WIRING ============================ */
$('tabs').innerHTML=PAGES.map(function(p){return '<button class="tab" role="tab" data-page="'+p[0]+'">'+p[1]+'</button>';}).join('');
$('tabs').onclick=function(e){ var b=e.target.closest('.tab'); if(b){ S.page=b.dataset.page; try{history.replaceState(null,'','#'+S.page);}catch(x){} render(); } };
$('month').onchange=function(){ setMonth(this.value); };
$('refresh').onclick=function(){ if(S.demo){S.demo=false;S.data=null;} refresh(); };
document.addEventListener('click',function(e){
  var th=e.target.closest('th[data-col]'); if(th){ var id=th.closest('table').dataset.table,i=+th.dataset.col,s=S.sort[id]; S.sort[id]={i:i,d:s&&s.i===i?-s.d:1}; render(); return; }
  var m=e.target.closest('[data-month]'); if(m){ setMonth(m.getAttribute('data-month')); }
});
var hp=location.hash.replace('#',''); if(RENDER[hp]) S.page=hp;
render(); refresh(); setInterval(refresh, CFG.AUTO_REFRESH_MIN*60000);
</script>
